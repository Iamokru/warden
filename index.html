<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Warden — Creature &amp; Combat Manager</title>
<meta name="theme-color" content="#15130f">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Warden">
<style>
:root{
  --bg:#15130f;
  --bg-alt:#1b1812;
  --surface:#211d16;
  --surface2:#2a251b;
  --surface3:#332c1f;
  --border:#3d3524;
  --border-soft:#2c271b;
  --text:#e9e0c9;
  --text-dim:#a99d7f;
  --text-faint:#766b53;
  --gold:#c9a227;
  --gold-dim:#8a7220;
  --blood:#b1402f;
  --blood-bright:#d65a44;
  --good:#5b8c5a;
  --mid:#c9a227;
  --bad:#b1402f;
  --dead:#5a5142;
  --info:#5a86a3;
  --radius:6px;
  --radius-lg:10px;
  --shadow: 0 4px 18px rgba(0,0,0,0.45);
  --font-display: Georgia, 'Iowan Old Style', 'Palatino Linotype', Palatino, serif;
  --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --font-mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
}
:root.light{
  --bg:#f3ede0;
  --bg-alt:#ece3d0;
  --surface:#fbf7ec;
  --surface2:#f1e9d6;
  --surface3:#e6dcc2;
  --border:#d8caa3;
  --border-soft:#e4d9b8;
  --text:#2b2418;
  --text-dim:#5f5540;
  --text-faint:#8a7f63;
  --gold:#96751a;
  --gold-dim:#b3922f;
  --blood:#9c3323;
  --blood-bright:#b1402f;
  --shadow: 0 4px 18px rgba(90,70,20,0.15);
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
}
#app{min-height:100vh;display:flex;}
::selection{background:var(--gold-dim);color:#111;}
a{color:inherit;}
button{font-family:inherit;}
input,select,textarea{font-family:inherit;}

/* Scrollbar */
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--surface3);border-radius:8px;}
::-webkit-scrollbar-thumb:hover{background:var(--gold-dim);}

/* ===== Layout ===== */
.sidebar{
  width:216px;flex:0 0 216px;background:var(--bg-alt);border-right:1px solid var(--border-soft);
  display:flex;flex-direction:column;padding:16px 10px;position:sticky;top:0;height:100vh;overflow-y:auto;
}
.brand{
  display:flex;align-items:center;gap:10px;padding:6px 10px 18px 10px;border-bottom:1px solid var(--border-soft);margin-bottom:12px;
}
.brand-mark{
  width:34px;height:34px;border-radius:8px;background:linear-gradient(155deg,var(--blood),var(--blood-bright));
  display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;color:#fff0dc;font-size:18px;
  flex:0 0 auto;box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
}
.brand-text{font-family:var(--font-display);font-size:19px;letter-spacing:0.3px;}
.brand-sub{font-size:10px;color:var(--text-faint);text-transform:uppercase;letter-spacing:1.4px;margin-top:1px;}

.nav-group{margin-bottom:4px;}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--radius);cursor:pointer;
  color:var(--text-dim);font-size:14px;margin-bottom:2px;user-select:none;border:1px solid transparent;
  transition:background .12s, color .12s;
}
.nav-item:hover{background:var(--surface);color:var(--text);}
.nav-item.active{background:var(--surface2);color:var(--gold);border-color:var(--border);}
.nav-icon{width:18px;text-align:center;flex:0 0 auto;font-size:15px;opacity:.9;}
.nav-spacer{flex:1;}
.nav-foot{margin-top:auto;padding-top:10px;border-top:1px solid var(--border-soft);}

.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  position:sticky;top:0;z-index:20;background:rgba(21,19,15,0.92);backdrop-filter:blur(6px);
  border-bottom:1px solid var(--border-soft);padding:12px 22px;display:flex;align-items:center;gap:14px;
}
:root.light .topbar{background:rgba(243,237,224,0.92);}
.topbar h1{font-family:var(--font-display);font-size:20px;margin:0;font-weight:600;}
.topbar .crumb{color:var(--text-faint);font-size:12px;}
.content{padding:20px 22px 80px 22px;flex:1;}

.mobile-tabbar{display:none;}
.mobile-topbar{display:none;}

@media (max-width:880px){
  .sidebar{display:none;}
  .mobile-topbar{
    display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border-soft);
    background:var(--bg-alt);position:sticky;top:0;z-index:30;
  }
  .content{padding:14px 12px 84px 12px;}
  .topbar{padding:10px 14px;}
  .mobile-tabbar{
    display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--bg-alt);border-top:1px solid var(--border-soft);
    z-index:30;padding:4px 2px calc(env(safe-area-inset-bottom,0px) + 2px) 2px;
  }
  .mobile-tabbar .tab{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;color:var(--text-faint);font-size:9.5px;
    border-radius:8px;min-height:44px;justify-content:center;
  }
  .mobile-tabbar .tab.active{color:var(--gold);}
  .mobile-tabbar .tab .nav-icon{font-size:16px;}

  /* iOS Safari zooms the whole page in when a focused input's font is under 16px —
     the single biggest cause of "everything looks broken" the instant you tap a field. */
  input[type=text],input[type=number],input[type=search],select,textarea{font-size:16px;}

  /* Slightly denser chrome so more of the actual content fits without feeling cramped */
  .modal-overlay{padding:8px;align-items:flex-end;}
  .modal{max-height:94vh;border-radius:var(--radius-lg) var(--radius-lg) 0 0;}
  .modal-head{padding:12px 14px;}
  .modal-body{padding:12px 14px;}
  .modal-foot{padding:10px 14px;flex-wrap:wrap;}
  .card{padding:12px;}
  .tab-btn{padding:7px 10px;font-size:12.5px;}
  .btn-icon,.btn-ghost.btn-icon{min-width:38px;min-height:38px;}
  .combat-toolbar{padding:8px 10px;gap:8px;}
  .statgrid .stat-box, .ability-edit-grid .stat-box{padding:6px 3px;}
}

/* ===== Typography ===== */
h1,h2,h3{font-family:var(--font-display);font-weight:600;margin:0 0 4px 0;}
h2{font-size:18px;}
h3{font-size:15px;}
.muted{color:var(--text-dim);}
.faint{color:var(--text-faint);}
.small{font-size:12px;}
.section-title{
  font-family:var(--font-display);font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--gold);
  display:flex;align-items:center;gap:8px;margin:0 0 10px 0;
}

/* ===== Buttons ===== */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:var(--radius);
  padding:8px 14px;font-size:13px;cursor:pointer;transition:background .12s,border-color .12s,transform .05s;white-space:nowrap;
}
.btn:hover{background:var(--surface3);border-color:var(--gold-dim);}
.btn:active{transform:translateY(1px);}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.btn-primary{background:linear-gradient(155deg,var(--blood),#8f3122);border-color:var(--blood);color:#fdf0e6;}
.btn-primary:hover{background:linear-gradient(155deg,var(--blood-bright),var(--blood));}
.btn-gold{background:linear-gradient(155deg,#7a611c,var(--gold-dim));border-color:var(--gold-dim);color:#1c1608;font-weight:600;}
.btn-gold:hover{filter:brightness(1.12);}
.btn-ghost{background:transparent;border-color:transparent;}
.btn-ghost:hover{background:var(--surface);}
.btn-danger{background:transparent;border-color:var(--blood);color:var(--blood-bright);}
.btn-danger:hover{background:rgba(177,64,47,0.14);}
.btn-sm{padding:5px 9px;font-size:12px;border-radius:5px;}
.btn-xs{padding:3px 7px;font-size:11px;border-radius:4px;}
.btn-icon{padding:7px 9px;}
.btn-block{width:100%;}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;}

/* ===== Cards / surfaces ===== */
.card{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius-lg);padding:16px;}
.card + .card{margin-top:12px;}
.panel{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius-lg);}
.grid{display:grid;gap:12px;}
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;}
.hr{height:1px;background:var(--border-soft);margin:14px 0;border:none;}

/* ===== Forms ===== */
label.field-label{display:block;font-size:11.5px;color:var(--text-dim);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px;}
.field{margin-bottom:12px;}
input[type=text],input[type=number],input[type=search],select,textarea{
  width:100%;background:var(--bg-alt);border:1px solid var(--border);color:var(--text);border-radius:var(--radius);
  padding:8px 10px;font-size:13.5px;outline:none;transition:border-color .12s;
}
input:focus,select:focus,textarea:focus{border-color:var(--gold-dim);}
textarea{resize:vertical;min-height:64px;line-height:1.5;}
.field-row{display:flex;gap:10px;flex-wrap:wrap;}
.field-row > .field{flex:1;min-width:110px;}
.checkbox-row{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--text-dim);cursor:pointer;}
.checkbox-row input{width:auto;}
.hint{font-size:11px;color:var(--text-faint);margin-top:3px;}

/* ===== Badges / pills ===== */
.pill{
  display:inline-flex;align-items:center;gap:4px;background:var(--surface2);border:1px solid var(--border);
  padding:3px 9px;border-radius:99px;font-size:11px;color:var(--text-dim);
}
.pill-gold{border-color:var(--gold-dim);color:var(--gold);}
.pill-blood{border-color:var(--blood);color:var(--blood-bright);}
.pill button{background:none;border:none;color:inherit;cursor:pointer;padding:0;margin-left:2px;font-size:12px;line-height:1;}
.tag-list{display:flex;flex-wrap:wrap;gap:6px;}

/* ===== Creature cards ===== */
.creature-card{
  background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius-lg);padding:14px;cursor:pointer;
  transition:border-color .12s, transform .08s;display:flex;flex-direction:column;gap:8px;
}
.creature-card:hover{border-color:var(--gold-dim);transform:translateY(-1px);}
.cc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.cc-name{font-family:var(--font-display);font-size:16px;font-weight:600;}
.cc-meta{color:var(--text-faint);font-size:11.5px;}
.cc-stats{display:flex;gap:14px;font-size:12px;color:var(--text-dim);}
.cc-stats b{color:var(--text);}
.star{cursor:pointer;color:var(--text-faint);font-size:16px;user-select:none;}
.star.active{color:var(--gold);}

/* ===== HP bar ===== */
.hpbar-wrap{background:var(--bg-alt);border:1px solid var(--border);border-radius:99px;height:9px;overflow:hidden;position:relative;}
.hpbar-fill{height:100%;transition:width .2s ease;}
.hp-good{background:var(--good);}
.hp-mid{background:var(--mid);}
.hp-bad{background:var(--bad);}
.hp-dead{background:var(--dead);}

/* ===== Modal ===== */
.modal-overlay{
  position:fixed;inset:0;background:rgba(10,8,5,0.6);display:flex;align-items:center;justify-content:center;
  z-index:100;padding:16px;
}
.modal{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow);
  width:100%;max-width:560px;max-height:88vh;display:flex;flex-direction:column;
}
.modal.modal-lg{max-width:820px;}
.modal.modal-xl{max-width:1080px;}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--border-soft);}
.modal-body{padding:16px 18px;overflow-y:auto;overflow-wrap:break-word;word-break:break-word;}
.modal-foot{padding:12px 18px;border-top:1px solid var(--border-soft);display:flex;justify-content:flex-end;gap:8px;}
.modal-close{cursor:pointer;color:var(--text-faint);font-size:20px;background:none;border:none;line-height:1;}
.modal-close:hover{color:var(--text);}

/* ===== Toast ===== */
#toast-wrap{position:fixed;bottom:18px;right:18px;z-index:200;display:flex;flex-direction:column;gap:8px;}
@media (max-width:880px){#toast-wrap{bottom:74px;right:10px;left:10px;}}
.toast{
  background:var(--surface3);border:1px solid var(--border);border-left:3px solid var(--gold);color:var(--text);
  padding:10px 14px;border-radius:var(--radius);font-size:13px;box-shadow:var(--shadow);animation:slideIn .18s ease;max-width:340px;
}
.toast.err{border-left-color:var(--blood-bright);}
@keyframes slideIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

/* ===== Collapsible section ===== */
.collapse{border:1px solid var(--border-soft);border-radius:var(--radius-lg);margin-bottom:10px;overflow:hidden;background:var(--surface);}
.collapse-head{
  display:flex;align-items:center;justify-content:space-between;padding:11px 14px;cursor:pointer;user-select:none;
  background:var(--surface2);
}
.collapse-head:hover{background:var(--surface3);}
.collapse-title{display:flex;align-items:center;gap:8px;font-family:var(--font-display);font-size:14px;}
.collapse-body{padding:14px;}
.collapse.closed .collapse-body{display:none;}
.chev{transition:transform .15s;font-size:11px;color:var(--text-faint);}
.collapse.closed .chev{transform:rotate(-90deg);}

/* ===== Stat block display ===== */
.statgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;}
@media (max-width:600px){.statgrid{grid-template-columns:repeat(3,1fr);}}
@media (max-width:400px){.statgrid{grid-template-columns:repeat(2,1fr);}}
.ability-edit-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;}
@media (max-width:700px){.ability-edit-grid{grid-template-columns:repeat(3,1fr);}}
@media (max-width:420px){.ability-edit-grid{grid-template-columns:repeat(2,1fr);}}
.grid-2col{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media (max-width:760px){.grid-2col{grid-template-columns:1fr;}}
.sheet-grid{display:grid;grid-template-columns:2fr 1fr;gap:16px;}
@media (max-width:880px){.sheet-grid{grid-template-columns:1fr;}}
.battlemap-layout{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start;}
.battlemap-canvas-col{flex:1;min-width:280px;}
.battlemap-panel-col{width:260px;flex:0 0 260px;}
.battlemap-canvas{width:100%;height:60vh;background:#0a0906;border-radius:var(--radius);border:1px solid var(--border);touch-action:none;display:block;}
@media (max-width:700px){
  .battlemap-panel-col{width:100%;flex:1 1 100%;}
  .battlemap-canvas{height:48vh;}
}
.stat-box{background:var(--bg-alt);border:1px solid var(--border-soft);border-radius:var(--radius);padding:8px 4px;text-align:center;}
.stat-box .ab{font-size:10px;color:var(--text-faint);text-transform:uppercase;letter-spacing:1px;}
.stat-box .score{font-family:var(--font-display);font-size:19px;margin:2px 0;}
.stat-box .mod{font-size:11.5px;color:var(--gold);}

.entry-row{border:1px solid var(--border-soft);border-radius:var(--radius);padding:10px 12px;margin-bottom:8px;background:var(--bg-alt);}
.entry-row-head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;}
.entry-name{font-weight:600;font-size:13.5px;}
.entry-name i{color:var(--text-faint);font-weight:400;font-size:12px;}
.entry-desc{font-size:12.5px;color:var(--text-dim);margin-top:4px;line-height:1.5;white-space:pre-wrap;}

/* ===== Combat dashboard ===== */
.combat-toolbar{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--border-soft);
  border-radius:var(--radius-lg);padding:10px 14px;margin-bottom:14px;position:sticky;top:64px;z-index:15;
}
@media (max-width:880px){.combat-toolbar{position:static;}}
.round-badge{font-family:var(--font-display);font-size:15px;background:var(--surface2);padding:6px 14px;border-radius:99px;border:1px solid var(--border);}
.combat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;}
.pcard{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius-lg);padding:13px;position:relative;}
.pcard.current-turn{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold), var(--shadow);}
.pcard.dead{opacity:.55;}
.pcard-head{display:flex;justify-content:space-between;align-items:flex-start;gap:6px;margin-bottom:8px;}
.pcard-name{font-family:var(--font-display);font-size:15.5px;}
.pcard-init{background:var(--bg-alt);border:1px solid var(--border);border-radius:6px;padding:3px 8px;font-size:12.5px;text-align:center;min-width:30px;}
.hp-row{display:flex;align-items:center;gap:8px;margin:6px 0 4px 0;font-size:12.5px;}
.hp-num{font-family:var(--font-mono);font-size:13px;white-space:nowrap;}
.hp-btns{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px;}
.hp-btns .btn{flex:1;min-width:32px;padding:5px 4px;font-size:11.5px;}
.dmg-heal-row{display:flex;gap:6px;margin-top:6px;}
.dmg-heal-row input{flex:1;}
.cond-chip{
  display:inline-flex;align-items:center;gap:4px;background:rgba(177,64,47,0.14);border:1px solid var(--blood);
  color:var(--blood-bright);padding:2px 8px;border-radius:99px;font-size:10.5px;margin:2px 4px 0 0;
}
.cond-chip button{background:none;border:none;color:inherit;cursor:pointer;font-size:11px;padding:0;}
.mini-stats{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--text-dim);margin-top:6px;}
.mini-stats b{color:var(--text);}

/* ===== Empty state ===== */
.empty{text-align:center;padding:50px 20px;color:var(--text-faint);}
.empty .glyph{font-size:34px;margin-bottom:10px;opacity:.7;}
.empty h3{color:var(--text-dim);margin-bottom:6px;}

/* ===== Dice ===== */
.dice-display{
  background:var(--bg-alt);border:1px solid var(--border);border-radius:var(--radius-lg);padding:22px;text-align:center;
}
.dice-total{font-family:var(--font-display);font-size:52px;color:var(--gold);line-height:1;}
.dice-breakdown{color:var(--text-dim);font-size:13px;margin-top:8px;font-family:var(--font-mono);}
.dice-log-item{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border-soft);font-size:12.5px;}
.d20-quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:8px;}

/* Tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border-soft);margin-bottom:14px;flex-wrap:wrap;}
.tab-btn{padding:8px 13px;background:none;border:none;color:var(--text-faint);cursor:pointer;font-size:13px;border-bottom:2px solid transparent;margin-bottom:-1px;}
.tab-btn:hover{color:var(--text);}
.tab-btn.active{color:var(--gold);border-color:var(--gold);}

/* Search bar */
.search-bar{position:relative;flex:1;min-width:180px;}
.search-bar input{padding-left:30px;}
.search-bar .si{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text-faint);font-size:13px;}

/* misc */
.flex{display:flex;}
.flex-between{display:flex;justify-content:space-between;align-items:center;}
.flex-wrap{flex-wrap:wrap;}
.gap6{gap:6px;}.gap8{gap:8px;}.gap10{gap:10px;}.gap14{gap:14px;}
.mt6{margin-top:6px;}.mt10{margin-top:10px;}.mt14{margin-top:14px;}.mt20{margin-top:20px;}
.mb6{margin-bottom:6px;}.mb10{margin-bottom:10px;}
.w100{width:100%;}
.link-btn{background:none;border:none;color:var(--gold);cursor:pointer;font-size:12.5px;padding:0;text-decoration:underline;}
.kbd{background:var(--surface3);border:1px solid var(--border);border-radius:3px;padding:1px 5px;font-size:10.5px;font-family:var(--font-mono);}
.loading-screen{display:flex;align-items:center;justify-content:center;height:100vh;width:100%;color:var(--text-faint);font-family:var(--font-display);}
textarea.mono{font-family:var(--font-mono);font-size:12px;}
.badge-count{background:var(--surface3);color:var(--text-dim);border-radius:99px;padding:0 7px;font-size:10.5px;}
</style>
</head>
<body>
<div id="app"><div class="loading-screen">Loading the ledger…</div></div>
<div id="toast-wrap"></div>
<script>

/* ===================================================================
   WARDEN — D&D Creature & Combat Manager
   Single-file vanilla JS app. Fully offline: persists to this
   browser's own localStorage, no server, no account, no network
   calls of any kind. Use Import/Export to move data between
   computers or browsers. All logic lives in this file.
=================================================================== */

/* ---------------------------------------------------------------

function uid(prefix){
  // Prefer a real UUID (globally unique, sync-safe) when available; fall back gracefully.
  if(window.crypto && window.crypto.randomUUID) return (prefix?prefix+'_':'') + window.crypto.randomUUID();
  return (prefix||'id')+'_'+Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4)+'_'+Math.random().toString(36).slice(2,6);
}
function nowISO(){ return new Date().toISOString(); }
let _deviceIdCache = null;
function getDeviceId(){
  if(_deviceIdCache) return _deviceIdCache;
  // Best-effort synchronous fallback before the async IndexedDB-backed one loads;
  // real code paths call ensureDeviceId() during init() before any saves happen.
  _deviceIdCache = (window.__wardenDeviceId) || 'device-pending';
  return _deviceIdCache;
}
function setDeviceIdCache(id){ _deviceIdCache = id; window.__wardenDeviceId = id; }
function stampSync(obj){
  // Call after mutating any syncable object to bump its change metadata.
  obj.updatedAt = nowISO();
  obj.deviceId = getDeviceId();
  obj.version = (obj.version||0) + 1;
  return obj;
}

/* ---------------------------------------------------------------
   3. STORAGE — local-first, fully offline.
   Primary backend: IndexedDB (large capacity, structured, survives
   for as long as the user keeps the site's data). Falls back to
   localStorage, then to in-memory-only with a visible warning if
   neither is available (e.g. some locked-down private modes).
   GitHub (section 20+) is an OPTIONAL sync layer on top of this —
   the app is fully functional with it disconnected forever.
--------------------------------------------------------------- */
function defaultDB(){
  return { templates:[], campaigns:[], maps:[], playerCharacters:[], modifiers:[], recentGlobal:[], recentGlobalPc:[], settings:{ darkMode:true }, version:1 };
}

const IDB_NAME = 'warden-db';
const IDB_VERSION = 1;
let _idbHandle = null;
function openIDB(){
  return new Promise((resolve,reject)=>{
    if(!window.indexedDB){ reject(new Error('IndexedDB not available')); return; }
    let req;
    try{ req = window.indexedDB.open(IDB_NAME, IDB_VERSION); }
    catch(e){ reject(e); return; }
    req.onupgradeneeded = (e)=>{
      const db = e.target.result;
      if(!db.objectStoreNames.contains('kv')) db.createObjectStore('kv');
      if(!db.objectStoreNames.contains('snapshots')) db.createObjectStore('snapshots', {keyPath:'id'});
    };
    req.onsuccess = (e)=> resolve(e.target.result);
    req.onerror = (e)=> reject(e.target.error || new Error('IndexedDB open failed'));
    req.onblocked = ()=> reject(new Error('IndexedDB blocked'));
  });
}
async function getIDB(){
  if(_idbHandle) return _idbHandle;
  _idbHandle = await openIDB();
  return _idbHandle;
}
async function idbGet(key){
  const db = await getIDB();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction('kv','readonly');
    const req = tx.objectStore('kv').get(key);
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error);
  });
}
async function idbSet(key, value){
  const db = await getIDB();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction('kv','readwrite');
    tx.objectStore('kv').put(value, key);
    tx.oncomplete = ()=>resolve(true);
    tx.onerror = ()=>reject(tx.error);
  });
}
async function idbAddSnapshot(snap){
  const db = await getIDB();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction('snapshots','readwrite');
    tx.objectStore('snapshots').put(snap);
    tx.oncomplete = ()=>resolve(true);
    tx.onerror = ()=>reject(tx.error);
  });
}
async function idbListSnapshots(){
  const db = await getIDB();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction('snapshots','readonly');
    const req = tx.objectStore('snapshots').getAll();
    req.onsuccess = ()=>resolve(req.result||[]);
    req.onerror = ()=>reject(req.error);
  });
}
async function idbDeleteSnapshot(id){
  const db = await getIDB();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction('snapshots','readwrite');
    tx.objectStore('snapshots').delete(id);
    tx.oncomplete = ()=>resolve(true);
    tx.onerror = ()=>reject(tx.error);
  });
}

async function ensureDeviceId(){
  let id = null;
  try{
    if(UI.storageBackend==='indexeddb'){
      id = await idbGet('deviceId');
      if(!id){ id = 'device-'+uid(); await idbSet('deviceId', id); }
    } else if(UI.storageBackend==='localstorage'){
      id = window.localStorage.getItem('warden-device-id');
      if(!id){ id = 'device-'+uid(); window.localStorage.setItem('warden-device-id', id); }
    }
  }catch(e){ id = null; }
  if(!id) id = 'device-session-'+Math.random().toString(36).slice(2,10); // memory-only fallback, not persisted
  setDeviceIdCache(id);
}

async function loadDB(){
  // Determine the best available persistence backend, local-first, no network involved.
  try{
    await getIDB();
    UI.storageBackend = 'indexeddb';
  }catch(e){
    UI.storageBackend = localStorageAvailable() ? 'localstorage' : 'memory';
  }
  UI.hasLocalStorage = UI.storageBackend !== 'memory';
  await ensureDeviceId();

  try{
    let raw = null;
    if(UI.storageBackend==='indexeddb'){
      raw = await idbGet(STORAGE_KEY);
      if(raw===undefined) raw = null;
      // One-time migration: earlier versions of this app used localStorage.
      if(!raw && localStorageAvailable()){
        const legacy = window.localStorage.getItem(STORAGE_KEY);
        if(legacy){ raw = legacy; await idbSet(STORAGE_KEY, legacy); }
      }
    } else if(UI.storageBackend==='localstorage'){
      raw = window.localStorage.getItem(STORAGE_KEY);
    }
    if(raw){
      DB = typeof raw === 'string' ? JSON.parse(raw) : raw;
      if(!DB.templates) DB.templates=[];
      if(!DB.campaigns) DB.campaigns=[];
      if(!DB.recentGlobal) DB.recentGlobal=[];
      if(!DB.maps) DB.maps=[];
      if(!DB.playerCharacters) DB.playerCharacters=[];
      if(!DB.modifiers) DB.modifiers=[];
      if(!DB.recentGlobalPc) DB.recentGlobalPc=[];
      DB.campaigns.forEach(c=>{ if(!c.playerCharacterRefs) c.playerCharacterRefs=[]; });
      if(!DB.settings) DB.settings={darkMode:true};
    } else {
      DB = defaultDB();
    }
  }catch(e){
    DB = defaultDB();
  }
  UI.darkMode = DB.settings.darkMode !== false;
  applyTheme();
  await loadSyncMeta();
}

function scheduleSave(){

  renderSaveIndicator();
  if(UI.saveTimer) clearTimeout(UI.saveTimer);
  UI.saveTimer = setTimeout(persistNow, 300);

async function persistNow(){
  if(!UI.hasLocalStorage){
    UI.saveState = 'error';
    renderSaveIndicator();
    return;
  }
  try{
    DB.settings.darkMode = UI.darkMode;
    const payload = JSON.stringify(DB);
    if(UI.storageBackend==='indexeddb') await idbSet(STORAGE_KEY, payload);
    else window.localStorage.setItem(STORAGE_KEY, payload);
    UI.saveState = 'saved';
    updateSyncPendingCount();
  }catch(e){
    // Most likely quota exceeded — data is too large for available storage.
    UI.saveState = 'error';
    toast('Save failed — your data may be too large for local storage. Export a backup now to be safe.', true);
  }
  renderSaveIndicator();
}

/* ---------------------------------------------------------------
   5. DICE / MATH UTILS
--------------------------------------------------------------- */
function abilityMod(score){
  if(score===null||score===undefined||score==='') return 0;
  return Math.floor((Number(score)-10)/2);
}
function fmtMod(n){
  n = Math.round(n);
  return (n>=0?'+':'') + n;
}
function getAbilMod(creature, ab){
  const a = creature.abilities && creature.abilities[ab];
  if(!a) return 0;
  if(a.modOverride!==null && a.modOverride!==undefined && a.modOverride!=='') return Number(a.modOverride);
  return abilityMod(a.score);
}
function getSaveBonus(creature, ab){
  const s = creature.saves && creature.saves[ab];
  if(!s) return getAbilMod(creature, ab);
  if(s.customBonus!==null && s.customBonus!==undefined && s.customBonus!=='') return Number(s.customBonus);
  const prof = Number(creature.profBonus)||0;
  return getAbilMod(creature, ab) + (s.proficient ? prof : 0);
}
function passivePerception(creature){
  if(creature.senses && creature.senses.passivePerception!==null && creature.senses.passivePerception!==undefined && creature.senses.passivePerception!=='')
    return Number(creature.senses.passivePerception);
  const perc = (creature.skills||[]).find(s=> (s.name||'').toLowerCase()==='perception');
  const bonus = perc ? Number(perc.bonus||0) : getAbilMod(creature,'wis');
  return 10 + bonus;
}

// Roll a single die
function rollDie(sides){ return 1 + Math.floor(Math.random()*sides); }

// Parse & roll an expression like "2d20+5", "3d8-1", supports adv/disadv marker handled separately for d20 single rolls
function rollExpression(expr){
  expr = (expr||'').toString().trim().toLowerCase().replace(/\s+/g,'');
  if(!expr) return null;
  // tokenize into terms with leading sign
  const termRe = /([+-]?)(\d*d\d+|\d+)/g;
  let m, terms=[], valid=false;
  while((m = termRe.exec(expr))){
    valid = true;
    const sign = m[1]==='-' ? -1 : 1;
    const tok = m[2];
    if(tok.indexOf('d')>=0){
      let [countStr, sidesStr] = tok.split('d');
      const count = countStr==='' ? 1 : parseInt(countStr,10);
      const sides = parseInt(sidesStr,10);
      if(!sides || count<1 || count>200) return null;
      terms.push({type:'dice', sign, count, sides});
    } else {
      terms.push({type:'flat', sign, value: parseInt(tok,10)});
    }
  }
  if(!valid) return null;
  let total = 0; const rolls=[]; const parts=[];
  terms.forEach(t=>{
    if(t.type==='dice'){
      const rs=[];
      for(let i=0;i<t.count;i++) rs.push(rollDie(t.sides));
      const sub = rs.reduce((a,b)=>a+b,0)*t.sign;
      total += sub;
      rolls.push({sides:t.sides, count:t.count, values:rs, sign:t.sign});
      parts.push((t.sign<0?'-':(parts.length?'+':'')) + t.count+'d'+t.sides+'('+rs.join(',')+')');
    } else {
      total += t.value*t.sign;
      parts.push((t.sign<0?'-':(parts.length?'+':'')) + t.value);
    }
  });
  return { expr, total, rolls, breakdown: parts.join(' ') };
}

function rollD20(mode){ // mode: 'normal'|'adv'|'disadv'
  const a = rollDie(20);
  if(mode==='normal') return {value:a, rolls:[a], mode};
  const b = rollDie(20);
  const value = mode==='adv' ? Math.max(a,b) : Math.min(a,b);
  return {value, rolls:[a,b], mode};
}

/* ---------------------------------------------------------------
   6. STAT-BLOCK IMPORTER (best-effort parser)
--------------------------------------------------------------- */
function parseStatBlock(text){
  const c = blankCreature();
  const raw = text.replace(/\r/g,'');
  const lines = raw.split('\n').map(l=>l.trim()).filter(l=>l.length);
  if(!lines.length) return c;

  c.name = lines[0].replace(/^#+\s*/,'').trim() || 'Imported Creature';

  // Type line: "Medium humanoid (goblinoid), neutral evil"
  const typeLine = lines.slice(1,4).find(l=> new RegExp('^('+SIZES.join('|')+')','i').test(l));
  if(typeLine){
    const m = typeLine.match(/^(\w+)\s+([a-zA-Z ]+?)(?:\s*\(([^)]+)\))?,?\s*(.*)$/);
    if(m){
      c.size = SIZES.find(s=>s.toLowerCase()===m[1].toLowerCase()) || m[1];
      c.type = (m[2]||'').trim();
      c.subtype = (m[3]||'').trim();
      c.alignment = (m[4]||'').trim();
    }
  }

  const findVal = (re) => { const l = raw.match(re); return l ? l[1].trim() : ''; };

  c.acDesc = findVal(/Armor Class\s*[:\-]?\s*(\d+[^\n]*)/i);
  const acNum = c.acDesc.match(/\d+/);
  c.ac = acNum ? Number(acNum[0]) : null;

  const hpLine = findVal(/Hit Points\s*[:\-]?\s*([^\n]+)/i);
  const hpNum = hpLine.match(/\d+/);
  c.maxHP = hpNum ? Number(hpNum[0]) : null;
  const hd = hpLine.match(/\(([^)]+)\)/);
  c.hitDice = hd ? hd[1] : '';

  const speedLine = findVal(/Speed\s*[:\-]?\s*([^\n]+)/i);
  if(speedLine){
    const walk = speedLine.match(/^(\d+)\s*ft/); if(walk) c.speed.walk = Number(walk[1]);
    ['burrow','climb','fly','swim'].forEach(k=>{
      const rx = new RegExp(k+'\\s*(\\d+)\\s*ft','i');
      const mm = speedLine.match(rx); if(mm) c.speed[k] = Number(mm[1]);
    });
  }

  // Ability score table — supports "STR DEX CON INT WIS CHA" header followed by numeric rows,
  // or inline "STR 18 (+4)" style tokens.
  ABILS.forEach(ab=>{
    const label = ABIL_LABEL[ab];
    const rx = new RegExp(label+'\\s*[:\\-]?\\s*(\\d+)\\s*(?:\\(([+\\-]?\\d+)\\))?', 'i');
    const m = raw.match(rx);
    if(m){ c.abilities[ab].score = Number(m[1]); }
  });

  // Saving Throws
  const saveLine = findVal(/Saving Throws\s*[:\-]?\s*([^\n]+)/i);
  if(saveLine){
    ABILS.forEach(ab=>{
      const rx = new RegExp(ABIL_LABEL[ab]+'\\s*([+\\-]\\d+)','i');
      const m = saveLine.match(rx);
      if(m){ c.saves[ab].proficient = true; c.saves[ab].customBonus = Number(m[1]); }
    });
  }
  // Skills
  const skillLine = findVal(/Skills\s*[:\-]?\s*([^\n]+)/i);
  if(skillLine){
    skillLine.split(',').forEach(part=>{
      const m = part.trim().match(/^([A-Za-z ]+)\s*([+\-]\d+)$/);
      if(m) c.skills.push({id:uid('sk'), name:m[1].trim().toLowerCase(), bonus:Number(m[2]), custom:false});
    });
  }
  c.resistances = findVal(/Damage Resistances\s*[:\-]?\s*([^\n]+)/i);
  c.immunities = findVal(/Damage Immunities\s*[:\-]?\s*([^\n]+)/i);
  c.vulnerabilities = findVal(/Damage Vulnerabilities\s*[:\-]?\s*([^\n]+)/i);
  const condImm = findVal(/Condition Immunities\s*[:\-]?\s*([^\n]+)/i);
  if(condImm) c.conditionImmunities = condImm.split(',').map(s=>s.trim()).filter(Boolean);

  const sensesLine = findVal(/Senses\s*[:\-]?\s*([^\n]+)/i);
  if(sensesLine){
    ['darkvision','blindsight','tremorsense','truesight'].forEach(k=>{
      const rx = new RegExp(k+'\\s*(\\d+)\\s*ft','i');
      const m = sensesLine.match(rx); if(m) c.senses[k]=Number(m[1]);
    });
    const pp = sensesLine.match(/passive Perception\s*(\d+)/i);
    if(pp) c.senses.passivePerception = Number(pp[1]);
  }
  const langLine = findVal(/Languages\s*[:\-]?\s*([^\n]+)/i);
  if(langLine) c.languages = langLine.split(',').map(s=>s.trim()).filter(Boolean).filter(l=>!/^—$|^-$/.test(l));

  const crLine = findVal(/Challenge\s*[:\-]?\s*([^\n(]+)(?:\(([^)]+)\))?/i);
  if(crLine){ c.cr = crLine.trim(); }
  const xpMatch = raw.match(/Challenge[^\n]*\((\d[\d,]*)\s*XP\)/i);
  if(xpMatch) c.xp = xpMatch[1].replace(/,/g,'');
  const pbMatch = raw.match(/Proficiency Bonus\s*[:\-]?\s*\+?(\d+)/i);
  if(pbMatch) c.profBonus = Number(pbMatch[1]);

  // Section-based blocks: Traits (until "Actions"), Actions (until "Bonus Actions"/"Reactions"/"Legendary"),
  // Bonus Actions, Reactions, Legendary Actions, Lair Actions.
  const sectionNames = ['Actions','Bonus Actions','Reactions','Legendary Actions','Lair Actions'];
  const idxOf = (name) => raw.search(new RegExp('\\n\\s*'+name+'\\s*\\n','i'));
  const boundaries = [];
  sectionNames.forEach(n=>{ const i = idxOf(n); if(i>=0) boundaries.push({name:n, idx:i}); });
  boundaries.sort((a,b)=>a.idx-b.idx);

  // Traits: text between end of stat header block and first boundary (or Senses/Languages line end)
  let traitsStart = 0;
  const afterLang = raw.search(/Languages[^\n]*\n/i);
  if(afterLang>=0) traitsStart = afterLang + raw.slice(afterLang).indexOf('\n') + 1;
  const traitsEnd = boundaries.length ? boundaries[0].idx : raw.length;
  const traitsBlock = raw.slice(traitsStart, traitsEnd).trim();
  c.traits = parseEntries(traitsBlock);

  for(let i=0;i<boundaries.length;i++){
    const b = boundaries[i];
    const end = (i+1<boundaries.length) ? boundaries[i+1].idx : raw.length;
    const block = raw.slice(b.idx, end).replace(new RegExp('^\\s*'+b.name+'\\s*\\n?','i'),'').trim();
    if(b.name==='Actions') c.actions = parseEntries(block);
    else if(b.name==='Bonus Actions') c.bonusActions = parseEntries(block);
    else if(b.name==='Reactions') c.reactions = parseEntries(block);
    else if(b.name==='Legendary Actions'){
      const limMatch = block.match(/can take (\d+) legendary actions/i);
      c.legendary.limit = limMatch ? Number(limMatch[1]) : 3;
      const entries = parseEntries(block.replace(/^[^\n]*legendary actions[^\n]*\n?/i,''));
      c.legendary.actions = entries.map(e=>({id:e.id,name:e.name,description:e.description,cost:1}));
    }
    else if(b.name==='Lair Actions'){
      c.lairActions = parseEntries(block);
    }
  }

  // parse action attack bonus/damage into structured fields where possible
  c.actions.forEach(a=>{
    const atk = a.description.match(/([+\-]\d+)\s*to hit/i);
    if(atk) a.attackBonus = atk[1];
    const dmg = a.description.match(/(\d+d\d+(?:\s*[+\-]\s*\d+)?)\s*([a-z]+)\s*damage/i);
    if(dmg){ a.damageDice = dmg[1].replace(/\s+/g,''); a.damageType = dmg[2]; }
    const reach = a.description.match(/[Rr]each\s*(\d+\s*ft\.?)/);
    if(reach) a.reach = reach[1];
    const range = a.description.match(/range\s*(\d+\/\d+\s*ft\.?|\d+\s*ft\.?)/i);
    if(range) a.range = range[1];
    const save = a.description.match(/DC\s*(\d+)\s*([A-Za-z]+)\s*saving throw/i);
    if(save) a.save = 'DC '+save[1]+' '+save[2];
  });

  return c;
}
function parseEntries(block){
  if(!block || !block.trim()) return [];
  // Entries usually start with "Name. Description..." on a line (bold name in source markdown/text)
  const lines = block.split('\n');
  const entries = [];
  let current = null;
  const entryStartRe = /^\*{0,2}([A-Z][A-Za-z0-9à-öø-ÿ' \-\/]{1,60}?)\.\*{0,2}\s*(.*)$/;
  lines.forEach(line=>{
    const l = line.trim();
    if(!l) return;
    const m = l.match(entryStartRe);
    if(m && m[1].length < 60){
      if(current) entries.push(current);
      current = {id:uid('e'), name:m[1].trim(), description:m[2].trim(), usage:''};
    } else if(current){
      current.description += (current.description?' ':'') + l;
    } else {
      current = {id:uid('e'), name:'Entry', description:l, usage:''};
    }
  });
  if(current) entries.push(current);
  return entries;
}

/* ---------------------------------------------------------------
   6b. PLAYER CHARACTER IMPORTER (best-effort, pasted character sheet
   text — e.g. copied from a D&D Beyond character page). We never
   scrape or log into anything; the user pastes text they already
   have legitimate access to. Reuses the creature parser's regex
   helpers where the shape overlaps (abilities, saves, skills, senses).
--------------------------------------------------------------- */
function parsePlayerCharacterSheet(text){
  const pc = blankPlayerCharacter();
  const raw = (text||'').replace(/\r/g,'');
  const lines = raw.split('\n').map(l=>l.trim()).filter(l=>l.length);
  if(!lines.length) return pc;

  pc.name = lines[0].replace(/^#+\s*/,'').trim() || 'Imported Character';

  // "Level 5 Half-Elf Fighter (Battle Master)" style line, checked among the first few lines
  const classLine = lines.slice(1,5).find(l=> /level\s*\d+/i.test(l) || /\b(fighter|wizard|rogue|cleric|ranger|paladin|barbarian|bard|druid|monk|sorcerer|warlock|artificer)\b/i.test(l));
  if(classLine){
    const lvl = classLine.match(/level\s*(\d+)/i);
    if(lvl) pc.level = Number(lvl[1]);
    const cls = classLine.match(/\b(Fighter|Wizard|Rogue|Cleric|Ranger|Paladin|Barbarian|Bard|Druid|Monk|Sorcerer|Warlock|Artificer)\b/i);
    if(cls) pc.charClass = cls[1];
    const sub = classLine.match(/\(([^)]+)\)/);
    if(sub) pc.subclass = sub[1];
    const raceMatch = classLine.match(/level\s*\d+\s+([A-Za-z\- ]+?)\s+(?:Fighter|Wizard|Rogue|Cleric|Ranger|Paladin|Barbarian|Bard|Druid|Monk|Sorcerer|Warlock|Artificer)/i);
    if(raceMatch) pc.race = raceMatch[1].trim();
  }

  const findVal = (re) => { const l = raw.match(re); return l ? l[1].trim() : ''; };

  const acStr = findVal(/Armor Class\s*[:\-]?\s*(\d+[^\n]*)/i);
  if(acStr){ const n = acStr.match(/\d+/); if(n) pc.ac = Number(n[0]); }

  const hpLine = findVal(/Hit Points\s*[:\-]?\s*([^\n]+)/i);
  if(hpLine){
    const cur = hpLine.match(/(\d+)\s*\/\s*(\d+)/); // "32/40" style
    if(cur){ pc.currentHP = Number(cur[1]); pc.maxHP = Number(cur[2]); }
    else { const n = hpLine.match(/\d+/); if(n){ pc.maxHP = Number(n[0]); pc.currentHP = Number(n[0]); } }
    const hd = hpLine.match(/\(([^)]+)\)/);
    if(hd) pc.hitDice = hd[1];
  }

  const speedLine = findVal(/Speed\s*[:\-]?\s*([^\n]+)/i);
  if(speedLine){ const walk = speedLine.match(/(\d+)\s*ft/); if(walk) pc.speed.walk = Number(walk[1]); }

  const initLine = findVal(/Initiative\s*[:\-]?\s*([+\-]?\d+)/i);
  if(initLine) pc.initiativeModifier = Number(initLine);

  ABILS.forEach(ab=>{
    const label = ABIL_LABEL[ab];
    const rx = new RegExp(label+'\\s*[:\\-]?\\s*(\\d+)\\s*(?:\\(([+\\-]?\\d+)\\))?', 'i');
    const m = raw.match(rx);
    if(m){ pc.abilities[ab].score = Number(m[1]); }
  });

  const saveLine = findVal(/Saving Throws\s*[:\-]?\s*([^\n]+)/i);
  if(saveLine){
    ABILS.forEach(ab=>{
      const rx = new RegExp(ABIL_LABEL[ab]+'\\s*([+\\-]\\d+)','i');
      const m = saveLine.match(rx);
      if(m){ pc.saves[ab].proficient = true; pc.saves[ab].customBonus = Number(m[1]); }
    });
  }
  const skillLine = findVal(/Skills\s*[:\-]?\s*([^\n]+)/i);
  if(skillLine){
    skillLine.split(',').forEach(part=>{
      const m = part.trim().match(/^([A-Za-z ]+)\s*([+\-]\d+)$/);
      if(m) pc.skills.push({id:uid('sk'), name:m[1].trim().toLowerCase(), bonus:Number(m[2]), custom:false});
    });
  }
  pc.resistances = findVal(/Damage Resistances\s*[:\-]?\s*([^\n]+)/i);
  pc.immunities = findVal(/Damage Immunities\s*[:\-]?\s*([^\n]+)/i);
  pc.vulnerabilities = findVal(/Damage Vulnerabilities\s*[:\-]?\s*([^\n]+)/i);

  const sensesLine = findVal(/Senses\s*[:\-]?\s*([^\n]+)/i);
  if(sensesLine){
    const dv = sensesLine.match(/darkvision\s*(\d+)\s*ft/i); if(dv) pc.senses.darkvision = Number(dv[1]);
    const pp = sensesLine.match(/passive Perception\s*(\d+)/i); if(pp) pc.senses.passivePerception = Number(pp[1]);
  }
  const langLine = findVal(/Languages\s*[:\-]?\s*([^\n]+)/i);
  if(langLine) pc.languages = langLine.split(',').map(s=>s.trim()).filter(Boolean);

  const pbMatch = raw.match(/Proficiency Bonus\s*[:\-]?\s*\+?(\d+)/i);
  if(pbMatch) pc.profBonus = Number(pbMatch[1]);
  const bgMatch = raw.match(/Background\s*[:\-]?\s*([^\n]+)/i);
  if(bgMatch) pc.background = bgMatch[1].trim();
  const alignMatch = raw.match(/Alignment\s*[:\-]?\s*([^\n]+)/i);
  if(alignMatch) pc.alignment = alignMatch[1].trim();
  const expMatch = raw.match(/Experience\s*(?:Points)?\s*[:\-]?\s*([\d,]+)/i);
  if(expMatch) pc.experience = expMatch[1].replace(/,/g,'');
  const playerMatch = raw.match(/Player\s*(?:Name)?\s*[:\-]\s*([^\n]+)/i);
  if(playerMatch) pc.playerName = playerMatch[1].trim();

  // Section blocks: Features & Traits, Actions, Bonus Actions, Reactions, Spells, Equipment/Inventory
  const sectionNames = ['Features & Traits','Features','Actions','Bonus Actions','Reactions','Equipment','Inventory','Spells'];
  const idxOf = (name) => raw.search(new RegExp('\\n\\s*'+name.replace(/[&]/g,'\\&')+'\\s*\\n','i'));
  const boundaries = [];
  sectionNames.forEach(n=>{ const i = idxOf(n); if(i>=0) boundaries.push({name:n, idx:i}); });
  boundaries.sort((a,b)=>a.idx-b.idx);
  for(let i=0;i<boundaries.length;i++){
    const b = boundaries[i];
    const end = (i+1<boundaries.length) ? boundaries[i+1].idx : raw.length;
    const block = raw.slice(b.idx, end).replace(new RegExp('^\\s*'+b.name.replace(/[&]/g,'\\&')+'\\s*\\n?','i'),'').trim();
    if(b.name==='Features & Traits' || b.name==='Features') pc.traits = parseEntries(block);
    else if(b.name==='Actions') pc.actions = parseEntries(block);
    else if(b.name==='Bonus Actions') pc.bonusActions = parseEntries(block);
    else if(b.name==='Reactions') pc.reactions = parseEntries(block);
    else if(b.name==='Equipment' || b.name==='Inventory'){
      block.split('\n').map(l=>l.trim()).filter(Boolean).forEach(line=>{
        const m = line.match(/^(.+?)\s*(?:x|×)\s*(\d+)$/i);
        if(m) pc.inventory.push({id:uid('it'), name:m[1].trim(), qty:Number(m[2]), description:''});
        else pc.inventory.push({id:uid('it'), name:line.replace(/^[-•]\s*/,''), qty:1, description:''});
      });
    }
    else if(b.name==='Spells'){
      pc.spellcasting.enabled = true;
      block.split('\n').map(l=>l.trim()).filter(Boolean).forEach(line=>{
        if(!pc.spellcasting.cantrips) pc.spellcasting.cantrips=[];
        pc.spellcasting.cantrips.push(line.replace(/^[-•]\s*/,''));
      });
    }
  }
  return pc;
}

/* ---- Refresh/update comparison: what changed vs the currently saved PC ----
   Only flags a field as changed when the NEW parse actually detected a
   value AND it differs from the old one. A field the parser simply failed
   to find is left untouched (never treated as "removed") — protects
   against destructive data loss from an imperfect best-effort parser. */
const PC_DIFF_FIELDS = [
  ['name','Name'],['playerName','Player Name'],['race','Race'],['charClass','Class'],['subclass','Subclass'],
  ['level','Level'],['background','Background'],['alignment','Alignment'],['experience','Experience'],
  ['ac','Armor Class'],['maxHP','Max HP'],['initiativeModifier','Initiative Modifier'],['hitDice','Hit Dice'],
];
function isBlank(v){ return v===null || v===undefined || v===''; }
function computePcDiff(oldPc, newPc){
  const changed = [], added = [];
  PC_DIFF_FIELDS.forEach(([key,label])=>{
    const ov = oldPc[key], nv = newPc[key];
    if(isBlank(nv)) return; // parser found nothing here — don't touch or report
    if(isBlank(ov) && !isBlank(nv)){ added.push({field:key,label,value:nv}); return; }
    if(!deepEqual(ov, nv)) changed.push({field:key,label,old:ov,new:nv});
  });
  ABILS.forEach(ab=>{
    const ov = oldPc.abilities[ab].score, nv = newPc.abilities[ab].score;
    if(!isBlank(nv) && !deepEqual(ov,nv)) changed.push({field:'abilities.'+ab+'.score', label:ABIL_LABEL[ab]+' Score', old:ov, new:nv});
  });
  const newFeatureNames = (newPc.actions||[]).map(a=>a.name);
  const oldFeatureNames = (oldPc.actions||[]).map(a=>a.name);
  const addedActions = newFeatureNames.filter(n=>!oldFeatureNames.includes(n));
  return { changed, added, addedActions, hasAny: changed.length>0 || added.length>0 || addedActions.length>0 };
}
function applyPcDiff(oldPc, newPc){
  // Apply every field the new parse actually populated; leave anything it left blank untouched.
  const merged = deepClone(oldPc);
  PC_DIFF_FIELDS.forEach(([key])=>{ if(!isBlank(newPc[key])) merged[key]=newPc[key]; });
  ABILS.forEach(ab=>{ if(!isBlank(newPc.abilities[ab].score)) merged.abilities[ab].score = newPc.abilities[ab].score; });
  if(newPc.actions && newPc.actions.length) merged.actions = newPc.actions;
  if(newPc.traits && newPc.traits.length) merged.traits = newPc.traits;
  if(newPc.bonusActions && newPc.bonusActions.length) merged.bonusActions = newPc.bonusActions;
  if(newPc.reactions && newPc.reactions.length) merged.reactions = newPc.reactions;
  if(newPc.inventory && newPc.inventory.length) merged.inventory = newPc.inventory;
  if(newPc.skills && newPc.skills.length) merged.skills = newPc.skills;
  if(newPc.languages && newPc.languages.length) merged.languages = newPc.languages;
  return merged;
}

/* ---------------------------------------------------------------
   7. DATA HELPERS (CRUD) — soft-delete (tombstone) aware.
   getX() helpers only ever return NON-deleted objects, so every
   existing call site that does `.map(getTemplate).filter(Boolean)`
   automatically hides deleted items with no further changes needed.
--------------------------------------------------------------- */
function getTemplate(id){ return DB.templates.find(t=>t.id===id && !t.deletedAt); }
function getTemplateAny(id){ return DB.templates.find(t=>t.id===id); } // includes tombstones, for sync internals
function activeTemplates(){ return DB.templates.filter(t=>!t.deletedAt); }
function getCampaign(id){ return DB.campaigns.find(c=>c.id===id && !c.deletedAt); }
function getCampaignAny(id){ return DB.campaigns.find(c=>c.id===id); }
function activeCampaigns(){ return DB.campaigns.filter(c=>!c.deletedAt); }
function activeEncounters(camp){ return (camp.encounters||[]).filter(e=>!e.deletedAt); }
function getEncounter(campId, encId){
  const camp = getCampaignAny(campId); if(!camp) return null;
  const e = camp.encounters.find(e=>e.id===encId);
  return (e && !e.deletedAt) ? e : null;
}
function findEncounterAnywhere(encId){
  for(const camp of DB.campaigns){
    if(camp.deletedAt) continue;
    const e = camp.encounters.find(e=>e.id===encId && !e.deletedAt);
    if(e) return {campaign:camp, encounter:e};
  }
  return null;
}
function touchRecentGlobal(templateId){
  DB.recentGlobal = DB.recentGlobal.filter(r=>r.templateId!==templateId);
  DB.recentGlobal.unshift({templateId, ts:nowISO()});
  DB.recentGlobal = DB.recentGlobal.slice(0,20);
}
function touchRecentCampaign(camp, templateId){
  camp.recent = (camp.recent||[]).filter(r=>r.templateId!==templateId);
  camp.recent.unshift({templateId, ts:nowISO()});
  camp.recent = camp.recent.slice(0,15);
}
function saveTemplate(tpl){
  stampSync(tpl);
  const i = DB.templates.findIndex(t=>t.id===tpl.id);
  if(i>=0) DB.templates[i]=tpl; else DB.templates.push(tpl);
  scheduleSave();
}
function deleteTemplate(id){
  const t = getTemplateAny(id);
  if(!t) return;
  t.deletedAt = nowISO();
  stampSync(t);
  DB.campaigns.forEach(c=>{
    c.templateRefs = c.templateRefs.filter(r=>r!==id);
    c.favorites = c.favorites.filter(r=>r!==id);
    c.recent = c.recent.filter(r=>r.templateId!==id);
  });
  DB.recentGlobal = DB.recentGlobal.filter(r=>r.templateId!==id);
  scheduleSave();
}
function duplicateTemplate(id, newName){
  const src = getTemplate(id); if(!src) return null;
  const copy = deepClone(src);
  copy.id = uid('cr');
  copy.name = newName || (src.name + ' (Copy)');
  copy.favorite = false;
  copy.createdAt = nowISO();
  copy.deletedAt = null;
  copy.version = 0;
  stampSync(copy);
  DB.templates.push(copy);
  scheduleSave();
  return copy;
}

/* ---- Player Characters — CRUD (mirrors template CRUD exactly) ---- */
function getPlayerCharacter(id){ return DB.playerCharacters.find(p=>p.id===id && !p.deletedAt); }
function getPlayerCharacterAny(id){ return DB.playerCharacters.find(p=>p.id===id); }
function activePlayerCharacters(){ return DB.playerCharacters.filter(p=>!p.deletedAt); }
function savePlayerCharacter(pc){

  const i = DB.playerCharacters.findIndex(p=>p.id===pc.id);
  if(i>=0) DB.playerCharacters[i]=pc; else DB.playerCharacters.push(pc);

}
function deletePlayerCharacter(id){

  DB.campaigns.forEach(c=>{ c.playerCharacterRefs = (c.playerCharacterRefs||[]).filter(r=>r!==id); });
  DB.recentGlobalPc = DB.recentGlobalPc.filter(r=>r.pcId!==id);
  scheduleSave();
}
function duplicatePlayerCharacter(id, newName){
  const src = getPlayerCharacter(id); if(!src) return null;
  const copy = deepClone(src);
  copy.id = uid('pc');
  copy.name = newName || (src.name + ' (Copy)');

  copy.createdAt = nowISO();
  copy.deletedAt = null;
  copy.version = 0;
  stampSync(copy);
  DB.playerCharacters.push(copy);

}
function touchRecentGlobalPc(pcId){
  DB.recentGlobalPc = DB.recentGlobalPc.filter(r=>r.pcId!==pcId);
  DB.recentGlobalPc.unshift({pcId, ts:nowISO()});

}

function saveCampaign(camp){ stampSync(camp); scheduleSave(); }
function deleteCampaign(id){

}

function renderModals(){
  let host = document.getElementById('modal-host');
  if(!host){ host = document.createElement('div'); host.id='modal-host'; document.body.appendChild(host); }
  if(!UI.modalStack.length){ host.innerHTML=''; return; }
  host.innerHTML = UI.modalStack.map((m,i)=>`
    <div class="modal-overlay" style="z-index:${100+i*10}" data-modalidx="${i}" onmousedown="if(event.target===this && !${!!m.noClickAway}) popModal()">
      <div class="modal ${m.size==='lg'?'modal-lg':m.size==='xl'?'modal-xl':''}">

}

let EDITOR = null; // { draft, isTemplate, campaignId, originalId, isNew, activeTab, source:{type,campaignId,encId} }

function getPath(obj, path){
  return path.split('.').reduce((o,k)=> (o===undefined||o===null)?undefined : o[k], obj);
}
function setPath(obj, path, value){
  const keys = path.split('.');
  let cur = obj;
  for(let i=0;i<keys.length-1;i++){
    if(cur[keys[i]]===undefined || cur[keys[i]]===null) cur[keys[i]] = {};
    cur = cur[keys[i]];
  }
  cur[keys[keys.length-1]] = value;
}
function draftSet(path, value){ setPath(EDITOR.draft, path, value); }
window.draftSet = draftSet;
function draftSetNum(path, value){ draftSet(path, value===''?null:Number(value)); }
window.draftSetNum = draftSetNum;
function draftSetChecked(path, el){ draftSet(path, el.checked); }
window.draftSetChecked = draftSetChecked;

function setEditorTab(tab){ EDITOR.activeTab = tab; const modalEl=document.querySelector('.modal-overlay .modal'); renderModals(); }
window.setEditorTab = setEditorTab;

const EDITOR_TABS = [
  ['overview','Overview'],['combat','Combat'],['abilities','Abilities & Saves'],
  ['skills','Skills'],['defenses','Defenses & Senses'],['features','Traits & Actions'],
  ['legendary','Legendary / Lair'],['spellcasting','Spellcasting'],
  ['inventory','Inventory'],['custom','Custom Fields'],['notes','Notes & Tags'],
];
const PC_EDITOR_TABS = [
  ['overview','Overview'],['combat','Combat'],['abilities','Abilities & Saves'],
  ['skills','Skills'],['defenses','Defenses & Senses'],['features','Features & Actions'],
  ['spellcasting','Spellcasting'],
  ['inventory','Inventory'],['custom','Custom Fields'],['notes','Notes & Tags'],
];

function renderEditorModalContent(){
  const d = EDITOR.draft;
  const isPc = EDITOR.kind==='pc';
  const tabs = isPc ? PC_EDITOR_TABS : EDITOR_TABS;
  const noun = isPc ? 'Character' : 'Creature';
  return `
    <div class="modal-head">
      <h2>${EDITOR.isNew?'New '+noun:'Edit '+noun} ${d.name?'&mdash; '+esc(d.name):''}</h2>
      <button class="modal-close" onclick="closeEditorDiscard()">&times;</button>
    </div>
    <div class="modal-body" style="padding-top:10px;">
      <div class="tabs" id="editor-tabs">
        ${tabs.map(([id,label])=>`<button class="tab-btn ${EDITOR.activeTab===id?'active':''}" onclick="setEditorTab('${id}')">${label}</button>`).join('')}
      </div>
      <div id="editor-body">${editorBodyHTML()}</div>
    </div>
    <div class="modal-foot">
      <span class="faint small" style="margin-right:auto;">Every field except Name is optional.</span>
      ${!EDITOR.isNew && isPc ? `<button class="btn" onclick="openRefreshCharacterModal()">&#8635; Refresh Character</button>`:''}
      ${!EDITOR.isNew && isPc ? `<button class="btn btn-gold" onclick="openCharacterSheetModal('${d.id}')">&#128220; Character Sheet</button>`:''}
      <button class="btn" onclick="closeEditorDiscard()">Cancel</button>
      <button class="btn btn-primary" onclick="saveEditorCreature()">Save ${noun}</button>
    </div>
  `;
}

function editorBodyHTML(){
  const d = EDITOR.draft;
  if(EDITOR.kind==='pc'){
    switch(EDITOR.activeTab){
      case 'overview': return pcEditorOverview(d);
      case 'combat': return pcEditorCombat(d);
      case 'abilities': return editorAbilities(d);
      case 'skills': return editorSkills(d);
      case 'defenses': return editorDefenses(d);
      case 'features': return editorFeatures(d);
      case 'spellcasting': return editorSpellcasting(d);
      case 'inventory': return editorInventory(d);
      case 'custom': return editorCustom(d);
      case 'notes': return editorNotes(d);
      default: return '';
    }
  }
  switch(EDITOR.activeTab){
    case 'overview': return editorOverview(d);
    case 'combat': return editorCombat(d);
    case 'abilities': return editorAbilities(d);
    case 'skills': return editorSkills(d);
    case 'defenses': return editorDefenses(d);
    case 'features': return editorFeatures(d);
    case 'legendary': return editorLegendary(d);
    case 'spellcasting': return editorSpellcasting(d);
    case 'inventory': return editorInventory(d);
    case 'custom': return editorCustom(d);
    case 'notes': return editorNotes(d);
    default: return '';
  }
}

function fieldText(label, path, ph, big){
  const val = getPath(EDITOR.draft, path);
  if(big){
    return `<div class="field"><label class="field-label">${label}</label>
      <textarea oninput="draftSet('${path}', this.value)" placeholder="${esc(ph||'')}">${esc(val||'')}</textarea></div>`;
  }
  return `<div class="field"><label class="field-label">${label}</label>
    <input type="text" value="${esc(val??'')}" placeholder="${esc(ph||'')}" oninput="draftSet('${path}', this.value)"></div>`;
}
function fieldNum(label, path, ph){
  const val = getPath(EDITOR.draft, path);
  return `<div class="field"><label class="field-label">${label}</label>
    <input type="number" value="${val===null||val===undefined?'':val}" placeholder="${esc(ph||'')}" oninput="draftSetNum('${path}', this.value)"></div>`;
}
function fieldSelect(label, path, options){
  const val = getPath(EDITOR.draft, path);
  return `<div class="field"><label class="field-label">${label}</label>
    <select onchange="draftSet('${path}', this.value)">
      <option value="">—</option>
      ${options.map(o=>`<option value="${esc(o)}" ${val===o?'selected':''}>${esc(o)}</option>`).join('')}
    </select></div>`;
}
function fieldCheck(label, path){
  const val = getPath(EDITOR.draft, path);
  return `<label class="checkbox-row"><input type="checkbox" ${val?'checked':''} onchange="draftSetChecked('${path}', this)"> ${label}</label>`;
}

function editorOverview(d){
  return `
    ${fieldText('Name *','name','e.g. Goblin Boss')}
    <div class="field-row">
      ${fieldSelect('Size','size',SIZES)}
      ${fieldText('Creature Type','type','e.g. humanoid')}
      ${fieldText('Subtype','subtype','e.g. goblinoid')}
    </div>
    <div class="field-row">
      ${fieldText('Alignment','alignment','e.g. neutral evil')}
      ${fieldSelect('Challenge Rating','cr',CR_LIST)}
      ${fieldNum('XP','xp')}
      ${fieldNum('Proficiency Bonus','profBonus')}
    </div>
    ${fieldText('Description','description','Flavor text, appearance, background…',true)}
    <div class="field">
      <label class="field-label">Tags</label>
      ${listEditorChips('tags', EDITOR.draft.tags)}
    </div>
  `;
}
function listEditorChips(path, arr){
  arr = arr||[];
  return `<div class="tag-list mb6">
      ${arr.map((t,i)=>`<span class="pill">${esc(t)}<button onclick="arrRemoveAt('${path}',${i})">&times;</button></span>`).join('')}
    </div>
    <div class="flex gap6">
      <input type="text" id="chipinput-${path.replace(/\./g,'-')}" placeholder="Add tag and press Enter" style="max-width:220px;"
        onkeydown="if(event.key==='Enter'){event.preventDefault(); arrAddChip('${path}', this);}">
      <button class="btn btn-sm" onclick="arrAddChip('${path}', document.getElementById('chipinput-${path.replace(/\./g,'-')}'))">Add</button>
    </div>`;
}
function arrAddChip(path, input){
  const v = input.value.trim(); if(!v) return;
  const arr = getPath(EDITOR.draft, path) || [];
  if(!arr.includes(v)) arr.push(v);
  setPath(EDITOR.draft, path, arr);
  input.value='';
  updateEditorBody();
}
window.arrAddChip = arrAddChip;
function arrRemoveAt(path, idx){
  const arr = getPath(EDITOR.draft, path) || [];
  arr.splice(idx,1);
  setPath(EDITOR.draft, path, arr);
  updateEditorBody();
}
window.arrRemoveAt = arrRemoveAt;

function editorAbilities(d){
  const abilBlock = ABILS.map(ab=>{
    const a = d.abilities[ab];
    const computedMod = abilityMod(a.score);
    return `
      <div class="card" style="text-align:center;">
        <div class="faint small" style="text-transform:uppercase;letter-spacing:1px;">${ABIL_LABEL[ab]}</div>
        <input type="number" style="text-align:center;font-size:20px;margin-top:6px;" value="${a.score??''}"
          oninput="draftSetNum('abilities.${ab}.score', this.value); updateEditorBody();">
        <div class="small faint mt6">Mod: ${fmtMod(computedMod)}</div>
        <input type="number" placeholder="override" style="margin-top:6px;font-size:12px;" value="${a.modOverride??''}"
          oninput="draftSetNum('abilities.${ab}.modOverride', this.value)">
      </div>`;
  }).join('');
  const savesBlock = ABILS.map(ab=>{
    const s = d.saves[ab];
    const computed = getAbilMod(d,ab) + (s.proficient? (Number(d.profBonus)||0):0);
    return `
      <div class="field-row" style="align-items:center;">
        <label class="checkbox-row" style="min-width:110px;"><input type="checkbox" ${s.proficient?'checked':''}
          onchange="draftSetChecked('saves.${ab}.proficient', this); updateEditorBody();"> ${ABIL_LABEL[ab]} Save</label>
        <input type="number" placeholder="${fmtMod(computed)} (auto)" value="${s.customBonus??''}"
          oninput="draftSetNum('saves.${ab}.customBonus', this.value)" style="max-width:140px;">
      </div>`;
  }).join('');
  return `
    <div class="ability-edit-grid">${abilBlock}</div>
    <div class="hr"></div>
    <div class="section-title">Saving Throws</div>
    <p class="hint mb10">Leave the bonus blank to auto-calculate from ability modifier + proficiency bonus.</p>
    ${savesBlock}
  `;
}

function editorSkills(d){
  const rows = (d.skills||[]).map((s,i)=>`
    <div class="field-row" style="align-items:center;">
      <input type="text" value="${esc(s.name)}" placeholder="Skill name" style="flex:2;"
        oninput="draftSet('skills.${i}.name', this.value)">
      <input type="number" value="${s.bonus??''}" placeholder="bonus" style="max-width:100px;"
        oninput="draftSetNum('skills.${i}.bonus', this.value)">
      <button class="btn btn-icon btn-xs btn-danger" onclick="arrRemoveAt('skills',${i});updateEditorBody();">&times;</button>
    </div>`).join('');
  return `
    <p class="hint mb10">Add any skill — standard D&D skills or custom ones — with its total bonus.</p>
    ${rows || '<p class="faint small mb10">No skills added.</p>'}
    <div class="btn-row mt6">
      <button class="btn btn-sm" onclick="addSkillFromList()">+ Add Standard Skill</button>
      <button class="btn btn-sm" onclick="arrPush('skills',{id:uid('sk'),name:'',bonus:null,custom:true});updateEditorBody();">+ Add Custom Skill</button>
    </div>
  `;
}
function addSkillFromList(){
  openPromptModal({
    title:'Add Standard Skill', label:'Type a skill name (e.g. Perception)',
    onSubmit:(v)=>{ if(!v.trim()) return;
      arrPush('skills', {id:uid('sk'), name:v.trim().toLowerCase(), bonus:null, custom:false});
      updateEditorBody();
    }
  });
}
window.addSkillFromList = addSkillFromList;
function arrPush(path, item){
  const arr = getPath(EDITOR.draft, path) || [];
  arr.push(item);
  setPath(EDITOR.draft, path, arr);
}
window.arrPush = arrPush;

function entryListEditor(path, arr, opts){
  arr = arr||[]; opts = opts||{};
  const simple = opts.simple;
  return `
    ${arr.map((e,i)=>`
      <div class="entry-row">
        <div class="field-row" style="margin-bottom:6px;">
          <input type="text" value="${esc(e.name||'')}" placeholder="${opts.nameLabel||'Name'}" style="flex:1;font-weight:600;"
            oninput="draftSet('${path}.${i}.name', this.value)">
          ${simple?`<input type="text" value="${esc(e.description||'')}" placeholder="${opts.descLabel||'Value'}" style="max-width:160px;"
              oninput="draftSet('${path}.${i}.description', this.value)">`:''}
          <button class="btn btn-icon btn-xs btn-danger" onclick="arrRemoveAt('${path}',${i});updateEditorBody();">&times;</button>
        </div>
        ${!simple?`<textarea placeholder="Description" oninput="draftSet('${path}.${i}.description', this.value)">${esc(e.description||'')}</textarea>
        ${opts.showUsage?`<input type="text" class="mt6" value="${esc(e.usage||'')}" placeholder="Usage / recharge (e.g. Recharge 5-6, 1/Day)"
            oninput="draftSet('${path}.${i}.usage', this.value)">`:''}
        ${opts.showAttack?`
          <div class="field-row mt6">
            <input type="text" value="${esc(e.attackBonus||'')}" placeholder="Attack bonus (e.g. +5)" oninput="draftSet('${path}.${i}.attackBonus', this.value)">
            <input type="text" value="${esc(e.range||'')}" placeholder="Range" oninput="draftSet('${path}.${i}.range', this.value)">
            <input type="text" value="${esc(e.reach||'')}" placeholder="Reach" oninput="draftSet('${path}.${i}.reach', this.value)">
          </div>
          <div class="field-row mt6">
            <input type="text" value="${esc(e.damageDice||'')}" placeholder="Damage dice (e.g. 2d6+3)" oninput="draftSet('${path}.${i}.damageDice', this.value)">
            <select onchange="draftSet('${path}.${i}.damageType', this.value)">
              <option value="">Damage type</option>
              ${DAMAGE_TYPES.map(t=>`<option value="${t}" ${e.damageType===t?'selected':''}>${t}</option>`).join('')}
            </select>
            <input type="text" value="${esc(e.save||'')}" placeholder="Save (e.g. DC 13 DEX)" oninput="draftSet('${path}.${i}.save', this.value)">
          </div>`:''}
        `:''}
      </div>`).join('')}
    <button class="btn btn-sm" onclick="arrPush('${path}', ${opts.showAttack? `{id:uid('e'),name:'',description:'',attackBonus:'',range:'',reach:'',damageDice:'',damageType:'',save:'',recharge:''}`
        : simple ? `{name:'',description:''}` : `{id:uid('e'),name:'',description:'',usage:''}`});updateEditorBody();">+ Add</button>
  `;
}

        <button class="btn btn-icon btn-xs btn-danger" onclick="arrRemoveAt('customFields',${i});updateEditorBody();">&times;</button>

  return `<p class="hint mb10">Homebrew stats — sanity, corruption, boss phase, whatever your table needs.</p>

    <button class="btn btn-sm" onclick="arrPush('customFields',{id:uid('cf'),name:'',type:'text',value:''});updateEditorBody();">+ Add Custom Field</button>`;
}
function customFieldValueInput(f,i){
  if(f.type==='boolean') return `<label class="checkbox-row"><input type="checkbox" ${f.value?'checked':''} onchange="draftSet('customFields.${i}.value', this.checked)"> Value</label>`;
  if(f.type==='number' || f.type==='counter') return `<input type="number" value="${f.value??''}" placeholder="Value" oninput="draftSetNum('customFields.${i}.value', this.value)">`;
  if(f.type==='dropdown') return `<input type="text" value="${esc(f.value||'')}" placeholder="Value (type any option)" oninput="draftSet('customFields.${i}.value', this.value)">`;
  return `<input type="text" value="${esc(f.value??'')}" placeholder="Value" oninput="draftSet('customFields.${i}.value', this.value)">`;
}

function openPcUpdateComparisonModal(oldPc, newPc){
  const diff = computePcDiff(oldPc, newPc);
  pushModal({
    key:'pc-diff', size:'lg', noClickAway:true,
    render(){
      return `
        <div class="modal-head"><h2>Character Update</h2><button class="modal-close" onclick="popModal()">&times;</button></div>
        <div class="modal-body">
          ${!diff.hasAny ? `<p class="muted">No differences detected — this character is already up to date.</p>` : `
            ${diff.changed.length ? `<div class="section-title">Changed</div>${diff.changed.map(c=>`
              <div class="entry-row flex-between"><span class="small">${esc(c.label)}</span><span class="small">${esc(String(c.old??'—'))} &rarr; <b>${esc(String(c.new))}</b></span></div>
            `).join('')}` : ''}
            ${diff.added.length ? `<div class="section-title mt10">Added</div>${diff.added.map(c=>`
              <div class="entry-row flex-between"><span class="small">${esc(c.label)}</span><span class="small"><b>${esc(String(c.value))}</b></span></div>
            `).join('')}` : ''}
            ${diff.addedActions.length ? `<div class="section-title mt10">New Actions / Features</div>${diff.addedActions.map(n=>`
              <div class="entry-row"><span class="small">${esc(n)}</span></div>
            `).join('')}` : ''}
          `}
          <p class="hint mt10">Fields the new data didn't mention are left exactly as they were. This never touches any encounter this character is already part of — current combat HP, conditions, and initiative stay untouched.</p>
        </div>
        <div class="modal-foot">
          <button class="btn" onclick="popModal()">Cancel</button>
          ${diff.hasAny ? `<button class="btn btn-primary" onclick="applyCharacterRefresh('${oldPc.id}')">Apply Changes</button>` : ''}
        </div>`;
    }
  });
  window.__pcDiffOld = oldPc; window.__pcDiffNew = newPc;
}
window.openPcUpdateComparisonModal = openPcUpdateComparisonModal;
function applyCharacterRefresh(pcId){
  const current = getPlayerCharacter(pcId) || window.__pcDiffOld;
  const merged = applyPcDiff(current, window.__pcDiffNew);
  merged.id = pcId;
  savePlayerCharacter(merged);
  toast('Character updated');
  popModal();
  render();
}
window.applyCharacterRefresh = applyCharacterRefresh;

function characterSheetBodyHTML(pcId){
  const pc = getPlayerCharacter(pcId);
  if(!pc) return '';

  const pct = (maxHP && cur!==null) ? clamp((cur/maxHP)*100,0,100) : 100;
  let hpClass = 'hp-good';
  if(maxHP && cur!==null){ const r=cur/maxHP; if(cur<=0) hpClass='hp-dead'; else if(r<=0.25) hpClass='hp-bad'; else if(r<=0.5) hpClass='hp-mid'; }
  const ds = pc.deathSaves || {successes:0,failures:0};
  const conc = pc.concentration || {active:false,name:''};

  return `
    <div class="sheet-grid">
      <div>
        <div class="card">
          <div class="flex-between small mb6"><span>HP</span><span class="hp-num"><b>${cur===null?'—':cur}</b>${maxHP?(' / '+maxHP):''}${pc.tempHP?(' <span style="color:var(--info)">(+'+pc.tempHP+' temp)</span>'):''}</span></div>
          <div class="hpbar-wrap mb6"><div class="hpbar-fill ${hpClass}" style="width:${pct}%"></div></div>
          <div class="hp-btns">
            ${[-10,-5,-1,1,5,10].map(n=>`<button class="btn" onclick="sheetApplyHP('${pcId}',${n})">${n>0?'+':''}${n}</button>`).join('')}

            <button class="btn btn-sm" style="background:rgba(177,64,47,0.16);border-color:var(--blood);" onclick="sheetApplyCustomHP('${pcId}','sheet-dmg-${pcId}',-1)">Damage</button>
            <button class="btn btn-sm" style="background:rgba(91,140,90,0.16);border-color:var(--good);" onclick="sheetApplyCustomHP('${pcId}','sheet-dmg-${pcId}',1)">Heal</button>
          </div>
          <div class="flex gap6 mt6">
            <input type="number" placeholder="Temp HP" style="max-width:110px;" value="${pc.tempHP||''}" oninput="withPc('${pcId}',p=>p.tempHP=Number(this.value)||0)">
            <input type="number" placeholder="Max HP" style="max-width:110px;" value="${pc.maxHP??''}" oninput="withPc('${pcId}',p=>p.maxHP=this.value===''?null:Number(this.value));refreshSheetBody('${pcId}')">
            <button class="btn btn-xs" onclick="openSheetHpHistory('${pcId}')">History${pc.hpHistory&&pc.hpHistory.length?' ('+pc.hpHistory.length+')':''}</button>
          </div>
        </div>

        <div class="card mt10">
          <div class="section-title">Ability Checks</div>
          <div class="statgrid">
            ${ABILS.map(ab=>`
              <div class="stat-box">
                <div class="ab">${ABIL_LABEL[ab]}</div>
                <div class="score">${pc.abilities[ab].score}</div>
                <div class="mod">${fmtMod(getAbilMod(pc,ab))}</div>
                <button class="btn btn-xs mt6" onclick="rollPcCheck('${pcId}','${ab}')">Roll</button>
              </div>`).join('')}
          </div>
          <div class="section-title mt10">Saving Throws</div>
          <div class="mini-stats">
            ${ABILS.map(ab=>`<span>${ABIL_LABEL[ab]} <b>${fmtMod(getSaveBonus(pc,ab))}</b> <button class="btn btn-xs" onclick="rollPcSave('${pcId}','${ab}')">Roll</button></span>`).join('')}
          </div>
          ${pc.skills&&pc.skills.length?`
          <div class="section-title mt10">Skills</div>

            ${pc.skills.map((s,i)=>`<span>${esc(s.name)} <b>${fmtMod(s.bonus||0)}</b> <button class="btn btn-xs" onclick="rollPcSkill('${pcId}',${i})">Roll</button></span>`).join('')}

              ${a.description?`<div class="entry-desc">${nl2br(a.description)}</div>`:''}

        </div>`:''}

/* ---- Sheet HP controls (operate directly on the PlayerCharacter record) ---- */
function sheetApplyHP(pcId, delta){
  withPc(pcId, p=>{
    const maxHP = p.maxHP;
    let cur = p.currentHP===null||p.currentHP===undefined ? (maxHP||0) : p.currentHP;
    let remaining = delta;
    if(delta<0 && p.tempHP>0){ const absorb = Math.min(p.tempHP,-delta); p.tempHP -= absorb; remaining = delta+absorb; }
    const prev = cur;
    let next = cur+remaining;
    if(maxHP!==null && maxHP!==undefined && maxHP!=='') next = Math.min(next, Number(maxHP));
    p.currentHP = next;
    p.hpHistory = p.hpHistory||[];
    p.hpHistory.unshift({id:uid('hh'), timestamp:nowISO(), prev, new_:next, amount:delta, type:delta<0?'damage':'heal'});
    p.hpHistory = p.hpHistory.slice(0,50);
  });
  refreshSheetBody(pcId);
}
window.sheetApplyHP = sheetApplyHP;
function sheetApplyCustomHP(pcId, inputId, sign){
  const el = document.getElementById(inputId);
  const amt = parseInt(el.value,10);
  if(!amt || amt<=0){ toast('Enter an amount first.', true); return; }
  sheetApplyHP(pcId, amt*sign);
  el.value='';
}
window.sheetApplyCustomHP = sheetApplyCustomHP;

    return `

      <div class="modal-body">

          <div class="dice-log-item">
            <span>${h.prev} &rarr; ${h.new_} <span class="faint">(${h.type==='damage'?'Damage':'Healing'} ${Math.abs(h.amount)})</span></span>
            <span class="flex gap6"><span class="faint">${new Date(h.timestamp).toLocaleTimeString()}</span>
            ${i===0?`<button class="btn btn-xs" onclick="sheetUndoLastHP('${pcId}')">Undo</button>`:''}</span>
          </div>`).join('') : '<p class="faint small">No HP changes recorded yet.</p>'}
      </div>
      <div class="modal-foot"><button class="btn" onclick="popModal()">Close</button></div>`;
  }});
}

function sheetUndoLastHP(pcId){

}

function rollPcCheck(pcId, ab){
  const pc = getPlayerCharacter(pcId);
  const bonus = getAbilMod(pc, ab);
  const d20 = rollD20('normal');
  showRollResultModal(`${ABIL_LABEL[ab]} Check — ${pc.name}`, d20.value+bonus, `d20 (${d20.value}) ${fmtMod(bonus)}`);
}

  const pc = getPlayerCharacter(pcId);
  const bonus = getSaveBonus(pc, ab);
  const d20 = rollD20('normal');
  showRollResultModal(`${ABIL_LABEL[ab]} Saving Throw — ${pc.name}`, d20.value+bonus, `d20 (${d20.value}) ${fmtMod(bonus)}`);
}
window.rollPcSave = rollPcSave;
function rollPcSkill(pcId, skillIdx){
  const pc = getPlayerCharacter(pcId);
  const s = pc.skills[skillIdx];
  const d20 = rollD20('normal');
  showRollResultModal(`${s.name} — ${pc.name}`, d20.value+(s.bonus||0), `d20 (${d20.value}) ${fmtMod(s.bonus||0)}`);
}

function rollPcAttack(pcId, actionIdx){
  const pc = getPlayerCharacter(pcId);
  const a = pc.actions[actionIdx];
  const bonus = parseInt((a.attackBonus||'0').replace(/[^\d\-+]/g,''),10)||0;
  const d20 = rollD20('normal');
  const total = d20.value+bonus;
  showRollResultModal(`${a.name} — Attack Roll`, total, `d20 (${d20.value}) ${fmtMod(bonus)}${d20.value===20?' — CRITICAL HIT!':d20.value===1?' — CRITICAL MISS':''}`);
}

function rollPcDamage(pcId, actionIdx){
  const pc = getPlayerCharacter(pcId);
  const a = pc.actions[actionIdx];
  const res = rollExpression(a.damageDice);
  if(!res){ toast('Could not parse damage dice: '+a.damageDice, true); return; }
  applyDamageMultiplier(res, a);
  showRollResultModal(`${a.name} — Damage${a.damageType?' ('+a.damageType+')':''}`, res.total, res.breakdown);
}

function sheetSetDeathSave(pcId, kind, count){
  withPc(pcId, p=>{ p.deathSaves = p.deathSaves||{successes:0,failures:0}; p.deathSaves[kind] = p.deathSaves[kind]===count ? count-1 : count; });
  refreshSheetBody(pcId);
}
window.sheetSetDeathSave = sheetSetDeathSave;
function sheetRollDeathSave(pcId){
  const r = rollD20('normal');
  withPc(pcId, p=>{
    p.deathSaves = p.deathSaves||{successes:0,failures:0};
    if(r.value===20){ p.deathSaves={successes:0,failures:0}; toast('Natural 20 — back to 1 HP!'); }
    else if(r.value===1){ p.deathSaves.failures = Math.min(3,p.deathSaves.failures+2); }
    else if(r.value>=10){ p.deathSaves.successes = Math.min(3,p.deathSaves.successes+1); }
    else { p.deathSaves.failures = Math.min(3,p.deathSaves.failures+1); }
  });
  showRollResultModal('Death Save', r.value, r.value===20?'Natural 20!':r.value===1?'Natural 1 (counts as 2 failures)':r.value>=10?'Success':'Failure');
  refreshSheetBody(pcId);
}

function persistEncounter(campId, encId){
  const camp = getCampaign(campId);
  if(!camp) return;
  stampSync(camp);
  if(encId){
    const enc = camp.encounters.find(e=>e.id===encId);
    if(enc) stampSync(enc);
  }
  scheduleSave();
}
function findParticipant(campId, encId, partId){
  const enc = getEncounter(campId, encId);
  return enc ? enc.participants.find(p=>p.id===partId) : null;

            <button class="btn btn-xs btn-danger" onclick="endConcentration('${camp.id}','${enc.id}','${p.id}')">End</button>`
            :`<button class="btn btn-xs" onclick="startConcentrationPrompt('${camp.id}','${enc.id}','${p.id}')">Start</button>`}

function setDeathSave(campId, encId, partId, kind, count){
  withParticipant(campId, encId, partId, p=>{
    p.deathSaves = p.deathSaves || {successes:0,failures:0};
    p.deathSaves[kind] = p.deathSaves[kind]===count ? count-1 : count; // click same pip again to reduce
  });
  render();
}
window.setDeathSave = setDeathSave;
function rollDeathSave(campId, encId, partId){
  const r = rollD20('normal');
  withParticipant(campId, encId, partId, p=>{
    p.deathSaves = p.deathSaves || {successes:0,failures:0};
    if(r.value===20){ p.deathSaves = {successes:0,failures:0}; toast('Natural 20 — back to 1 HP!'); }
    else if(r.value===1){ p.deathSaves.failures = Math.min(3,p.deathSaves.failures+2); }
    else if(r.value>=10){ p.deathSaves.successes = Math.min(3,p.deathSaves.successes+1); }
    else { p.deathSaves.failures = Math.min(3,p.deathSaves.failures+1); }
  });
  showRollResultModal('Death Save', r.value, r.value===20?'Natural 20!':r.value===1?'Natural 1 (counts as 2 failures)':r.value>=10?'Success':'Failure');
  render();
}
window.rollDeathSave = rollDeathSave;

  showRollResultModal('Concentration Save — '+p.name, d20.value+bonus, `d20 (${d20.value}) ${fmtMod(bonus)} — DC = 10 or half damage taken, whichever is higher`);

function rollAllInitiative(campId, encId){

function nextTurn(campId, encId){
  const enc = getEncounter(campId, encId);

}

  const enc = getEncounter(campId, encId);

  enc.turnIndex--;

/* Which token (if any) should be highlighted on the DM's map for the current turn.
   DM-side only — the player display only learns this if showTurnToPlayers is on,
   and even then only gets a name, never this token lookup. */
function currentTurnTokenId(enc){
  if(!enc.useInitiative || !enc.map) return null;
  const current = enc.participants[enc.turnIndex];
  if(!current) return null;
  const tok = enc.map.tokens.find(t=>t.linkedParticipantId===current.id);
  return tok ? tok.id : null;
}
