/* ---- Restricted formula + dice-formula tools ----
   Neither of these ever calls eval()/Function()/new Function(), and
   neither executes anything beyond +,-,*,/ and parentheses on numbers
   and a fixed whitelist of variable names. This satisfies the explicit
   "no unrestricted eval(), no arbitrary JavaScript execution" rule. */
function safeEvalFormula(expr, vars){
  vars = vars || {};
  if(typeof expr !== 'string' || !expr.trim()) return 0;
  if(!/^[0-9a-zA-Z_.\s+\-*/().]*$/.test(expr)) throw new Error('Formula contains characters that aren’t allowed (only numbers, + - * / ( ) and the listed variable names).');
  let pos = 0;
  function skipWs(){ while(pos<expr.length && /\s/.test(expr[pos])) pos++; }
  function parseExpr(){
    let v = parseTerm();
    for(;;){ skipWs(); const c=expr[pos];
      if(c==='+'){ pos++; v += parseTerm(); }
      else if(c==='-'){ pos++; v -= parseTerm(); }
      else break;
    }
    return v;
  }
  function parseTerm(){
    let v = parseFactor();
    for(;;){ skipWs(); const c=expr[pos];
      if(c==='*'){ pos++; v *= parseFactor(); }
      else if(c==='/'){ pos++; const d=parseFactor(); if(d===0) throw new Error('Formula divides by zero.'); v /= d; }
      else break;
    }
    return v;
  }
  function parseFactor(){
    skipWs();
    const c = expr[pos];
    if(c==='+'){ pos++; return parseFactor(); }
    if(c==='-'){ pos++; return -parseFactor(); }
    if(c==='('){
      pos++; const v = parseExpr(); skipWs();
      if(expr[pos] !== ')') throw new Error('Mismatched parentheses in formula.');
      pos++; return v;
    }
    const numMatch = /^[0-9]+(\.[0-9]+)?/.exec(expr.slice(pos));
    if(numMatch){ pos += numMatch[0].length; return parseFloat(numMatch[0]); }
    const idMatch = /^[a-zA-Z_][a-zA-Z0-9_]*/.exec(expr.slice(pos));
    if(idMatch){
      pos += idMatch[0].length;
      const name = idMatch[0].toLowerCase();
      if(!(name in vars)) throw new Error('Unknown variable "'+idMatch[0]+'" — supported variables are: '+Object.keys(vars).join(', '));
      return Number(vars[name]) || 0;
    }
    throw new Error('Couldn’t understand the formula near "'+expr.slice(pos, pos+8)+'".');
  }
  skipWs();
  if(pos>=expr.length) return 0;
  const result = parseExpr();
  skipWs();
  if(pos !== expr.length) throw new Error('Unexpected text in formula near "'+expr.slice(pos, pos+8)+'".');
  if(!isFinite(result)) throw new Error('That formula doesn’t produce a usable number.');
  return result;
}

/* Parse a dice-notation formula like "2d6+3" into structured terms,
   WITHOUT rolling anything — used so modifier effects can add to,
   multiply, or replace a formula and print it back out as text.
   Distinct from rollExpression() (section 5), which rolls dice. */
function parseDiceFormula(expr){
  expr = (expr==null?'':expr.toString()).trim().toLowerCase().replace(/\s+/g,'');
  if(expr===''){ return {dice:[], flat:0, valid:true}; }
  const termRe = /([+-]?)(\d*d\d+|\d+)/g;
  let m, dice=[], flat=0, any=false, consumed=0;
  while((m = termRe.exec(expr))){
    any = true;
    consumed += m[0].length;
    const sign = m[1]==='-' ? -1 : 1;
    const tok = m[2];
    if(tok.indexOf('d')>=0){
      const parts = tok.split('d');
      const count = (parts[0]==='' ? 1 : parseInt(parts[0],10)) * sign;
      const sides = parseInt(parts[1],10);
      if(!sides || sides<2) return {dice:[], flat:0, valid:false};
      dice.push({count, sides});
    } else {
      flat += parseInt(tok,10) * sign;
    }
  }
  if(!any || consumed !== expr.length) return {dice:[], flat:0, valid:false};
  return {dice, flat, valid:true};
}
function formatDiceFormula(dice, flat){
  const bySides = {};
  (dice||[]).forEach(d=>{ if(!d || !d.sides) return; bySides[d.sides] = (bySides[d.sides]||0) + (d.count||0); });
  const sidesList = Object.keys(bySides).map(Number).filter(s=>bySides[s]!==0).sort((a,b)=>b-a);
  let parts = [];
  sidesList.forEach(s=>{
    const c = bySides[s];
    parts.push((parts.length ? (c>0?'+':'-') : (c<0?'-':'')) + Math.abs(c)+'d'+s);
  });
  flat = flat||0;
  if(flat){ parts.push((parts.length ? (flat>0?'+':'-') : (flat<0?'-':'')) + Math.abs(flat)); }
  if(!parts.length) return '0';
  return parts.join('');
}

/* ---- Scaling evaluation (shared by every numeric effect) ---- */
function evalScaling(scaling, ctx){
  scaling = scaling || blankScaling(0);
  ctx = ctx || {};
  const level = Number(ctx.level)||0;
  const prof = Number(ctx.prof)||0;
  const hitDice = Number(ctx.hitDice)||0;
  const base = Number(scaling.base)||0;
  const perLevel = Number(scaling.perLevel)||0;
  switch(scaling.method){
    case 'flat': return base;
    case 'per_level': return base + perLevel*level;
    case 'per_level_after_first': return base + perLevel*Math.max(0, level-1);
    case 'per_prof': return base + perLevel*prof;
    case 'per_hitdie': return base + perLevel*hitDice;
    case 'custom':
      return safeEvalFormula(scaling.formula, {level, prof, hitdice:hitDice, hitdie:hitDice, base, perlevel:perLevel});
    default: return base;
  }
}
function describeScaling(scaling){
  scaling = scaling || blankScaling(0);
  const m = SCALING_METHODS.find(x=>x.id===scaling.method);
  const label = m ? m.label.split(' (')[0] : scaling.method;
  if(scaling.method==='flat') return `${fmtMod(scaling.base||0)} flat`;
  if(scaling.method==='custom') return `custom formula: ${scaling.formula||'(empty)'}`;
  return `${fmtMod(scaling.base||0)} base, ${fmtMod(scaling.perLevel||0)} ${label.toLowerCase()}`;
}

function getPathSafe(obj, path){ return path.split('.').reduce((o,k)=> (o===undefined||o===null)?undefined:o[k], obj); }
function setPathSafe(obj, path, value){
  const keys = path.split('.'); let cur = obj;
  for(let i=0;i<keys.length-1;i++){ if(cur[keys[i]]===undefined||cur[keys[i]]===null) cur[keys[i]]={}; cur = cur[keys[i]]; }
  cur[keys[keys.length-1]] = value;
}
function splitList(str){ return (str||'').split(',').map(s=>s.trim()).filter(Boolean); }
function joinList(arr){ return arr.join(', '); }

/* Record one adjustment in the human-readable breakdown, keyed by a
   stable stat key. Purely additive stats (ability scores/mods, AC, HP,
   speeds, saves, skills, attack-roll bonuses, senses, proficiency
   bonus, spell DC/attack, passive perception) all funnel through here
   so the final Apply-Modifiers preview can show base -> adjustments ->
   final for every stat a modifier touched, per spec section 6. */
function recordAdjustment(breakdown, key, label, baseValue, source, value){
  if(!breakdown[key]) breakdown[key] = {label, base: baseValue, adjustments: [], final: baseValue};
  breakdown[key].adjustments.push({source, value});
  breakdown[key].final = (breakdown[key].final||0) + value;
}
function recordNote(breakdown, key, label, text){
  if(!breakdown[key]) breakdown[key] = {label, textOnly:true, notes:[]};
  breakdown[key].notes.push(text);
}

/* Apply ONE effect to the working creature in place. `seenTargets` is a
   per-computation Map used only to flag replace/remove conflicts for
   the warnings list (e.g. two modifiers both trying to replace the
   same attack's damage) — it never blocks the calculation, it only
   reports it, per "effects that conflict should produce a warning". */
function applyEffectToWorking(working, effect, ctx, breakdown, warnings, modifierName, seenTargets){
  seenTargets = seenTargets || {};
  if(!effect || effect.enabled===false) return;
  const level = ctx.level, prof = Number(working.profBonus)||0;
  const hdParsed = parseDiceFormula(working.hitDice||'');
  const hitDice = hdParsed.valid ? hdParsed.dice.reduce((n,d)=>n+(d.count>0?d.count:0),0) : 0;
  const fullCtx = {level, prof, hitDice};

  try{
    switch(effect.kind){
      case 'ability_score': {
        const ab = effect.ability;
        if(!working.abilities[ab]){ warnings.push(`${modifierName}: unknown ability "${ab}" — skipped.`); return; }
        const delta = evalScaling(effect.scaling, fullCtx);
        const before = Number(working.abilities[ab].score)||0;
        working.abilities[ab].score = before + delta;
        recordAdjustment(breakdown, 'ability_score_'+ab, ABIL_LABEL[ab]+' Score', before, modifierName, delta);
        break;
      }
      case 'ability_mod': {
        const ab = effect.ability;
        if(!working.abilities[ab]){ warnings.push(`${modifierName}: unknown ability "${ab}" — skipped.`); return; }
        const delta = evalScaling(effect.scaling, fullCtx);
        const baselineMod = (working.abilities[ab].modOverride!==null && working.abilities[ab].modOverride!==undefined && working.abilities[ab].modOverride!=='')
          ? Number(working.abilities[ab].modOverride) : abilityMod(working.abilities[ab].score);
        working.abilities[ab].modOverride = baselineMod + delta;
        recordAdjustment(breakdown, 'ability_mod_'+ab, ABIL_LABEL[ab]+' Modifier', baselineMod, modifierName, delta);
        break;
      }
      case 'stat': {
        const t = STAT_TARGETS[effect.stat];
        if(!t){ warnings.push(`${modifierName}: unknown stat target "${effect.stat}" — skipped.`); return; }
        const delta = evalScaling(effect.scaling, fullCtx);
        const before = Number(getPathSafe(working, t.path));
        const baseVal = isFinite(before) ? before : 0;
        setPathSafe(working, t.path, baseVal + delta);
        recordAdjustment(breakdown, 'stat_'+effect.stat, t.label, baseVal, modifierName, delta);
        break;
      }
      case 'save': {
        const ab = effect.ability;
        if(!working.saves[ab]){ warnings.push(`${modifierName}: unknown ability "${ab}" — skipped.`); return; }
        const delta = evalScaling(effect.scaling, fullCtx);
        working._saveBonusAccum = working._saveBonusAccum || {};
        working._saveBonusAccum[ab] = (working._saveBonusAccum[ab]||0) + delta;
        recordAdjustment(breakdown, 'save_'+ab, ABIL_LABEL[ab]+' Save', 0, modifierName, delta);
        break;
      }
      case 'skill': {
        const name = (effect.skillName||'').trim().toLowerCase();
        if(!name){ warnings.push(`${modifierName}: a Skill effect has no skill name set — skipped.`); return; }
        const delta = evalScaling(effect.scaling, fullCtx);
        let s = working.skills.find(x=>(x.name||'').toLowerCase()===name);
        let before = 0;
        if(!s){
          const skillDef = SKILLS.find(sk=>sk[0]===name);
          before = skillDef ? getAbilMod(working, skillDef[1]) : 0;
          s = {id:uid('sk'), name, bonus:before, custom:true};
          working.skills.push(s);
        } else { before = Number(s.bonus)||0; }
        s.bonus = before + delta;
        recordAdjustment(breakdown, 'skill_'+name, name.replace(/\b\w/g,c=>c.toUpperCase()), before, modifierName, delta);
        break;
      }
      case 'resistance': case 'immunity': case 'vulnerability': {
        const field = effect.kind==='resistance' ? 'resistances' : effect.kind==='immunity' ? 'immunities' : 'vulnerabilities';
        const existing = splitList(working[field]);
        const add = (effect.damageTypes||[]).filter(t=>t && existing.indexOf(t)<0);
        working[field] = joinList(existing.concat(add));
        if(add.length) recordNote(breakdown, field, field.charAt(0).toUpperCase()+field.slice(1), `${modifierName} added: ${add.join(', ')}`);
        break;
      }
      case 'condition_immunity': {
        const existing = working.conditionImmunities||[];
        const add = (effect.conditions||[]).filter(c=>c && existing.indexOf(c)<0);
        working.conditionImmunities = existing.concat(add);
        if(add.length) recordNote(breakdown, 'conditionImmunities', 'Condition Immunities', `${modifierName} added: ${add.join(', ')}`);
        break;
      }
      case 'tempHP': {
        const delta = evalScaling(effect.scaling, fullCtx);
        working._tempHPGrant = (working._tempHPGrant||0) + delta;
        recordAdjustment(breakdown, 'tempHP', 'Temporary HP (on add to encounter)', 0, modifierName, delta);
        break;
      }
      case 'attack_add': {
        const list = working[effect.targetList] || (working[effect.targetList]=[]);
        const atkBonus = Math.round(evalScaling(effect.attackBonusScaling, fullCtx));
        const diceCount = Math.max(0, Math.round((effect.dice&&effect.dice.count||0) + evalScaling(effect.diceCountScaling, fullCtx)));
        const flat = Math.round(evalScaling(effect.flatScaling, fullCtx));
        const diceStr = diceCount>0 ? formatDiceFormula([{count:diceCount, sides:(effect.dice&&effect.dice.sides)||4}], flat) : (flat? String(flat) : '');
        const newAction = {
          id: uid('e'), name: effect.name||'New Attack', description: `Added by modifier "${modifierName}".`,
          usage: effect.usage||'', attackBonus: diceStr||flat||atkBonus ? fmtMod(atkBonus) : '',
          range: effect.range||'', reach: effect.reach||'', damageDice: diceStr, damageType: effect.damageType||'',
          save: effect.save||'', _fromModifier: modifierName,
        };
        list.push(newAction);
        recordNote(breakdown, 'attack_'+newAction.name, newAction.name, `${modifierName} added this attack: ${fmtMod(atkBonus)} to hit, ${diceStr||'no'} ${effect.damageType||''} damage.`.trim());
        break;
      }
      case 'attack_remove': {
        const list = working[effect.targetList] || [];
        const target = (effect.targetName||'').trim().toLowerCase();
        if(!target){ warnings.push(`${modifierName}: Remove Attack effect has no target name set — skipped.`); return; }
        const before = list.length;
        working[effect.targetList] = list.filter(a=>(a.name||'').trim().toLowerCase()!==target);
        if(working[effect.targetList].length===before){
          warnings.push(`${modifierName}: tried to remove attack "${effect.targetName}" but no attack with that name was found.`);
        } else {
          recordNote(breakdown, 'attack_removed_'+target, effect.targetName, `${modifierName} removed this attack.`);
        }
        break;
      }
      case 'attack_roll': {
        const lists = ['actions','bonusActions','reactions'];
        const delta = Math.round(evalScaling(effect.scaling, fullCtx));
        let touched = 0;
        lists.forEach(listName=>{
          (working[listName]||[]).forEach(a=>{
            if(!effect.applyToAll && (a.name||'').trim().toLowerCase() !== (effect.targetName||'').trim().toLowerCase()) return;
            if(effect.applyToAll && effect.targetList && effect.targetList!==listName) return;
            const m = /^([+-]?\d+)/.exec((a.attackBonus||'').trim());
            const before = m ? parseInt(m[1],10) : 0;
            a.attackBonus = fmtMod(before + delta);
            touched++;
            recordAdjustment(breakdown, 'attackroll_'+a.name, 'Attack Roll: '+a.name, before, modifierName, delta);
          });
        });
        if(!touched) warnings.push(`${modifierName}: Attack Roll effect didn’t match any attack (check the target name).`);
        break;
      }
      case 'damage': {
        const key = effect.targetList || 'actions';
        const targetKeyLower = (effect.targetName||'').trim().toLowerCase();
        const pool = effect.applyToAll ? (working[key]||[]) : (working[key]||[]).filter(a=>(a.name||'').trim().toLowerCase()===targetKeyLower);
        if(!pool.length){
          warnings.push(`${modifierName}: Damage effect didn’t match any attack named "${effect.targetName}".`);
          return;
        }
        pool.forEach(a=>{
          const before = a.damageDice||'';
          const parsedBefore = parseDiceFormula(before);
          const diceCount = Math.max(0, Math.round((effect.dice&&effect.dice.count||0) + evalScaling(effect.diceCountScaling, fullCtx)));
          const flatDelta = Math.round(evalScaling(effect.flatScaling, fullCtx));
          const dupKey = key+'::'+(a.name||'')+'::replace';
          let after;
          if(effect.mode==='replace_dice'){
            if(seenTargets[dupKey]) warnings.push(`${modifierName}: another modifier already replaced "${a.name}"'s damage — this one’s replacement wins instead (last applied, per stacking order).`);
            seenTargets[dupKey] = modifierName;
            after = formatDiceFormula(diceCount>0?[{count:diceCount, sides:(effect.dice&&effect.dice.sides)||4}]:[], flatDelta);
          } else if(effect.mode==='add_dice'){
            const dice = parsedBefore.valid ? parsedBefore.dice.slice() : [];
            if(diceCount>0) dice.push({count:diceCount, sides:(effect.dice&&effect.dice.sides)||4});
            after = formatDiceFormula(dice, (parsedBefore.valid?parsedBefore.flat:0) + flatDelta);
          } else if(effect.mode==='multiply_dice'){
            const factor = effect.multiplyBy || 1;
            const dice = parsedBefore.valid ? parsedBefore.dice.map(d=>({count: Math.round(d.count*factor), sides:d.sides})) : [];
            after = formatDiceFormula(dice, (parsedBefore.valid?parsedBefore.flat:0) + flatDelta);
          } else if(effect.mode==='flat_bonus'){
            const dice = parsedBefore.valid ? parsedBefore.dice : [];
            after = formatDiceFormula(dice, (parsedBefore.valid?parsedBefore.flat:0) + flatDelta);
          } else if(effect.mode==='multiply_total'){
            // Can't be pre-baked into a dice string (it multiplies the ROLLED total, not the formula).
            // Stored as a roll-time multiplier the existing roll functions apply after rolling.
            a._dmgMultiplier = (a._dmgMultiplier||1) * (effect.multiplyBy||1);
            after = before + ' (×'+(a._dmgMultiplier)+' on roll)';
          } else {
            after = before;
          }
          if(effect.mode!=='multiply_total') a.damageDice = after;
          if(effect.damageType) a.damageType = effect.damageType;
          recordNote(breakdown, 'damage_'+(a.name||''), 'Damage: '+(a.name||'(attack)'), `${modifierName}: ${before||'(none)'} → ${after}`);
        });
        break;
      }
      case 'trait_add': {
        working.traits = working.traits || [];
        working.traits.push({id:uid('e'), name:effect.name||'New Trait', description: effect.description||'', usage:'', _fromModifier: modifierName});
        recordNote(breakdown, 'trait_'+effect.name, effect.name, `${modifierName} added this trait.`);
        break;
      }
      case 'trait_remove': {
        const target = (effect.targetName||'').trim().toLowerCase();
        if(!target){ warnings.push(`${modifierName}: Remove Trait effect has no target name set — skipped.`); return; }
        const before = (working.traits||[]).length;
        working.traits = (working.traits||[]).filter(t=>(t.name||'').trim().toLowerCase()!==target);
        if(working.traits.length===before) warnings.push(`${modifierName}: tried to remove trait "${effect.targetName}" but it wasn’t found.`);
        else recordNote(breakdown, 'trait_removed_'+target, effect.targetName, `${modifierName} removed this trait.`);
        break;
      }
      case 'descriptive': {
        const label = (DESCRIPTIVE_SUBTYPES.find(d=>d.id===effect.subtype)||{}).label || 'Special Effect';
        working.traits = working.traits || [];
        working.traits.push({id:uid('e'), name: effect.name || label, description: (effect.description? effect.description+' ' : '') + '(Added by modifier "'+modifierName+'". This is informational only — Warden does not automatically apply it during rolls.)', usage:'', _fromModifier: modifierName, _descriptiveOnly:true});
        recordNote(breakdown, 'descriptive_'+effect.id, effect.name||label, `${modifierName}: ${effect.description||label} (not mechanically automated)`);
        break;
      }
      default:
        warnings.push(`${modifierName}: unknown effect type "${effect.kind}" — skipped.`);
    }
  }catch(err){
    warnings.push(`${modifierName}: effect error — ${err.message}`);
  }
}
const DESCRIPTIVE_SUBTYPES = [
  {id:'advantage_on_attacks', label:'Advantage on Attack Rolls'},
  {id:'crit_range', label:'Expanded Critical Hit Range'},
  {id:'extra_damage_vs_type', label:'Extra Damage vs. a Creature Type'},
  {id:'damage_reduction', label:'Damage Reduction'},
  {id:'extra_crit_damage', label:'Additional Damage on Critical Hits'},
  {id:'bonus_spellcasting', label:'Bonus Spellcasting / Special Ability'},
  {id:'other', label:'Other'},
];

/* ---- The calculation pipeline ---- */
function computeModifiedCreature(baseTemplate, modifierIds, level){
  const working = deepClone(baseTemplate);
  delete working.isVariant; delete working.baseTemplateId; delete working.variantModifierIds; delete working.variantLevel;
  const breakdown = {};
  const warnings = [];
  const seenTargets = {};
  level = Number(level)||1;

  const mods = (modifierIds||[]).map(id=>getModifierAny(id)).filter(Boolean);
  const seenIds = {};
  mods.forEach(mod=>{
    if(mod.deletedAt){ warnings.push(`"${mod.name}" has been deleted and was skipped.`); return; }
    if(mod.enabled===false){ warnings.push(`"${mod.name}" is disabled and was skipped.`); return; }
    if(mod.stacking!=='stack' && seenIds[mod.id]){ warnings.push(`"${mod.name}" was selected more than once; it only allows one copy, so the duplicate was skipped.`); return; }
    seenIds[mod.id] = (seenIds[mod.id]||0)+1;
    if(mod.levelMin!==null && mod.levelMin!==undefined && mod.levelMin!=='' && level<Number(mod.levelMin)) warnings.push(`"${mod.name}" is meant for level ${mod.levelMin}+ but was applied at level ${level}.`);
    if(mod.levelMax!==null && mod.levelMax!==undefined && mod.levelMax!=='' && level>Number(mod.levelMax)) warnings.push(`"${mod.name}" is meant for level ${mod.levelMax} or below but was applied at level ${level}.`);
    (mod.effects||[]).forEach(eff=> applyEffectToWorking(working, eff, {level}, breakdown, warnings, mod.name, seenTargets));
  });

  // Finalize accumulated save bonuses now that abilities/profBonus for this computation are settled.
  if(working._saveBonusAccum){
    Object.keys(working._saveBonusAccum).forEach(ab=>{
      const bonus = working._saveBonusAccum[ab];
      const s = working.saves[ab];
      const baseline = (s.customBonus!==null && s.customBonus!==undefined && s.customBonus!=='')
        ? Number(s.customBonus) : (getAbilMod(working, ab) + (s.proficient ? (Number(working.profBonus)||0) : 0));
      s.customBonus = baseline + bonus;
      if(breakdown['save_'+ab]) breakdown['save_'+ab].base = baseline;
      if(breakdown['save_'+ab]) breakdown['save_'+ab].final = baseline + bonus;
    });
    delete working._saveBonusAccum;
  }

  const grantedTempHP = working._tempHPGrant || 0;
  delete working._tempHPGrant;

  return { creature: working, breakdown, warnings, grantedTempHP, level, modifierIds: mods.map(m=>m.id) };
}

/* ---- Modifier CRUD (mirrors template CRUD exactly) ---- */
function getModifier(id){ return (DB.modifiers||[]).find(m=>m.id===id && !m.deletedAt); }
function getModifierAny(id){ return (DB.modifiers||[]).find(m=>m.id===id); }
function activeModifiers(){ return (DB.modifiers||[]).filter(m=>!m.deletedAt); }
function saveModifier(mod){
  stampSync(mod);
  const i = (DB.modifiers||[]).findIndex(m=>m.id===mod.id);
  if(i>=0) DB.modifiers[i]=mod; else DB.modifiers.push(mod);
  scheduleSave();
}
function deleteModifier(id){
  const m = getModifierAny(id);
  if(!m) return;
  m.deletedAt = nowISO();
  stampSync(m);
  scheduleSave();
}
function duplicateModifier(id, newName){
  const src = getModifier(id);
  if(!src) return null;
  const copy = deepClone(src);
  copy.id = uid('mod');
  copy.name = newName || (src.name + ' (Copy)');
  copy.createdAt = nowISO(); copy.updatedAt = nowISO();
  copy.deviceId = getDeviceId(); copy.version = 0; copy.deletedAt = null;
  DB.modifiers.push(copy);
  scheduleSave();
  return copy;
}

/* ---- Encounter integration: build a combat participant from a
   template + a chosen set of modifiers + a scaling level. Mirrors
   instanceFromTemplate exactly (independent deep copy, own HP
   history, conditions, etc.) — the only difference is that it starts
   from the COMPUTED creature instead of the raw template, and it
   remembers the recipe + a frozen baseline so the DM can toggle
   individual modifiers on/off later without re-reading the (possibly
   since-edited) library template. ---- */
function instanceFromTemplateWithModifiers(tpl, modifierIds, level, indexLabel){
  const { creature, breakdown, warnings, grantedTempHP } = computeModifiedCreature(tpl, modifierIds, level);
  const inst = instanceFromTemplate(creature, indexLabel);
  inst.templateId = tpl.id; // keep pointing at the real base template, not the throwaway computed copy
  inst.templateName = tpl.name;
  inst.tempHP = (inst.tempHP||0) + grantedTempHP;
  if(STAT_TARGETS.initiative && creature.initiativeBonus) inst.initiativeMod = (inst.initiativeMod||0) + Number(creature.initiativeBonus||0);
  inst.sourceModifiers = { modifierIds: (modifierIds||[]).slice(), originalModifierIds: (modifierIds||[]).slice(), level: Number(level)||1, baselineTemplate: deepClone(tpl) };
  inst.modifierBreakdown = breakdown;
  inst.modifierWarnings = warnings;
  return inst;
}

/* Recompute a live combat participant's stats from its frozen baseline
   template + a (possibly changed) subset of its originally-applied
   modifiers — used when the DM toggles a modifier on/off mid-combat.
   HP is shifted by the same delta the recompute causes to Max HP, so
   toggling a +10 Max HP modifier also adjusts current HP by +10
   rather than silently resetting it to full. */
function recomputeParticipantModifiers(participant, activeModifierIds){
  if(!participant.sourceModifiers || !participant.sourceModifiers.baselineTemplate) return;
  const { creature, breakdown, warnings, grantedTempHP } = computeModifiedCreature(
    participant.sourceModifiers.baselineTemplate, activeModifierIds, participant.sourceModifiers.level);
  const oldMax = participant.maxHPOverride!=null ? Number(participant.maxHPOverride) : Number(participant.maxHP)||0;
  const newMax = Number(creature.maxHP)||0;
  const delta = newMax - oldMax;
  // Preserve everything about the live instance except the fields the modifier system actually computes.
  ['name'].forEach(()=>{}); // (name is intentionally left alone — DM may have renamed this instance)
  participant.ac = creature.ac;
  participant.maxHP = creature.maxHP;
  participant.speed = creature.speed;
  participant.abilities = creature.abilities;
  participant.saves = creature.saves;
  participant.skills = creature.skills;
  participant.resistances = creature.resistances;
  participant.immunities = creature.immunities;
  participant.vulnerabilities = creature.vulnerabilities;
  participant.conditionImmunities = creature.conditionImmunities;
  participant.senses = creature.senses;
  participant.traits = creature.traits;
  participant.actions = creature.actions;
  participant.bonusActions = creature.bonusActions;
  participant.reactions = creature.reactions;
  participant.profBonus = creature.profBonus;
  participant.spellcasting = creature.spellcasting;
  if(participant.currentHP!==null && participant.currentHP!==undefined) participant.currentHP = Math.max(0, participant.currentHP + delta);
  participant.sourceModifiers.modifierIds = activeModifierIds.slice();
  participant.modifierBreakdown = breakdown;
  participant.modifierWarnings = warnings;
  return { breakdown, warnings, hpDelta: delta };
}

/* ---- Library integration: save a computed creature as a reusable,
   independent Variant (never overwrites the base creature). ---- */
function saveCreatureVariant(baseTemplate, modifierIds, level, variantName){
  const { creature } = computeModifiedCreature(baseTemplate, modifierIds, level);
  creature.id = uid('cr');
  creature.name = variantName || (baseTemplate.name + ' (Modified)');
  creature.favorite = false;
  creature.isVariant = true;
  creature.baseTemplateId = baseTemplate.id;
  creature.variantModifierIds = (modifierIds||[]).slice();
  creature.variantLevel = Number(level)||1;
  creature.createdAt = nowISO(); creature.updatedAt = nowISO();
  creature.deviceId = getDeviceId(); creature.version = 0; creature.deletedAt = null;
  DB.templates.push(creature);
  scheduleSave();
  return creature;
}
/* Explicitly re-derive a variant from its (possibly since-edited) base
   template + its saved modifier list/level. This is the ONLY way a
   variant's computed fields ever change after being saved — editing
   the base template never silently touches existing variants, per
   spec section 8 ("do not silently overwrite their saved custom
   changes"). Any manual edits the user made directly to the variant's
   computed fields (AC, actions, etc.) ARE overwritten by this —
   that's the whole point of "recompute" and the UI warns about it
   before calling this. */
function recomputeVariant(variantId){
  const variant = getTemplate(variantId);
  if(!variant || !variant.isVariant) return null;
  const base = getTemplateAny(variant.baseTemplateId);
  if(!base){ return null; }
  const { creature, warnings } = computeModifiedCreature(base, variant.variantModifierIds, variant.variantLevel);
  const keep = {id:variant.id, name:variant.name, favorite:variant.favorite, tags:variant.tags, notes:variant.notes,
    isVariant:true, baseTemplateId:variant.baseTemplateId, variantModifierIds:variant.variantModifierIds, variantLevel:variant.variantLevel,
    createdAt:variant.createdAt, inventory:variant.inventory, customFields:variant.customFields};
  Object.assign(variant, creature, keep);
  stampSync(variant);
  scheduleSave();
  return { variant, warnings };
}

UI.modifierLibrary = { search:'', tagFilter:null };
function viewModifiers(){
  const st = UI.modifierLibrary;
  let list = activeModifiers();
  if(st.tagFilter) list = list.filter(m=>(m.tags||[]).includes(st.tagFilter));
  if(st.search.trim()){
    const q = st.search.trim().toLowerCase();
    list = list.filter(m=> (m.name||'').toLowerCase().includes(q) || (m.category||'').toLowerCase().includes(q) || (m.tags||[]).some(tg=>tg.toLowerCase().includes(q)));
  }
  list = list.slice().sort((a,b)=>(a.name||'').localeCompare(b.name||''));
  const allTags = Array.from(new Set(activeModifiers().flatMap(m=>m.tags||[]))).sort();
  return `
    <div class="card mb14">
      <p class="muted small mb10">Modifiers are reusable templates (Undead, Elite, Weak, or anything custom) you can layer onto any creature to produce a modified version of it — without ever changing the original. Build one from scratch, or add a few starting examples below.</p>
      <div class="combat-toolbar" style="position:static;">
        <div class="search-bar">
          <span class="si">&#128269;</span>
          <input type="search" placeholder="Search modifiers…" value="${esc(st.search)}" oninput="UI.modifierLibrary.search=this.value;render();">
        </div>
        <div class="nav-spacer"></div>
        <button class="btn" onclick="installExampleModifiers()">Add Example Modifiers</button>
        <button class="btn btn-primary" onclick="openModifierEditorModal(null)">&#10010; New Modifier</button>
      </div>
      ${allTags.length?`<div class="tag-list mt10">
        <span class="pill ${!st.tagFilter?'pill-gold':''}" style="cursor:pointer;" onclick="UI.modifierLibrary.tagFilter=null;render();">All</span>
        ${allTags.map(tg=>`<span class="pill ${st.tagFilter===tg?'pill-gold':''}" style="cursor:pointer;" onclick="UI.modifierLibrary.tagFilter='${esc(tg)}';render();">${esc(tg)}</span>`).join('')}
      </div>`:''}
    </div>
    ${list.length ? `<div class="grid-cards">${list.map(modifierCardHTML).join('')}</div>`
      : `<div class="empty"><div class="glyph">&#9889;</div><h3>No modifiers yet</h3><p class="small">Create one, or add the built-in examples to get started.</p></div>`}
  `;
}
function modifierCardHTML(m){

    <div class="creature-card">

          </div>
        </div>
        ${m.description?`<p class="small muted" style="margin:4px 0 0;">${esc(m.description.slice(0,110))}${m.description.length>110?'…':''}</p>`:''}

function quickDuplicateModifier(id){ const m=duplicateModifier(id); toast('Duplicated as "'+m.name+'"'); render(); }
window.quickDuplicateModifier = quickDuplicateModifier;
function confirmDeleteModifier(id){
  const m = getModifier(id); if(!m) return;
  openConfirmModal({ title:'Delete modifier?', danger:true, confirmLabel:'Delete Permanently',
    body:`"${esc(m.name)}" will be removed from your library. Creatures and saved variants that already used it keep their computed stats — nothing already in an encounter or a saved variant is affected.`,
    onConfirm:()=>{ deleteModifier(id); toast('Deleted "'+m.name+'"'); render(); } });
}
window.confirmDeleteModifier = confirmDeleteModifier;

function installExampleModifiers(){

  const examples = [
    (()=>{ const m=blankModifier(); m.name='Undead'; m.category='Undead'; m.icon='☠'; m.tags=['undead','example'];
      m.description='A basic undead toughening: colder presence, no need to breathe or feel pain, but no personality to speak of.';
      m.effects=[
        {...blankEffect('ability_mod'), ability:'cha', scaling:{method:'per_level', base:-4, perLevel:-1, formula:''}},
        {...blankEffect('ability_mod'), ability:'dex', scaling:{method:'per_level', base:2, perLevel:1, formula:''}},
        {...blankEffect('immunity'), damageTypes:['poison']},
        {...blankEffect('condition_immunity'), conditions:['Poisoned','Exhaustion']},
      ]; return m; })(),
    (()=>{ const m=blankModifier(); m.name='Elite'; m.category='Elite'; m.icon='★'; m.tags=['elite','example'];
      m.description='A tougher, harder-hitting version of a standard creature — more HP, better AC, and stronger attacks.';
      m.effects=[
        {...blankEffect('stat'), stat:'maxHP', scaling:{method:'per_level', base:10, perLevel:5, formula:''}},
        {...blankEffect('stat'), stat:'ac', scaling:{method:'flat', base:2, perLevel:0, formula:''}},
        {...blankEffect('attack_roll'), applyToAll:true, scaling:{method:'flat', base:1, perLevel:0, formula:''}},
      ]; return m; })(),
    (()=>{ const m=blankModifier(); m.name='Weak'; m.category='Weak'; m.icon='↓'; m.tags=['weak','example'];
      m.description='A frailer, easier version of a standard creature — for an easier encounter without re-building the whole stat block.';
      m.effects=[
        {...blankEffect('stat'), stat:'maxHP', scaling:{method:'per_level', base:-5, perLevel:-2, formula:''}},

let MODEDIT = null; // {draft, isNew, originalId, expandedId}
function openModifierEditorModal(id){
  const existing = id ? getModifier(id) : null;
  MODEDIT = { draft: existing ? deepClone(existing) : blankModifier(), isNew: !existing, originalId: id||null, expandedId: null };
  pushModal({ key:'modifier-editor', size:'xl', noClickAway:true, render: renderModifierEditorModal });
}
window.openModifierEditorModal = openModifierEditorModal;
function modDraftSet(path, value){ setPathSafe(MODEDIT.draft, path, value); }
function modDraftSetNum(path, value){ setPathSafe(MODEDIT.draft, path, value===''||value===null||value===undefined?null:Number(value)); }
window.modDraftSet = modDraftSet; window.modDraftSetNum = modDraftSetNum;
function modArrPush(path, obj){ const arr = getPathSafe(MODEDIT.draft, path)||[]; arr.push(obj); setPathSafe(MODEDIT.draft, path, arr); }
function modArrRemoveAt(path, i){ const arr = getPathSafe(MODEDIT.draft, path)||[]; arr.splice(i,1); setPathSafe(MODEDIT.draft, path, arr); }
function modChipsHTML(path, arr){
  arr = arr||[];
  const safe = path.replace(/\./g,'-');
  return `<div class="tag-list mb6">
      ${arr.map((t,i)=>`<span class="pill">${esc(t)}<button onclick="modArrRemoveAt('${path}',${i});updateModEditorBody();">&times;</button></span>`).join('')}
    </div>
    <div class="flex gap6">
      <input type="text" id="modchip-${safe}" placeholder="Add and press Enter" style="max-width:220px;"
        onkeydown="if(event.key==='Enter'){event.preventDefault(); modAddChip('${path}', this);}">
      <button class="btn btn-sm" onclick="modAddChip('${path}', document.getElementById('modchip-${safe}'))">Add</button>
    </div>`;
}
function modAddChip(path, input){
  const v = input.value.trim(); if(!v) return;
  const arr = getPathSafe(MODEDIT.draft, path)||[];
  if(arr.indexOf(v)<0) arr.push(v);
  setPathSafe(MODEDIT.draft, path, arr);
  input.value=''; updateModEditorBody();
}

function updateModEditorBody(){
  const el = document.getElementById('modedit-body');

function groupBy(arr, key){ const o={}; arr.forEach(x=>{ (o[x[key]]=o[x[key]]||[]).push(x); }); return o; }
function addEffectFromPicker(){
  const sel = document.getElementById('new-effect-kind');

  MODEDIT.draft.effects.push(eff);
  MODEDIT.expandedId = eff.id;
  updateModEditorBody();

function effectsListHTML(d){
  const effects = d.effects||[];
  if(!effects.length) return `<p class="faint small">No effects yet — pick a type below and click "+ Add Effect".</p>`;
  return effects.map((eff,i)=>effectRowHTML(eff,i,effects.length)).join('');
}
function effectKindMeta(kind){ return EFFECT_KINDS.find(e=>e.kind===kind) || {label:kind, hint:''}; }
function effectSummary(eff){
  const meta = effectKindMeta(eff.kind);
  try{
    switch(eff.kind){
      case 'ability_score': return `${ABIL_LABEL[eff.ability]} score ${describeScaling(eff.scaling)}`;
      case 'ability_mod': return `${ABIL_LABEL[eff.ability]} modifier ${describeScaling(eff.scaling)}`;
      case 'stat': return `${(STAT_TARGETS[eff.stat]||{}).label||eff.stat} ${describeScaling(eff.scaling)}`;
      case 'save': return `${ABIL_LABEL[eff.ability]} save ${describeScaling(eff.scaling)}`;
      case 'skill': return `${eff.skillName||'(unnamed skill)'} ${describeScaling(eff.scaling)}`;
      case 'resistance': return `Resist: ${joinList(eff.damageTypes||[])||'(none selected)'}`;
      case 'immunity': return `Immune: ${joinList(eff.damageTypes||[])||'(none selected)'}`;
      case 'vulnerability': return `Vulnerable: ${joinList(eff.damageTypes||[])||'(none selected)'}`;
      case 'condition_immunity': return `Condition immune: ${joinList(eff.conditions||[])||'(none selected)'}`;
      case 'tempHP': return `Grants temp HP ${describeScaling(eff.scaling)}`;
      case 'attack_add': return `Adds attack "${eff.name}" (${eff.dice.count}d${eff.dice.sides} ${eff.damageType||''})`;
      case 'attack_remove': return `Removes attack "${eff.targetName||'(unnamed)'}"`;
      case 'attack_roll': return `${eff.applyToAll?'All attacks':'"'+(eff.targetName||'')+'"'} attack roll ${describeScaling(eff.scaling)}`;
      case 'damage': return `${eff.applyToAll?'All attacks':'"'+(eff.targetName||'(unnamed)')+'"'} damage: ${effectDamageModeLabel(eff.mode)}`;
      case 'trait_add': return `Adds trait "${eff.name}"`;
      case 'trait_remove': return `Removes trait "${eff.targetName||'(unnamed)'}"`;
      case 'descriptive': return `${(DESCRIPTIVE_SUBTYPES.find(x=>x.id===eff.subtype)||{}).label||'Descriptive effect'}${eff.name?': '+eff.name:''}`;
      default: return meta.label;
    }
  }catch(e){ return meta.label; }
}
function effectDamageModeLabel(mode){
  return {add_dice:'add dice', replace_dice:'replace formula', multiply_dice:'multiply dice count', flat_bonus:'flat bonus only', multiply_total:'multiply rolled total'}[mode] || mode;

function moveEffect(i, dir){

          <select onchange="modDraftSet('${p}.subtype',this.value)">${DESCRIPTIVE_SUBTYPES.map(s=>`<option value="${s.id}" ${eff.subtype===s.id?'selected':''}>${esc(s.label)}</option>`).join('')}</select>
        </div>
        <div class="field"><label class="field-label">Short Name (optional — defaults to the type above)</label><input type="text" value="${esc(eff.name||'')}" oninput="modDraftSet('${p}.name',this.value)"></div>
        <div class="field"><label class="field-label">Description</label><textarea placeholder="Explain exactly what this does at the table — Warden will add this as a trait note but won't simulate it automatically." oninput="modDraftSet('${p}.description',this.value)">${esc(eff.description||'')}</textarea></div>`;
    default: return '';
  }
}
function damageTypeCheckboxes(path, selected){
  selected = selected||[];
  return `<div class="flex-wrap gap6">${DAMAGE_TYPES.map(t=>`
    <label class="checkbox-row"><input type="checkbox" ${selected.indexOf(t)>=0?'checked':''}
      onchange="modToggleListItem('${path}','${t}',this.checked)"> ${t}</label>`).join('')}</div>`;
}
function conditionCheckboxes(path, selected){
  selected = selected||[];
  return `<div class="flex-wrap gap6">${CONDITIONS.map(c=>`
    <label class="checkbox-row"><input type="checkbox" ${selected.indexOf(c)>=0?'checked':''}
      onchange="modToggleListItem('${path}','${c}',this.checked)"> ${c}</label>`).join('')}</div>`;
}
function modToggleListItem(path, value, checked){
  const arr = getPathSafe(MODEDIT.draft, path)||[];
  const idx = arr.indexOf(value);
  if(checked && idx<0) arr.push(value);
  if(!checked && idx>=0) arr.splice(idx,1);
  setPathSafe(MODEDIT.draft, path, arr);
}
window.modToggleListItem = modToggleListItem;

/* Live preview inside the modifier editor: run the modifier (and only
   this modifier) against a sample creature so the author can see what
   it actually does before saving. Uses a throwaway in-memory modifier
   entry so this never touches DB.modifiers. */
UI.modifierPreviewSample = { templateId:null, level:1 };
function modifierPreviewHTML(d){
  const pool = activeTemplates();
  if(!pool.length) return `<p class="faint small">Create a creature in your Library to preview against.</p>`;
  if(!UI.modifierPreviewSample.templateId) UI.modifierPreviewSample.templateId = pool[0].id;
  const sample = getTemplate(UI.modifierPreviewSample.templateId) || pool[0];
  const level = UI.modifierPreviewSample.level;
  const tempId = 'preview_'+(d.id||'draft');
  const prevExisting = getModifierAny(tempId);
  // Temporarily register the in-progress draft under a scratch id so computeModifiedCreature can find it,
  // then remove it immediately — this never persists and is never saved/synced.
  const scratch = deepClone(d); scratch.id = tempId; scratch.deletedAt = null; scratch.enabled = true;
  DB.modifiers.push(scratch);
  let result;
  try{ result = computeModifiedCreature(sample, [tempId], level); }
  finally{ DB.modifiers = DB.modifiers.filter(m=>m.id!==tempId); }
  return `
    <div id="mod-preview-host">
      <div class="field-row">
        <div class="field"><label class="field-label">Preview against</label>
          <select onchange="UI.modifierPreviewSample.templateId=this.value;updateModPreviewOnly();">
            ${pool.map(t=>`<option value="${t.id}" ${t.id===sample.id?'selected':''}>${esc(t.name)}</option>`).join('')}
          </select>
        </div>
        <div class="field"><label class="field-label">At level/scaling value</label><input type="number" min="1" value="${level}" oninput="UI.modifierPreviewSample.level=Number(this.value)||1;updateModPreviewOnly();"></div>
      </div>
      ${breakdownHTML(result.breakdown)}
      ${result.warnings.length?`<div class="mt10">${result.warnings.map(w=>`<p class="small" style="color:var(--blood-bright)">&#9888; ${esc(w)}</p>`).join('')}</div>`:''}
    </div>`;
}
function breakdownHTML(breakdown){
  const keys = Object.keys(breakdown||{});
  if(!keys.length) return `<p class="faint small">No effects produce a calculable change yet.</p>`;
  return `<div class="grid gap6">${keys.map(k=>{
    const b = breakdown[k];
    if(b.textOnly) return `<div class="entry-row"><b class="small">${esc(b.label)}</b><div class="small faint">${b.notes.map(esc).join('<br>')}</div></div>`;
    return `<div class="entry-row flex-between">
        <span class="small"><b>${esc(b.label)}</b></span>
        <span class="small">${fmtMod(b.base)} ${b.adjustments.map(a=>` ${a.value>=0?'+':'−'} ${Math.abs(a.value)} (${esc(a.source)})`).join('')} = <b>${fmtMod(b.final)}</b></span>
      </div>`;
  }).join('')}</div>`;
}

/* ---------------------------------------------------------------
   27d. APPLY MODIFIERS — pick a creature + modifiers + level, preview
   the result, then either add it straight to an encounter (temporary)
   or save it as a reusable Variant in the Creature Library.
--------------------------------------------------------------- */
let APPLYMOD = null; // {templateId, selectedIds:[], level, campId, encId, qty}
function openApplyModifiersModal(templateId, encounterCtx){
  const tpl = getTemplate(templateId);
  if(!tpl){ toast('Creature not found.', true); return; }
  APPLYMOD = { templateId, selectedIds: [], level: 1, campId: encounterCtx&&encounterCtx.campId, encId: encounterCtx&&encounterCtx.encId };
  pushModal({ key:'apply-modifiers', size:'xl', render: renderApplyModifiersModal });
}
window.openApplyModifiersModal = openApplyModifiersModal;

function renderApplyModifiersModal(){
  const tpl = getTemplate(APPLYMOD.templateId);
  if(!tpl){ return `<div class="modal-head"><h2>Apply Modifiers</h2><button class="modal-close" onclick="popModal()">&times;</button></div><div class="modal-body"><p>That creature no longer exists.</p></div>`; }
  const mods = activeModifiers();
  let result = null, errorMsg = null;
  try{ result = computeModifiedCreature(tpl, APPLYMOD.selectedIds, APPLYMOD.level); }
  catch(e){ errorMsg = e.message; }
  return `
    <div class="modal-head"><h2>Apply Modifiers — ${esc(tpl.name)}</h2><button class="modal-close" onclick="popModal()">&times;</button></div>
    <div class="modal-body">
      <div class="field-row">
        <div class="field"><label class="field-label">Scaling Level / Value</label>
          <input type="number" min="1" value="${APPLYMOD.level}" oninput="APPLYMOD.level=Number(this.value)||1;renderModals();">
          <p class="hint">This is a modifier-scaling value you choose — it is completely separate from this creature's Challenge Rating, which is never changed.</p>
        </div>
      </div>
      <div class="field">
        <label class="field-label">Modifiers to apply</label>
        ${mods.length ? `<div class="grid gap6">${mods.map(m=>applyModifierRowHTML(m, tpl)).join('')}</div>`
          : `<p class="faint small">No modifiers yet — go to the Modifiers page to create one or add the built-in examples.</p>`}
      </div>
      <div class="hr"></div>
      <div class="section-title">Preview</div>
      ${errorMsg?`<p class="small" style="color:var(--blood-bright)">&#9888; ${esc(errorMsg)}</p>`:breakdownHTML(result.breakdown)}
      ${result && result.warnings.length?`<div class="mt10">${result.warnings.map(w=>`<p class="small" style="color:var(--blood-bright)">&#9888; ${esc(w)}</p>`).join('')}</div>`:''}
      ${result ? applyModifiersActionDamageTable(result.creature) : ''}
    </div>
    <div class="modal-foot">
      ${APPLYMOD.campId?`
        <div class="field" style="margin-right:8px;max-width:90px;"><input type="number" min="1" value="${APPLYMOD.qty||1}" oninput="APPLYMOD.qty=Number(this.value)||1;" title="Quantity to add"></div>
        <button class="btn btn-gold" onclick="applyModifiersAddToEncounter()">Add to Encounter</button>`:''}
      <button class="btn btn-primary" onclick="applyModifiersSaveVariant()">Save as Variant…</button>
      <button class="btn" onclick="popModal()">Close</button>
    </div>`;
}
function applyModifierRowHTML(m, tpl){
  const checked = APPLYMOD.selectedIds.indexOf(m.id)>=0;
  const sizeOk = !m.allowedSizes || !m.allowedSizes.length || m.allowedSizes.indexOf(tpl.size)>=0;
  const typeOk = !m.allowedTypes || !m.allowedTypes.length || m.allowedTypes.map(t=>t.toLowerCase()).indexOf((tpl.type||'').toLowerCase())>=0;
  const restricted = !sizeOk || !typeOk;
  return `
    <label class="entry-row flex-between" style="cursor:pointer;${restricted?'opacity:0.6;':''}">
      <span class="small"><input type="checkbox" ${checked?'checked':''} onchange="toggleApplyModifier('${m.id}',this.checked)"> <b>${m.icon?esc(m.icon)+' ':''}${esc(m.name)}</b>
        ${restricted?'<span class="faint"> — may not fit this creature (size/type restriction)</span>':''}
        ${m.description?`<span class="faint"> — ${esc(m.description.slice(0,80))}</span>`:''}
      </span>
    </label>`;
}
function toggleApplyModifier(id, checked){
  const i = APPLYMOD.selectedIds.indexOf(id);
  if(checked && i<0) APPLYMOD.selectedIds.push(id);
  if(!checked && i>=0) APPLYMOD.selectedIds.splice(i,1);
  renderModals();
}
window.toggleApplyModifier = toggleApplyModifier;
function applyModifiersActionDamageTable(creature){
  const all = [...(creature.actions||[]), ...(creature.bonusActions||[]), ...(creature.reactions||[])];
  if(!all.length) return '';
  return `<div class="mt10"><div class="section-title">Attacks</div>
    ${all.map(a=>`<div class="entry-row small flex-between"><span><b>${esc(a.name)}</b>${a._fromModifier?' <span class="pill">new</span>':''}</span>
      <span>${a.attackBonus?('Atk '+esc(a.attackBonus)+' · '):''}${esc(a.damageDice||'—')}${a.damageType?' '+esc(a.damageType):''}</span></div>`).join('')}
  </div>`;
}
function applyModifiersAddToEncounter(){
  const tpl = getTemplate(APPLYMOD.templateId);
  const enc = getEncounter(APPLYMOD.campId, APPLYMOD.encId);
  if(!tpl || !enc){ toast('Could not find that creature or encounter.', true); return; }
  const qty = clamp(APPLYMOD.qty||1, 1, 50);
  const existingCount = enc.participants.filter(p=>p.templateId===tpl.id).length;
  for(let i=1;i<=qty;i++){
    const inst = instanceFromTemplateWithModifiers(tpl, APPLYMOD.selectedIds, APPLYMOD.level, qty===1&&existingCount===0?null:(existingCount+i));
    enc.participants.push(inst);
  }
  touchRecentGlobal(tpl.id);
  const camp = getCampaign(APPLYMOD.campId);
  if(camp) touchRecentCampaign(camp, tpl.id);
  persistEncounter(APPLYMOD.campId, APPLYMOD.encId);
  toast((qty>1?`Added ${qty}× `:'Added ')+tpl.name+(APPLYMOD.selectedIds.length?' with modifiers':''));
  APPLYMOD = null;
  closeAllModals();
  render();
}
window.applyModifiersAddToEncounter = applyModifiersAddToEncounter;
function applyModifiersSaveVariant(){
  const tpl = getTemplate(APPLYMOD.templateId);
  if(!tpl) return;
  const modNames = APPLYMOD.selectedIds.map(id=>getModifier(id)).filter(Boolean).map(m=>m.name);
  const defaultName = modNames.length ? `${tpl.name} (${modNames.join(' ')})` : `${tpl.name} (Modified)`;
  openPromptModal({
    title:'Save as Creature Variant', label:'Variant name', value: defaultName, submitLabel:'Save Variant',
    onSubmit:(name)=>{
      if(!name || !name.trim()){ toast('Give the variant a name.', true); return; }
      const variant = saveCreatureVariant(tpl, APPLYMOD.selectedIds, APPLYMOD.level, name.trim());
      toast('Saved "'+variant.name+'" to your Creature Library');
      APPLYMOD = null;
      closeAllModals();
      go('library');
    }
  });
}
window.applyModifiersSaveVariant = applyModifiersSaveVariant;

/* ---- Variant "recompute from base" (Creature Library) ---- */
function confirmRecomputeVariant(id){
  const v = getTemplate(id); if(!v) return;
  openConfirmModal({
    title:'Recompute variant from base creature?', danger:true, confirmLabel:'Recompute',
    body:`This re-runs "${esc(v.name)}"'s saved modifiers against the current version of its base creature. Any manual edits you've made directly to this variant's stats, attacks, or traits since it was created will be OVERWRITTEN. This cannot be undone unless you have a backup export.`,
    onConfirm:()=>{
      const res = recomputeVariant(id);
      if(!res){ toast('Could not recompute — the base creature may have been deleted.', true); return; }
      toast('Recomputed "'+res.variant.name+'"'+(res.warnings.length?' (see warnings)':''));
      render();
    }
  });
}
window.confirmRecomputeVariant = confirmRecomputeVariant;

/* ---------------------------------------------------------------
   27e. COMBAT PARTICIPANT INTEGRATION — show which modifiers are
   active on a participant, with toggles, and a breakdown view.
--------------------------------------------------------------- */
UI.modifierBreakdownOpen = {}; // participantId -> bool
function participantModifiersHTML(camp, enc, p){
  const sm = p.sourceModifiers;
  const allIds = sm.baselineTemplate ? [] : [];
  const originalIds = (sm.baselineTemplate && sm.originalModifierIds) || sm.modifierIds;
  // originalModifierIds (if present) lists every modifier the participant started with, so toggling
  // one off and back on later doesn't lose it; fall back to the current list for older saves.
  const chipIds = sm.originalModifierIds || sm.modifierIds;
  const open = !!UI.modifierBreakdownOpen[p.id];
  return `
    <div class="mt6" style="border-top:1px solid var(--border-soft);padding-top:6px;">
      <div class="flex-between small" style="cursor:pointer;" onclick="toggleParticipantBreakdown('${p.id}')">
        <span>&#9889; Modifiers (Lvl ${sm.level})</span><span class="chev">${open?'▲':'▼'}</span>
      </div>
      <div class="flex-wrap gap6 mt6">
        ${chipIds.map(id=>{
          const m = getModifierAny(id);
          const active = sm.modifierIds.indexOf(id)>=0;
          return `<label class="pill ${active?'pill-gold':''}" style="cursor:pointer;">
            <input type="checkbox" style="margin-right:4px;" ${active?'checked':''} onchange="toggleParticipantModifier('${camp.id}','${enc.id}','${p.id}','${id}',this.checked)">
            ${m?esc(m.name):'(deleted modifier)'}</label>`;
        }).join('')}
      </div>
      ${open?breakdownHTML(p.modifierBreakdown):''}
      ${open && p.modifierWarnings && p.modifierWarnings.length?p.modifierWarnings.map(w=>`<p class="small" style="color:var(--blood-bright)">&#9888; ${esc(w)}</p>`).join(''):''}
    </div>`;
}
function toggleParticipantBreakdown(id){ UI.modifierBreakdownOpen[id] = !UI.modifierBreakdownOpen[id]; render(); }
window.toggleParticipantBreakdown = toggleParticipantBreakdown;
function toggleParticipantModifier(campId, encId, partId, modId, checked){
  const p = findParticipant(campId, encId, partId);
  if(!p || !p.sourceModifiers) return;
  if(!p.sourceModifiers.originalModifierIds) p.sourceModifiers.originalModifierIds = p.sourceModifiers.modifierIds.slice();
  let ids = p.sourceModifiers.modifierIds.slice();
  if(checked && ids.indexOf(modId)<0) ids.push(modId);
  if(!checked) ids = ids.filter(x=>x!==modId);
  const res = recomputeParticipantModifiers(p, ids);
  stampSync(p);
  persistEncounter(campId, encId);
  if(res) toast(`Modifiers updated${res.hpDelta?` (HP ${res.hpDelta>=0?'+':''}${res.hpDelta})`:''}`);
  render();
}
window.toggleParticipantModifier = toggleParticipantModifier;

</script>

<script>
/* Offline-PWA registration. Purely additive: if this fails for any reason
   (unsupported browser, opened as a local file, etc.) the app still works
   exactly as it does standalone — this only adds "works without a network
   connection after the first visit, and refreshes itself when you're back
   online" on top of that. */
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then((reg) => {
      reg.addEventListener('updatefound', () => {
        const worker = reg.installing;
        if (!worker) return;
        worker.addEventListener('statechange', () => {
          if (worker.state === 'installed' && navigator.serviceWorker.controller) {
            showUpdateBanner();
          }
        });
      });
    }).catch(() => { /* offline support just won't be available; app still works */ });
  });
}
function showUpdateBanner(){
  if (document.getElementById('sw-update-banner')) return;
  const bar = document.createElement('div');
  bar.id = 'sw-update-banner';
  bar.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:999;background:#2a251b;color:#e9e0c9;'
    + 'border-top:1px solid #3d3524;padding:10px 14px;display:flex;gap:10px;align-items:center;'
    + 'justify-content:center;font:13px -apple-system,sans-serif;';
  bar.innerHTML = '<span>A new version of Warden is ready.</span>'
    + '<button id="sw-update-btn" style="background:#c9a227;color:#1c1608;border:none;border-radius:6px;'
    + 'padding:6px 12px;font-weight:600;cursor:pointer;">Reload</button>';
  document.body.appendChild(bar);
  document.getElementById('sw-update-btn').onclick = () => location.reload();
}
</script>
</body>
