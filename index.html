/* ---- HP / condition / initiative mutators ---- */
function withParticipant(campId, encId, partId, fn){
  const p = findParticipant(campId, encId, partId);
  if(!p) return;
  fn(p);
  stampSync(p);
  persistEncounter(campId, encId);
}
function recordHP(p, prev, next, amount, type, reason){
  p.hpHistory = p.hpHistory || [];
  p.hpHistory.unshift({id:uid('hh'), timestamp:nowISO(), prev, new_:next, amount, type, reason:reason||''});
  p.hpHistory = p.hpHistory.slice(0,50);
}
function applyHP(campId, encId, partId, delta){
  withParticipant(campId, encId, partId, p=>{
    const maxHP = p.maxHPOverride ?? p.maxHP;
    let cur = p.currentHP===null||p.currentHP===undefined ? (maxHP||0) : p.currentHP;
    let remaining = delta;
    if(delta<0 && p.tempHP>0){
      const absorb = Math.min(p.tempHP, -delta);
      p.tempHP -= absorb;
      remaining = delta + absorb;
    }
    const prev = cur;
    let next = cur + remaining;
    if(maxHP!==null && maxHP!==undefined && maxHP!=='') next = Math.min(next, Number(maxHP));
    p.currentHP = next;
    recordHP(p, prev, next, delta, delta<0?'damage':'heal');
  });
  render();
}
window.applyHP = applyHP;
function applyCustomHP(campId, encId, partId, inputId, sign){
  const el = document.getElementById(inputId);
  const amt = parseInt(el.value,10);
  if(!amt || amt<=0){ toast('Enter an amount first.', true); return; }
  applyHP(campId, encId, partId, amt*sign);
  el.value='';
}

function rollSave(campId, encId, partId, ab){
  const p = findParticipant(campId, encId, partId);
  const bonus = getSaveBonus(p, ab);
  const d20 = rollD20('normal');
  const total = d20.value + bonus;
  showRollResultModal(`${ABIL_LABEL[ab]} Saving Throw — ${p.name}`, total, `d20 (${d20.value}) ${fmtMod(bonus)}`);
}

function rollAttack(campId, encId, partId, actionId){
  const p = findParticipant(campId, encId, partId);
  const a = (p.actions||[]).find(x=>x.id===actionId);
  const bonus = parseInt((a.attackBonus||'0').replace(/[^\d\-+]/g,''),10)||0;
  const d20 = rollD20('normal');
  const total = d20.value + bonus;
  showRollResultModal(`${a.name} — Attack Roll`, total, `d20 (${d20.value}) ${fmtMod(bonus)}${d20.value===20?' — CRITICAL HIT!':d20.value===1?' — CRITICAL MISS':''}`);
}
window.rollAttack = rollAttack;
function rollDamage(campId, encId, partId, actionId){
  const p = findParticipant(campId, encId, partId);
  const a = (p.actions||[]).find(x=>x.id===actionId);
  const res = rollExpression(a.damageDice);
  if(!res){ toast('Could not parse damage dice: '+a.damageDice, true); return; }
  applyDamageMultiplier(res, a);
  showRollResultModal(`${a.name} — Damage${a.damageType?' ('+a.damageType+')':''}`, res.total, res.breakdown);
}
window.rollDamage = rollDamage;
/* Applies a modifier's "multiply the ROLLED total" damage effect (see the
   Creature Modifier System, section 27) after the dice have already been
   rolled — this is the one damage-change mode that genuinely can't be
   pre-baked into the displayed damage formula, since it multiplies the
   actual result, not the dice themselves. Mutates res in place. */
function applyDamageMultiplier(res, action){
  if(!action || !action._dmgMultiplier || action._dmgMultiplier===1) return res;
  const before = res.total;
  res.total = Math.round(res.total * action._dmgMultiplier);
  res.breakdown = `${res.breakdown}  →  ${before} × ${action._dmgMultiplier} (modifier) = ${res.total}`;
  return res;
}

  pushModal({

      return `

        <div class="modal-foot"><button class="btn btn-primary" onclick="popModal()">Close</button></div>`;
    }
  });
}

function quickRoll(sides, ctx){

    const v = rollDie(sides);
    result = {total:v, breakdown:`d${sides}: ${v}`, expr:'d'+sides};

function downloadJSON(filename, obj){
  const blob = new Blob([JSON.stringify(obj,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}

  } else if(type==='pc'){
    const p = getPlayerCharacter(a);
    downloadJSON(`warden-character-${slug(p.name)}.json`, {wardenExport:'playercharacter', version:1, data:p});
    toast('Exported "'+p.name+'"');
  } else if(type==='campaign'){
    const c = getCampaign(a);
    const tpls = c.templateRefs.map(getTemplate).filter(Boolean);

    downloadJSON(`warden-campaign-${slug(c.name)}.json`, {wardenExport:'campaign', version:1, data:c, referencedTemplates:tpls, referencedPlayerCharacters:pcs});

function handleImportFile(input){

function timeAgo(iso){
  const diff = Date.now() - new Date(iso).getTime();
  const mins = Math.floor(diff/60000);
  if(mins<1) return 'just now';
  if(mins<60) return mins+' minute'+(mins===1?'':'s')+' ago';
  const hrs = Math.floor(mins/60);
  if(hrs<24) return hrs+' hour'+(hrs===1?'':'s')+' ago';
  const days = Math.floor(hrs/24);
  return days+' day'+(days===1?'':'s')+' ago';
}

/* ===================================================================
   20. SYNC ENGINE — pure merge logic (no DOM, no network in this
   section; fully unit-testable). This is what makes GitHub sync an
   actual merge instead of "last write wins" or "upload and hope".
=================================================================== */

function deepEqual(a,b){
  if(a===b) return true;
  if(a===null||b===null||a===undefined||b===undefined) return a===b;
  if(typeof a!==typeof b) return false;
  if(typeof a!=='object') return a===b;
  if(Array.isArray(a)!==Array.isArray(b)) return false;
  if(Array.isArray(a)){
    if(a.length!==b.length) return false;
    for(let i=0;i<a.length;i++) if(!deepEqual(a[i],b[i])) return false;
    return true;
  }
  const ka = Object.keys(a), kb = Object.keys(b);
  if(ka.length!==kb.length) return false;
  for(const k of ka){ if(!Object.prototype.hasOwnProperty.call(b,k) || !deepEqual(a[k],b[k])) return false; }
  return true;
}
function unionPrimitiveArrays(a,b){
  a=a||[]; b=b||[];
  return Array.from(new Set([...a,...b]));
}
function arrToMap(arr){ const m=new Map(); (arr||[]).forEach(o=>{ if(o && o.id!==undefined) m.set(o.id,o); }); return m; }

const SYNC_META_KEYS = ['updatedAt','version','deviceId','createdAt','id'];

/* Shallow-field 3-way merge for one object. Returns {merged, conflicts:[{field,local,remote}]} */
function mergeObjectFields(local, remote, baseline, opts){
  opts = opts||{};
  const ignoreKeys = new Set([...SYNC_META_KEYS, ...(opts.ignoreKeys||[])]);
  const arrayUnionKeys = new Set(opts.arrayUnionKeys||[]);
  const merged = deepClone(local);
  const conflicts = [];
  const keys = new Set([...Object.keys(local||{}), ...Object.keys(remote||{})]);
  keys.forEach(k=>{
    if(ignoreKeys.has(k)) return;
    const lv = local ? local[k] : undefined;
    const rv = remote ? remote[k] : undefined;
    if(deepEqual(lv, rv)){ merged[k]=lv; return; }
    if(k==='deletedAt' && lv && rv){ merged[k] = (new Date(lv) < new Date(rv)) ? lv : rv; return; } // both sides deleted it independently — not a real conflict
    if(arrayUnionKeys.has(k)){ merged[k] = unionPrimitiveArrays(lv, rv); return; }
    if(baseline){
      const bv = baseline[k];
      const lChanged = !deepEqual(lv, bv);
      const rChanged = !deepEqual(rv, bv);
      if(lChanged && !rChanged){ merged[k]=lv; return; }
      if(rChanged && !lChanged){ merged[k]=rv; return; }
      if(!lChanged && !rChanged){ merged[k]=lv; return; }
      conflicts.push({field:k, local:lv, remote:rv});
      merged[k]=lv; // keep local until the user resolves
    } else {
      conflicts.push({field:k, local:lv, remote:rv});
      merged[k]=lv;
    }
  });
  return {merged, conflicts};
}

/* Generic id-keyed 3-way array merge (top-level object per id). mergeFn(local,remote,baseline)->{merged,conflicts} */
function mergeById(localArr, remoteArr, baselineArr, mergeFn){
  const lMap = arrToMap(localArr), rMap = arrToMap(remoteArr), bMap = arrToMap(baselineArr);
  const ids = new Set([...lMap.keys(), ...rMap.keys()]);
  const result = []; const conflicts = [];
  let newFromRemote=0, newFromLocal=0, mergedCount=0;
  ids.forEach(id=>{
    const inL = lMap.has(id), inR = rMap.has(id), inB = bMap.has(id);
    if(inL && !inR){ result.push(deepClone(lMap.get(id))); if(!inB) newFromLocal++; return; }
    if(!inL && inR){ result.push(deepClone(rMap.get(id))); newFromRemote++; return; }
    // inL && inR
    const {merged, conflicts:fieldConflicts} = mergeFn(lMap.get(id), rMap.get(id), bMap.get(id)||null);
    if(fieldConflicts.length){
      conflicts.push({id, local:lMap.get(id), remote:rMap.get(id), fields:fieldConflicts});
      mergedCount++;
    } else if(!deepEqual(stripSyncMeta(lMap.get(id)), stripSyncMeta(merged))){
      mergedCount++;
    }
    result.push(merged);
  });
  return { result, conflicts, stats:{newFromRemote, newFromLocal, merged:mergedCount} };
}
function stripSyncMeta(o){
  if(!o) return o;
  const c = {...o};
  SYNC_META_KEYS.forEach(k=>delete c[k]);
  return c;
}

/* ---- HP history-aware participant merge (section 14/15) ---- */
function mergeHpHistory(localHist, remoteHist){
  const map = new Map();
  (localHist||[]).forEach(h=>map.set(h.id,h));
  (remoteHist||[]).forEach(h=>{ if(!map.has(h.id)) map.set(h.id,h); });
  return Array.from(map.values()).sort((a,b)=> new Date(b.timestamp)-new Date(a.timestamp)).slice(0,80);
}
function mergeConditions(localC, remoteC){
  const map = new Map();
  (localC||[]).forEach(c=>map.set(c.id,c));
  (remoteC||[]).forEach(c=>{ if(!map.has(c.id)) map.set(c.id,c); });
  return Array.from(map.values());
}
function mergeInventory(localInv, remoteInv){
  const map = new Map();
  (localInv||[]).forEach(i=>map.set(i.id,i));
  (remoteInv||[]).forEach(i=>{ if(!map.has(i.id)) map.set(i.id,i); });
  return Array.from(map.values());
}
function mergeParticipant(local, remote, baseline){
  const {merged, conflicts} = mergeObjectFields(local, remote, baseline, {
    ignoreKeys:['hpHistory','conditions','inventory','currentHP','tempHP'],
  });
  const mergedHist = mergeHpHistory(local.hpHistory, remote.hpHistory);
  merged.hpHistory = mergedHist;
  merged.conditions = mergeConditions(local.conditions, remote.conditions);
  merged.inventory = mergeInventory(local.inventory, remote.inventory);
  // Derive current HP from whichever side made the most recent change — the HP
  // history log itself is what lets us do this without guessing.
  if(mergedHist.length){
    merged.currentHP = mergedHist[0].new_;
  } else {
    const lNewer = new Date(local.updatedAt) >= new Date(remote.updatedAt);
    merged.currentHP = lNewer ? local.currentHP : remote.currentHP;
  }
  const lNewer2 = new Date(local.updatedAt) >= new Date(remote.updatedAt);
  merged.tempHP = lNewer2 ? local.tempHP : remote.tempHP;
  return {merged, conflicts};
}
function mergeParticipants(localArr, remoteArr, baselineArr){
  return mergeById(localArr, remoteArr, baselineArr, mergeParticipant);
}

/* ---- Encounter merge ---- */
function mergeEncounter(local, remote, baseline){
  const {merged, conflicts} = mergeObjectFields(local, remote, baseline, {
    ignoreKeys:['participants'],
  });
  const baseParts = baseline ? baseline.participants : null;
  const partResult = mergeParticipants(local.participants, remote.participants, baseParts);
  merged.participants = partResult.result;
  return {merged, conflicts: conflicts.concat(partResult.conflicts.map(c=>({field:'participants:'+c.id, local:c.local, remote:c.remote, subFields:c.fields})))};
}
function mergeEncounters(localArr, remoteArr, baselineArr){
  return mergeById(localArr, remoteArr, baselineArr, mergeEncounter);
}

/* ---- Campaign merge ---- */
function mergeRecent(localRecent, remoteRecent){
  const map = new Map();
  (localRecent||[]).forEach(r=>map.set(r.templateId,r));
  (remoteRecent||[]).forEach(r=>{
    const existing = map.get(r.templateId);
    if(!existing || new Date(r.ts) > new Date(existing.ts)) map.set(r.templateId, r);
  });
  return Array.from(map.values()).sort((a,b)=>new Date(b.ts)-new Date(a.ts)).slice(0,15);
}
function mergeCampaign(local, remote, baseline){
  const {merged, conflicts} = mergeObjectFields(local, remote, baseline, {
    ignoreKeys:['encounters','recent'],
    arrayUnionKeys:['templateRefs','favorites'],
  });
  merged.recent = mergeRecent(local.recent, remote.recent);
  const baseEnc = baseline ? baseline.encounters : null;
  const encResult = mergeEncounters(local.encounters, remote.encounters, baseEnc);
  merged.encounters = encResult.result;
  return {merged, conflicts: conflicts.concat(encResult.conflicts.map(c=>({field:'encounter:'+c.id, local:c.local, remote:c.remote, subFields:c.fields})))};
}
function mergeCampaigns(localArr, remoteArr, baselineArr){
  return mergeById(localArr, remoteArr, baselineArr, mergeCampaign);
}

/* ---- Template merge ---- */
function mergeTemplate(local, remote, baseline){
  return mergeObjectFields(local, remote, baseline, { arrayUnionKeys:['tags'] });
}
function mergeTemplates(localArr, remoteArr, baselineArr){
  return mergeById(localArr, remoteArr, baselineArr, mergeTemplate);
}

/* ---- Player Character merge (same field-diff engine as templates) ---- */
function mergePlayerCharacter(local, remote, baseline){
  return mergeObjectFields(local, remote, baseline, { arrayUnionKeys:['tags','languages'] });
}
function mergePlayerCharacters(localArr, remoteArr, baselineArr){
  return mergeById(localArr, remoteArr, baselineArr, mergePlayerCharacter);
}

/* ---- Modifier merge (same field-diff engine as templates) ---- */
function mergeModifier(local, remote, baseline){
  return mergeObjectFields(local, remote, baseline, { arrayUnionKeys:['tags'] });
}
function mergeModifiers(localArr, remoteArr, baselineArr){
  return mergeById(localArr, remoteArr, baselineArr, mergeModifier);
}

/* ---- Top-level DB merge ---- */
function mergeDatabases(localDB, remoteDB, baselineDB){
  const tplResult = mergeTemplates(localDB.templates, remoteDB.templates, baselineDB?baselineDB.templates:null);
  const campResult = mergeCampaigns(localDB.campaigns, remoteDB.campaigns, baselineDB?baselineDB.campaigns:null);
  const pcResult = mergePlayerCharacters(localDB.playerCharacters||[], remoteDB.playerCharacters||[], baselineDB?(baselineDB.playerCharacters||[]):null);
  const modResult = mergeModifiers(localDB.modifiers||[], remoteDB.modifiers||[], baselineDB?(baselineDB.modifiers||[]):null);
  const mergedDB = {
    templates: tplResult.result,
    campaigns: campResult.result,
    playerCharacters: pcResult.result,
    modifiers: modResult.result,
    // Battle maps are a same-computer-only feature (see section 22) and were never part of the
    // sync design — carry the local copy through unchanged so a sync never silently empties it.
    maps: localDB.maps||[],
    recentGlobal: mergeRecent(localDB.recentGlobal, remoteDB.recentGlobal),
    recentGlobalPc: mergeRecent((localDB.recentGlobalPc||[]).map(r=>({templateId:r.pcId,ts:r.ts})), (remoteDB.recentGlobalPc||[]).map(r=>({templateId:r.pcId,ts:r.ts})))
      .map(r=>({pcId:r.templateId, ts:r.ts})),
    settings: localDB.settings,
    version: 1,
  };
  const conflicts = [
    ...tplResult.conflicts.map(c=>({type:'template', id:c.id, name:(c.local&&c.local.name)||(c.remote&&c.remote.name)||'Unnamed creature', local:c.local, remote:c.remote, fields:c.fields})),
    ...campResult.conflicts.map(c=>({type:'campaign', id:c.id, name:(c.local&&c.local.name)||(c.remote&&c.remote.name)||'Unnamed campaign', local:c.local, remote:c.remote, fields:c.fields})),
    ...pcResult.conflicts.map(c=>({type:'playercharacter', id:c.id, name:(c.local&&c.local.name)||(c.remote&&c.remote.name)||'Unnamed character', local:c.local, remote:c.remote, fields:c.fields})),
    ...modResult.conflicts.map(c=>({type:'modifier', id:c.id, name:(c.local&&c.local.name)||(c.remote&&c.remote.name)||'Unnamed modifier', local:c.local, remote:c.remote, fields:c.fields})),
  ];
  return {
    mergedDB, conflicts,
    stats:{
      templatesFromRemote: tplResult.stats.newFromRemote, templatesFromLocal: tplResult.stats.newFromLocal, templatesMerged: tplResult.stats.merged,
      campaignsFromRemote: campResult.stats.newFromRemote, campaignsFromLocal: campResult.stats.newFromLocal, campaignsMerged: campResult.stats.merged,
      pcsFromRemote: pcResult.stats.newFromRemote, pcsFromLocal: pcResult.stats.newFromLocal, pcsMerged: pcResult.stats.merged,
      modifiersFromRemote: modResult.stats.newFromRemote, modifiersFromLocal: modResult.stats.newFromLocal, modifiersMerged: modResult.stats.merged,
    }
  };
}

/* ===================================================================
   21. GITHUB SYNC — settings, API wrapper, orchestration, UI.
   Local-first: this entire section is optional. Nothing here runs
   unless the user explicitly connects a repository, and every
   function fails soft (falls back to "offline, local data intact")
   rather than ever blocking normal use of the app.
=================================================================== */
const SYNC_CONFIG_KEY = 'warden-sync-config';
const SYNC_BASELINE_KEY = 'warden-sync-baseline';
const SYNC_REPO_PATH = 'dnd-manager';

UI.sync = {
  status: 'not-connected', // not-connected | connected | offline | conflict | syncing
  repo: null, hasToken:false, autoSync:true, askBeforeConflicts:true,
  lastSyncedAt: null, pendingCount: 0,
  lastError: null,
};
let _syncFetchImpl = (typeof fetch!=='undefined') ? fetch.bind(window) : null;
function setSyncFetchImpl(fn){ _syncFetchImpl = fn; } // test hook

async function saveKV(key, value){
  if(UI.storageBackend==='indexeddb') return idbSet(key, value);
  if(UI.storageBackend==='localstorage'){ window.localStorage.setItem(key, JSON.stringify(value)); return true; }
  return false; // memory-only: sync config won't survive reload, acceptable degradation
}
async function loadKV(key){
  if(UI.storageBackend==='indexeddb') return idbGet(key);
  if(UI.storageBackend==='localstorage'){ const raw = window.localStorage.getItem(key); return raw?JSON.parse(raw):undefined; }
  return undefined;
}

async function loadSyncMeta(){
  try{
    const cfg = await loadKV(SYNC_CONFIG_KEY);
    if(cfg){
      UI.sync.repo = cfg.repo || null;
      UI.sync.hasToken = !!cfg.token;
      UI.sync.autoSync = cfg.autoSync !== false;
      UI.sync.askBeforeConflicts = cfg.askBeforeConflicts !== false;
      UI.sync.lastSyncedAt = cfg.lastSyncedAt || null;
      UI.sync.status = cfg.repo ? 'offline' : 'not-connected'; // verified live on first sync attempt
    }
  }catch(e){ /* no stored config yet — that's fine, sync stays disconnected */ }
  updateSyncPendingCount();
}
async function getSyncToken(){
  const cfg = await loadKV(SYNC_CONFIG_KEY);
  return cfg ? cfg.token : null;
}
async function saveSyncConfig(patch){
  const cfg = (await loadKV(SYNC_CONFIG_KEY)) || {};
  Object.assign(cfg, patch);
  await saveKV(SYNC_CONFIG_KEY, cfg);
  UI.sync.repo = cfg.repo || null;
  UI.sync.hasToken = !!cfg.token;
  UI.sync.autoSync = cfg.autoSync !== false;
  UI.sync.askBeforeConflicts = cfg.askBeforeConflicts !== false;
  UI.sync.lastSyncedAt = cfg.lastSyncedAt || null;
}
async function disconnectGithub(){
  await saveKV(SYNC_CONFIG_KEY, {repo:null, token:null, autoSync:true, askBeforeConflicts:true, lastSyncedAt:null});
  UI.sync = { status:'not-connected', repo:null, hasToken:false, autoSync:true, askBeforeConflicts:true, lastSyncedAt:null, pendingCount:0, lastError:null };
}

function countChangedSince(currentArr, baselineArr){
  const bMap = arrToMap(baselineArr||[]);
  let n=0;
  (currentArr||[]).forEach(obj=>{
    const b = bMap.get(obj.id);
    if(!b || !deepEqual(stripSyncMeta(obj), stripSyncMeta(b))) n++;
  });
  return n;
}
async function updateSyncPendingCount(){
  if(!UI.sync.repo){ UI.sync.pendingCount = 0; return; }
  const baseline = await loadKV(SYNC_BASELINE_KEY);
  if(!baseline){ UI.sync.pendingCount = DB.templates.length + DB.campaigns.length + DB.playerCharacters.length; return; }
  UI.sync.pendingCount = countChangedSince(DB.templates, baseline.templates) + countChangedSince(DB.campaigns, baseline.campaigns)
    + countChangedSince(DB.playerCharacters, baseline.playerCharacters);
}

/* ---- GitHub Contents API wrapper (minimal, uses a Personal Access Token) ---- */
function ghHeaders(token){
  return { 'Authorization': 'Bearer '+token, 'Accept':'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28' };
}
function b64EncodeUnicode(str){
  return btoa(unescape(encodeURIComponent(str)));
}
function b64DecodeUnicode(str){
  return decodeURIComponent(escape(atob(str.replace(/\n/g,''))));
}
async function ghApi(path, {method='GET', body=null, token}={}){
  if(!_syncFetchImpl) throw new Error('fetch not available in this environment');
  const res = await _syncFetchImpl(path, {
    method, headers: Object.assign(ghHeaders(token), body?{'Content-Type':'application/json'}:{}),
    body: body?JSON.stringify(body):undefined,
  });
  if(res.status===404) return {status:404, data:null};
  let data = null;
  try{ data = await res.json(); }catch(e){ /* no body */ }
  if(!res.ok) {
    const err = new Error((data&&data.message)||('GitHub API error '+res.status));
    err.status = res.status; err.data = data;
    throw err;
  }
  return {status:res.status, data};
}
function ghContentsUrl(repo, path){ return `https://api.github.com/repos/${repo}/contents/${path}`; }
async function ghGetFile(repo, path, token){
  const {status, data} = await ghApi(ghContentsUrl(repo, path), {token});
  if(status===404 || !data) return null;
  return { content: b64DecodeUnicode(data.content), sha: data.sha };
}
async function ghPutFile(repo, path, content, sha, message, token){
  return ghApi(ghContentsUrl(repo, path), {
    method:'PUT', token,
    body:{ message, content:b64EncodeUnicode(content), sha: sha||undefined },
  });
}
async function ghTestConnection(repo, token){
  await ghApi(`https://api.github.com/repos/${repo}`, {token});
  return true;
}

/* ---- Repo <-> local DB translation ---- */
function buildManifest(db){
  const objects = {};
  db.templates.forEach(t=> objects[t.id] = {type:'template', path:`${SYNC_REPO_PATH}/templates/${t.id}.json`, updatedAt:t.updatedAt, version:t.version, deviceId:t.deviceId, deletedAt:t.deletedAt||null});
  db.campaigns.forEach(c=> objects[c.id] = {type:'campaign', path:`${SYNC_REPO_PATH}/campaigns/${c.id}.json`, updatedAt:c.updatedAt, version:c.version, deviceId:c.deviceId, deletedAt:c.deletedAt||null});
  (db.playerCharacters||[]).forEach(p=> objects[p.id] = {type:'playercharacter', path:`${SYNC_REPO_PATH}/players/${p.id}.json`, updatedAt:p.updatedAt, version:p.version, deviceId:p.deviceId, deletedAt:p.deletedAt||null});
  (db.modifiers||[]).forEach(m=> objects[m.id] = {type:'modifier', path:`${SYNC_REPO_PATH}/modifiers/${m.id}.json`, updatedAt:m.updatedAt, version:m.version, deviceId:m.deviceId, deletedAt:m.deletedAt||null});
  return { version:1, updatedAt: nowISO(), deviceId:getDeviceId(), objects };
}

async function ghReadManifest(repo, token){
  const f = await ghGetFile(repo, `${SYNC_REPO_PATH}/manifest.json`, token);
  return f ? JSON.parse(f.content) : null;
}
async function ghReadFullDB(repo, token, manifest){
  const templates = [], campaigns = [], playerCharacters = [], modifiers = [];
  const entries = Object.entries(manifest.objects||{});
  for(const [id, meta] of entries){
    const f = await ghGetFile(repo, meta.path, token);
    if(!f) continue;
    const obj = JSON.parse(f.content);
    if(meta.type==='template') templates.push(obj);
    else if(meta.type==='campaign') campaigns.push(obj);
    else if(meta.type==='playercharacter') playerCharacters.push(obj);
    else if(meta.type==='modifier') modifiers.push(obj);
  }
  return { templates, campaigns, playerCharacters, modifiers, maps:[], recentGlobal:[], recentGlobalPc:[], settings:{darkMode:true}, version:1 };
}
/* Only write files whose content actually changed vs. what's already on GitHub (per old manifest), per spec section 9. */
async function ghWriteDB(repo, token, db, oldManifest){
  const oldObjects = (oldManifest && oldManifest.objects) || {};
  const newManifest = buildManifest(db);
  const writes = [];
  db.templates.forEach(t=>{
    const path = newManifest.objects[t.id].path;
    const old = oldObjects[t.id];
    if(!old || old.version!==t.version || old.updatedAt!==t.updatedAt) writes.push({path, content:JSON.stringify(t,null,2)});
  });
  db.campaigns.forEach(c=>{
    const path = newManifest.objects[c.id].path;
    const old = oldObjects[c.id];
    if(!old || old.version!==c.version || old.updatedAt!==c.updatedAt) writes.push({path, content:JSON.stringify(c,null,2)});
  });
  (db.playerCharacters||[]).forEach(p=>{
    const path = newManifest.objects[p.id].path;
    const old = oldObjects[p.id];
    if(!old || old.version!==p.version || old.updatedAt!==p.updatedAt) writes.push({path, content:JSON.stringify(p,null,2)});
  });
  (db.modifiers||[]).forEach(m=>{
    const path = newManifest.objects[m.id].path;
    const old = oldObjects[m.id];
    if(!old || old.version!==m.version || old.updatedAt!==m.updatedAt) writes.push({path, content:JSON.stringify(m,null,2)});
  });
  for(const w of writes){
    const existing = await ghGetFile(repo, w.path, token);
    await ghPutFile(repo, w.path, w.content, existing?existing.sha:null, 'Warden sync: update '+w.path, token);
  }
  const manifestExisting = await ghGetFile(repo, `${SYNC_REPO_PATH}/manifest.json`, token);
  await ghPutFile(repo, `${SYNC_REPO_PATH}/manifest.json`, JSON.stringify(newManifest,null,2), manifestExisting?manifestExisting.sha:null, 'Warden sync: update manifest', token);
  const readmeExisting = await ghGetFile(repo, `${SYNC_REPO_PATH}/README.md`, token);
  if(!readmeExisting){
    await ghPutFile(repo, `${SYNC_REPO_PATH}/README.md`,
      '# D&D Manager Sync Data\n\nThis folder is synchronized by the Warden app (https://github.com — local-first D&D creature & combat manager).\n\n- `manifest.json` — index of every synced object with version metadata.\n- `templates/` — one JSON file per creature template.\n- `players/` — one JSON file per player character.\n- `campaigns/` — one JSON file per campaign (encounters are nested inside).\n\nDo not edit these files by hand while sync is active — your local app is always the primary copy; this repo is a sync target, not the source of truth.\n',
      null, 'Warden sync: initialize README', token);
  }
  return { writeCount: writes.length, manifest: newManifest };
}

/* ---- Safety snapshots (section 27) ---- */
async function takeSafetySnapshot(label){
  if(UI.storageBackend!=='indexeddb') return; // localStorage/memory backends skip snapshots (space-constrained)
  try{
    const snaps = await idbListSnapshots();
    const snap = {id:uid('snap'), timestamp:nowISO(), label:label||'Before sync', data:DB};
    await idbAddSnapshot(snap);
    const all = (await idbListSnapshots()).sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp));
    for(const old of all.slice(5)) await idbDeleteSnapshot(old.id);
  }catch(e){ /* snapshotting is best-effort safety, never block sync on it */ }
}
async function restoreSnapshot(id){
  const snaps = await idbListSnapshots();
  const snap = snaps.find(s=>s.id===id);
  if(!snap) return;
  openConfirmModal({
    title:'Restore this snapshot?', danger:true,
    body:`This replaces your current data with the snapshot from ${new Date(snap.timestamp).toLocaleString()}. Your current data will itself be snapshotted first, so this is reversible.`,
    confirmLabel:'Restore',
    onConfirm: async ()=>{
      await takeSafetySnapshot('Before restoring an older snapshot');
      DB = snap.data;
      scheduleSave();
      toast('Snapshot restored');
      render();
    }
  });
}
window.restoreSnapshot = restoreSnapshot;

/* ---- Orchestration ---- */
let SYNC_PREVIEW = null; // {situation, localCounts, remoteCounts, mergedDB, conflicts, oldManifest, resolved:{}}
let SYNC_BUSY = false;

async function checkGithubReachable(repo, token){
  try{ await ghTestConnection(repo, token); return true; }
  catch(e){ return false; }
}

async function connectGithubFlow(repoInput, tokenInput){
  const repo = repoInput.trim().replace(/^https?:\/\/github\.com\//,'').replace(/\/$/,'');
  const token = tokenInput.trim();
  if(!repo || !repo.includes('/')){ toast('Enter a repository as owner/repo, e.g. alex/dnd-data', true); return; }
  if(!token){ toast('Enter a Personal Access Token.', true); return; }

  pushModal({ key:'sync-connecting', noClickAway:true, render(){
    return `<div class="modal-head"><h2>Connecting…</h2></div><div class="modal-body"><p class="muted small">Checking access to ${esc(repo)}…</p></div>`;
  }});
  renderModals();

  let reachable;
  try{ reachable = await checkGithubReachable(repo, token); }catch(e){ reachable=false; }
  if(!reachable){
    popModal();
    openConfirmModal({ title:'Could not connect', body:`Couldn't reach or authenticate to "${esc(repo)}". Double check the repository name and that your token has "Contents: Read and write" access to it, then try again.`, confirmLabel:'OK', onConfirm:()=>{} });
    return;
  }
  await saveSyncConfig({repo, token});
  popModal();
  await runFirstTimeSyncWizard(repo, token);
}
window.connectGithubFlow = connectGithubFlow;

async function runFirstTimeSyncWizard(repo, token){
  let manifest;
  try{ manifest = await ghReadManifest(repo, token); }
  catch(e){ toast('Could not read repository contents: '+e.message, true); return; }

  const localHasData = DB.templates.length>0 || DB.campaigns.length>0 || DB.playerCharacters.length>0 || (DB.modifiers||[]).length>0;

  if(!manifest){
    // Situation A — empty repository
    openConfirmModal({
      title:'No existing data found in this repository',
      body:`Upload your current local data (${activeTemplates().length} creature${activeTemplates().length===1?'':'s'}, ${activePlayerCharacters().length} player character${activePlayerCharacters().length===1?'':'s'}, ${activeCampaigns().length} campaign${activeCampaigns().length===1?'':'s'}) to start syncing?`,
      confirmLabel:'Upload Local Data',
      onConfirm: async ()=>{
        await takeSafetySnapshot('Before first GitHub upload');
        const {manifest:newManifest} = await ghWriteDB(repo, token, DB, null);
        await saveKV(SYNC_BASELINE_KEY, deepClone(DB));
        await saveSyncConfig({lastSyncedAt: nowISO()});
        UI.sync.status='connected'; UI.sync.pendingCount=0;
        toast('Uploaded — GitHub sync is now active');
        render();
      }
    });
    return;
  }

  if(!localHasData){
    // Situation B — existing GitHub data, empty local database
    const remoteDB = await ghReadFullDB(repo, token, manifest);
    openConfirmModal({
      title:'Existing D&D Manager data was found in this GitHub repository',
      body:`This repository has ${remoteDB.templates.length} creature(s), ${(remoteDB.playerCharacters||[]).length} player character(s), and ${remoteDB.campaigns.length} campaign(s). Download and use this as your local data?`,
      confirmLabel:'Download and Sync',
      onConfirm: async ()=>{
        await takeSafetySnapshot('Before downloading GitHub data');
        DB.templates = remoteDB.templates; DB.campaigns = remoteDB.campaigns; DB.playerCharacters = remoteDB.playerCharacters||[]; DB.modifiers = remoteDB.modifiers||[];
        await saveKV(SYNC_BASELINE_KEY, deepClone(DB));
        await saveSyncConfig({lastSyncedAt: nowISO()});
        scheduleSave();
        UI.sync.status='connected'; UI.sync.pendingCount=0;
        toast('Downloaded from GitHub');
        render();
      }
    });
    return;
  }

  // Situation C — data exists on both sides. Full merge + preview.
  await openSyncPreview(repo, token, manifest, {isFirstConnection:true});
}

/* Build a merge preview (used for both first connection and every subsequent manual/auto sync) */
async function openSyncPreview(repo, token, manifest, opts){
  opts = opts||{};
  let remoteDB;
  try{ remoteDB = await ghReadFullDB(repo, token, manifest); }
  catch(e){ toast('Could not read repository data: '+e.message, true); return; }
  const baseline = await loadKV(SYNC_BASELINE_KEY);
  const {mergedDB, conflicts, stats} = mergeDatabases(DB, remoteDB, baseline||null);

  SYNC_PREVIEW = { repo, token, manifest, remoteDB, mergedDB, conflicts, stats, resolved:{}, isFirstConnection:!!opts.isFirstConnection };
  pushModal({ key:'sync-preview', size:'lg', noClickAway:true, render: renderSyncPreviewModal });
}

function renderSyncPreviewModal(){
  const p = SYNC_PREVIEW;
  const unresolvedConflicts = p.conflicts.filter(c=>!p.resolved[conflictKey(c)]);
  return `
    <div class="modal-head"><h2>Sync Preview</h2>${p.isFirstConnection?'':'<button class="modal-close" onclick="cancelSyncPreview()">&times;</button>'}</div>
    <div class="modal-body">
      <p class="muted small mb10">${p.isFirstConnection ? 'Existing data was found both locally and in the GitHub repository. Nothing has been changed yet — review what will happen below.' : "Here's what will change."}</p>
      <div class="grid-2col">
        <div class="card">
          <div class="section-title">From GitHub</div>
          <p class="small">+${p.stats.templatesFromRemote} new creature${p.stats.templatesFromRemote===1?'':'s'}<br>+${p.stats.pcsFromRemote} new player character${p.stats.pcsFromRemote===1?'':'s'}<br>+${p.stats.campaignsFromRemote} new campaign${p.stats.campaignsFromRemote===1?'':'s'}</p>
        </div>
        <div class="card">
          <div class="section-title">From This Computer</div>
          <p class="small">+${p.stats.templatesFromLocal} new creature${p.stats.templatesFromLocal===1?'':'s'}<br>+${p.stats.pcsFromLocal} new player character${p.stats.pcsFromLocal===1?'':'s'}<br>+${p.stats.campaignsFromLocal} new campaign${p.stats.campaignsFromLocal===1?'':'s'}</p>
        </div>
      </div>
      <p class="small muted mt10">${p.stats.templatesMerged+p.stats.campaignsMerged+p.stats.pcsMerged} item(s) changed on both sides and were merged field-by-field.</p>
      ${p.conflicts.length ? `
        <div class="hr"></div>
        <div class="section-title" style="color:var(--blood-bright);">&#9888; ${unresolvedConflicts.length} of ${p.conflicts.length} conflict(s) need your input</div>
        ${p.conflicts.map(c=>conflictRowHTML(c)).join('')}
      ` : `<div class="hr"></div><p class="small" style="color:var(--good);">&#10003; No conflicts — everything can merge automatically.</p>`}
    </div>
    <div class="modal-foot">
      ${p.isFirstConnection?'':'<button class="btn" onclick="cancelSyncPreview()">Cancel</button>'}
      <button class="btn btn-primary" ${unresolvedConflicts.length?'disabled':''} onclick="applySyncPreview()">
        ${p.conflicts.length ? 'Apply Sync (all conflicts resolved)' : 'Sync Now'}
      </button>
    </div>`;
}
function conflictKey(c){ return c.type+':'+c.id; }
function conflictRowHTML(c){
  const key = conflictKey(c);
  const resolved = SYNC_PREVIEW.resolved[key];
  return `
    <div class="entry-row">
      <div class="entry-name">${esc(c.name)} <i>(${c.type==='playercharacter'?'player character':c.type})</i></div>
      ${c.fields.map(f=>`
        <div class="small mt6">
          <b>${esc(String(f.field))}</b> —
          <span class="faint">This computer:</span> ${esc(JSON.stringify(f.local))}
          &nbsp;|&nbsp; <span class="faint">GitHub:</span> ${esc(JSON.stringify(f.remote))}
        </div>`).join('')}
      <div class="btn-row mt6">
        <button class="btn btn-xs ${resolved==='local'?'btn-gold':''}" onclick="resolveConflict('${key}','local')">Keep This Computer's</button>
        <button class="btn btn-xs ${resolved==='remote'?'btn-gold':''}" onclick="resolveConflict('${key}','remote')">Keep GitHub's</button>
        <button class="btn btn-xs ${resolved==='both'?'btn-gold':''}" onclick="resolveConflict('${key}','both')">Keep Both (duplicate)</button>
      </div>
    </div>`;
}
function resolveConflict(key, choice){
  SYNC_PREVIEW.resolved[key] = choice;
  renderModals();
}
window.resolveConflict = resolveConflict;
function cancelSyncPreview(){ SYNC_PREVIEW = null; popModal(); }
window.cancelSyncPreview = cancelSyncPreview;

async function applySyncPreview(){
  const p = SYNC_PREVIEW;
  let mergedDB = deepClone(p.mergedDB);

  // Apply user-resolved conflicts on top of the auto-merged (locally-favoured) result.
  p.conflicts.forEach(c=>{
    const key = conflictKey(c);
    const choice = p.resolved[key];
    const arr = c.type==='template' ? mergedDB.templates : c.type==='playercharacter' ? mergedDB.playerCharacters : c.type==='modifier' ? mergedDB.modifiers : mergedDB.campaigns;
    const idx = arr.findIndex(o=>o.id===c.id);
    if(choice==='remote'){
      if(idx>=0) arr[idx] = deepClone(c.remote);
    } else if(choice==='both'){
      const dup = deepClone(c.remote);
      dup.id = uid(c.type==='template'?'cr':c.type==='playercharacter'?'pc':c.type==='modifier'?'mod':'camp');
      dup.name = (dup.name||'Untitled') + ' (from GitHub)';
      stampSync(dup);
      arr.push(dup);
      // idx (local version) stays as-is — both versions now exist independently.
    }
    // choice==='local' needs no change — mergedDB already defaults conflicted fields to local.
  });

  SYNC_BUSY = true;
  popModal();
  toast('Syncing…');
  try{
    await takeSafetySnapshot('Before applying sync');
    mergedDB.settings = DB.settings; // local-only setting, never synced
    DB = mergedDB;
    const {manifest:newManifest} = await ghWriteDB(p.repo, p.token, DB, p.manifest);
    await saveKV(SYNC_BASELINE_KEY, deepClone(DB));
    await saveSyncConfig({lastSyncedAt: nowISO()});
    scheduleSave();
    UI.sync.status = 'connected';
    UI.sync.pendingCount = 0;
    toast('Sync complete');
  }catch(e){
    UI.sync.status = 'offline';
    UI.sync.lastError = e.message;
    toast('Sync failed: '+e.message, true);
  }
  SYNC_BUSY = false;
  SYNC_PREVIEW = null;
  render();
}
window.applySyncPreview = applySyncPreview;

/* Manual "Sync Now" entry point (Settings page) */
async function syncNow(silent){
  if(!UI.sync.repo){ if(!silent) toast('Connect GitHub first, in Settings.', true); return; }
  if(SYNC_BUSY) return;
  const token = await getSyncToken();
  if(!token){ if(!silent) toast('No token stored — reconnect GitHub.', true); return; }

  const reachable = await checkGithubReachable(UI.sync.repo, token);
  if(!reachable){
    UI.sync.status = 'offline';
    if(!silent) toast('GitHub is unreachable right now — your changes are safe locally.', true);
    render();
    return;
  }
  let manifest;
  try{ manifest = await ghReadManifest(UI.sync.repo, token); }
  catch(e){ UI.sync.status='offline'; if(!silent) toast('Could not read repository: '+e.message, true); render(); return; }

  if(!manifest){
    if(silent){ /* don't silently push a brand-new repo structure without asking once */ return; }
    await runFirstTimeSyncWizard(UI.sync.repo, token);
    return;
  }

  await openSyncPreview(UI.sync.repo, token, manifest, {isFirstConnection:false});
  // In silent/background mode, auto-apply only when there are zero conflicts — never interrupt, never guess.
  if(silent && SYNC_PREVIEW && SYNC_PREVIEW.conflicts.length===0){
    await applySyncPreview();
  } else if(silent && SYNC_PREVIEW && SYNC_PREVIEW.conflicts.length>0){
    // Leave it queued for the user rather than blocking them mid-session.
    UI.sync.status = 'conflict';
    SYNC_PREVIEW = null;
    popModal();
    render();
  }
}
window.syncNow = syncNow;

/* Background/auto sync: on reconnect + periodic check, never during active combat editing. */
function scheduleAutoSyncChecks(){
  window.addEventListener('online', ()=>{ if(UI.sync.autoSync) syncNow(true); });
  const t = setInterval(()=>{
    if(UI.sync.autoSync && UI.sync.repo && VIEW.name!=='combat' && !SYNC_BUSY && UI.modalStack.length===0){
      syncNow(true);
    }
  }, 3*60*1000);
  if(t && typeof t.unref==='function') t.unref(); // don't keep a Node test/CLI process alive; no-op in real browsers
}

/* ===================================================================
   22. BATTLE MAP — data model, CRUD, image handling.
   Maps follow the same template/instance split as creatures:
   a Map (library) is reusable; attaching one to an encounter makes
   an independent MapInstance so fog/tokens never bleed between
   encounters or overwrite the library original.
=================================================================== */
function blankMap(){
  return {
    id: uid('map'), name:'New Map', description:'',
    imageDataUrl:null, imageWidth:null, imageHeight:null,
    gridSize:50, gridOffsetX:0, gridOffsetY:0, gridVisible:true, gridColor:'rgba(255,255,255,0.35)',
    layers:[ {id:uid('layer'), name:'Tokens', visible:true, locked:false} ],
    tags:[],
    createdAt: nowISO(), updatedAt: nowISO(), deviceId:getDeviceId(), version:0, deletedAt:null,
  };
}
function blankMapInstance(sourceMap){
  return {
    id: uid('mapinst'), sourceMapId: sourceMap.id, name: sourceMap.name,
    imageDataUrl: sourceMap.imageDataUrl, imageWidth: sourceMap.imageWidth, imageHeight: sourceMap.imageHeight,
    gridSize: sourceMap.gridSize, gridOffsetX: sourceMap.gridOffsetX, gridOffsetY: sourceMap.gridOffsetY,
    gridVisible: sourceMap.gridVisible, gridColor: sourceMap.gridColor,
    layers: deepClone(sourceMap.layers),
    tokens: [],
    fogEnabled:false, revealedCells:[],
    panX:0, panY:0, zoom:1,
    createdAt: nowISO(), updatedAt: nowISO(), deviceId:getDeviceId(), version:0, deletedAt:null,
  };
}
function blankToken(layerId){
  return {
    id: uid('tok'), layerId, x:100, y:100, w:50, h:50, rotation:0,
    shape:'circle', color:'#b1402f', imageDataUrl:null, label:'',
    linkedParticipantId:null, hiddenFromPlayers:false, visibleToPlayers:true, showLabelToPlayers:false,
  };
}

/* ---- Image resize utility (keeps stored maps/tokens reasonably sized) ---- */
function fileToResizedDataUrl(file, maxDim){
  maxDim = maxDim || 1800;
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = ()=>reject(new Error('Could not read that file.'));
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=>reject(new Error('Could not decode that image.'));
      img.onload = ()=>{
        let {width, height} = img;
        if(width>maxDim || height>maxDim){
          const scale = maxDim/Math.max(width,height);
          width = Math.round(width*scale); height = Math.round(height*scale);
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        let dataUrl;
        try{ dataUrl = canvas.toDataURL('image/jpeg', 0.85); }
        catch(e){ dataUrl = canvas.toDataURL(); }
        resolve({dataUrl, width, height});
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

/* ---- Map library CRUD ---- */
function activeMaps(){ return DB.maps.filter(m=>!m.deletedAt); }
function getMap(id){ return DB.maps.find(m=>m.id===id && !m.deletedAt); }
function getMapAny(id){ return DB.maps.find(m=>m.id===id); }
function saveMap(map){
  stampSync(map);
  const i = DB.maps.findIndex(m=>m.id===map.id);
  if(i>=0) DB.maps[i]=map; else DB.maps.push(map);
  scheduleSave();
}
function deleteMap(id){
  const m = getMapAny(id); if(!m) return;
  m.deletedAt = nowISO(); stampSync(m); scheduleSave();
}
function duplicateMap(id){
  const src = getMap(id); if(!src) return null;
  const copy = deepClone(src);
  copy.id = uid('map'); copy.name = src.name+' (Copy)';
  copy.createdAt = nowISO(); copy.deletedAt = null; copy.version = 0;
  stampSync(copy);
  DB.maps.push(copy);
  scheduleSave();
  return copy;
}

/* ---- Attaching a map to an encounter (creates an independent instance) ---- */
function attachMapToEncounter(campId, encId, mapId){
  const enc = getEncounter(campId, encId);
  const src = getMap(mapId);
  if(!enc || !src) return;
  enc.map = blankMapInstance(src);
  stampSync(enc.map);
  persistEncounter(campId, encId);
}
function detachMapFromEncounter(campId, encId){
  const enc = getEncounter(campId, encId);
  if(!enc) return;
  enc.map = null;
  persistEncounter(campId, encId);
}
function withMap(campId, encId, fn){
  const enc = getEncounter(campId, encId);
  if(!enc || !enc.map) return;
  fn(enc.map);
  stampSync(enc.map);
  persistEncounter(campId, encId);
}
window.withMap = withMap;
window.attachMapToEncounter = attachMapToEncounter;
window.detachMapFromEncounter = detachMapFromEncounter;

/* ===================================================================
   23. MAP — pure logic (fog cells, token ops, player sanitization).
   sanitizeMapForPlayers() is the single privacy boundary between the
   DM's map state and anything sent to a projector/second display.
   Kept as a pure function so it's directly unit-testable.
=================================================================== */
function cellKey(col,row){ return col+','+row; }
function gridDims(map){
  if(!map || !map.imageWidth || !map.imageHeight || !map.gridSize) return {cols:0, rows:0};
  return { cols: Math.ceil(map.imageWidth/map.gridSize), rows: Math.ceil(map.imageHeight/map.gridSize) };
}
function isCellRevealed(mapInstance, col, row){
  if(!mapInstance.fogEnabled) return true;
  return (mapInstance.revealedCells||[]).includes(cellKey(col,row));
}
function toggleCell(mapInstance, col, row, forceState){
  mapInstance.revealedCells = mapInstance.revealedCells || [];
  const key = cellKey(col,row);
  const has = mapInstance.revealedCells.includes(key);
  const reveal = forceState!==undefined ? forceState : !has;
  if(reveal && !has) mapInstance.revealedCells.push(key);
  if(!reveal && has) mapInstance.revealedCells = mapInstance.revealedCells.filter(k=>k!==key);
}
function revealAllCells(mapInstance){
  const {cols, rows} = gridDims(mapInstance);
  const all = [];
  for(let c=0;c<cols;c++) for(let r=0;r<rows;r++) all.push(cellKey(c,r));
  mapInstance.revealedCells = all;
}
function hideAllCells(mapInstance){ mapInstance.revealedCells = []; }

/* ---- Token ops (operate on a mapInstance, called via withMap) ---- */
function addTokenToMap(mapInstance, opts){
  opts = opts||{};
  const layerId = opts.layerId || (mapInstance.layers[0] && mapInstance.layers[0].id);
  const tok = blankToken(layerId);
  Object.assign(tok, opts);
  mapInstance.tokens.push(tok);
  return tok;
}
function updateToken(mapInstance, tokenId, patch){
  const t = mapInstance.tokens.find(t=>t.id===tokenId);
  if(t) Object.assign(t, patch);
}
function removeToken(mapInstance, tokenId){
  mapInstance.tokens = mapInstance.tokens.filter(t=>t.id!==tokenId);
}
function linkTokenToParticipant(mapInstance, tokenId, participant){
  updateToken(mapInstance, tokenId, { linkedParticipantId: participant.id, label: participant.name });
}

/* ---- THE PRIVACY BOUNDARY ----
   Returns ONLY what a player-facing display is allowed to see. Never
   include: HP/AC/conditions/inventory/notes, linkedParticipantId,
   layer lock/edit state, hidden tokens, or tokens marked not
   visible-to-players. This is the one function every player-display
   code path must go through — nothing bypasses it. */
function sanitizeMapForPlayers(mapInstance){
  if(!mapInstance) return null;
  const visibleTokens = (mapInstance.tokens||[])
    .filter(t=> !t.hiddenFromPlayers && t.visibleToPlayers)
    .map(t=>({
      id:t.id, x:t.x, y:t.y, w:t.w, h:t.h, rotation:t.rotation||0,
      shape:t.shape, color:t.color, imageDataUrl:t.imageDataUrl||null,
      label: t.showLabelToPlayers ? (t.label||'') : '',
    }));
  const out = {
    imageDataUrl: mapInstance.imageDataUrl, imageWidth: mapInstance.imageWidth, imageHeight: mapInstance.imageHeight,
    gridSize: mapInstance.gridSize, gridOffsetX: mapInstance.gridOffsetX, gridOffsetY: mapInstance.gridOffsetY,
    gridVisible: mapInstance.gridVisible, gridColor: mapInstance.gridColor,
    fogEnabled: !!mapInstance.fogEnabled,
    tokens: visibleTokens,
  };
  if(out.fogEnabled) out.revealedCells = (mapInstance.revealedCells||[]).slice();
  return out;
}

/* ===================================================================
   24. MAP CANVAS ENGINE — turns a (sanitized or full) map state into
   pixels. Shared by both the DM's interactive canvas and the
   player display's read-only canvas, so the two can never visually
   drift apart. Guards every ctx call so it never throws in an
   environment without canvas support.
=================================================================== */
const _mapImageCache = new Map(); // dataUrl -> HTMLImageElement, avoids re-decoding every frame
function getCachedImage(dataUrl){
  if(!dataUrl) return null;
  if(_mapImageCache.has(dataUrl)) return _mapImageCache.get(dataUrl);
  const img = new Image();
  img.src = dataUrl;
  _mapImageCache.set(dataUrl, img);
  return img;
}

function drawMapToCanvas(canvas, state, opts){
  if(!canvas) return;
  const ctx = canvas.getContext && canvas.getContext('2d');
  if(!ctx) return;
  opts = opts||{};
  const pan = opts.pan || {x:0,y:0};
  const zoom = opts.zoom || 1;
  const selectedTokenId = opts.selectedTokenId || null;
  const dmMode = !!opts.dmMode; // draws hidden/DM-only tokens dimmed, shows link icons — never used for the player window

  ctx.save();
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle = '#0a0906';
  ctx.fillRect(0,0,canvas.width,canvas.height);

  if(!state || !state.imageDataUrl){
    ctx.fillStyle = '#766b53';
    ctx.font = '16px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(opts.emptyMessage || 'No map loaded', canvas.width/2, canvas.height/2);
    ctx.restore();
    return;
  }

  ctx.translate(pan.x, pan.y);
  ctx.scale(zoom, zoom);

  const img = getCachedImage(state.imageDataUrl);
  if(img && img.complete && img.naturalWidth) ctx.drawImage(img, 0, 0, state.imageWidth, state.imageHeight);
  else { ctx.fillStyle = '#2a251b'; ctx.fillRect(0,0,state.imageWidth||800, state.imageHeight||600); }

  // Grid
  if(state.gridVisible && state.gridSize){
    ctx.strokeStyle = state.gridColor || 'rgba(255,255,255,0.3)';
    ctx.lineWidth = 1/zoom;
    for(let x=state.gridOffsetX; x<=state.imageWidth; x+=state.gridSize){
      ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,state.imageHeight); ctx.stroke();
    }
    for(let y=state.gridOffsetY; y<=state.imageHeight; y+=state.gridSize){
      ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(state.imageWidth,y); ctx.stroke();
    }
  }

  // Tokens (draw non-hidden first in DM mode order stays insertion order; simple approach)
  (state.tokens||[]).forEach(t=>{
    const dmOnly = dmMode && (t.hiddenFromPlayers || !t.visibleToPlayers);
    ctx.save();
    ctx.translate(t.x + t.w/2, t.y + t.h/2);
    ctx.rotate((t.rotation||0) * Math.PI/180);
    if(dmOnly) ctx.globalAlpha = 0.45;
    const timg = t.imageDataUrl ? getCachedImage(t.imageDataUrl) : null;
    if(timg && timg.complete && timg.naturalWidth){
      ctx.save();
      if(t.shape==='circle'){ ctx.beginPath(); ctx.arc(0,0,t.w/2,0,Math.PI*2); ctx.clip(); }
      ctx.drawImage(timg, -t.w/2, -t.h/2, t.w, t.h);
      ctx.restore();
    } else {
      ctx.fillStyle = t.color || '#b1402f';
      if(t.shape==='circle'){ ctx.beginPath(); ctx.arc(0,0,t.w/2,0,Math.PI*2); ctx.fill(); }
      else { ctx.fillRect(-t.w/2,-t.h/2,t.w,t.h); }
    }
    if(t.id===selectedTokenId){
      ctx.strokeStyle = '#c9a227'; ctx.lineWidth = 3/zoom;
      if(t.shape==='circle'){ ctx.beginPath(); ctx.arc(0,0,t.w/2+2,0,Math.PI*2); ctx.stroke(); }
      else ctx.strokeRect(-t.w/2-2,-t.h/2-2,t.w+4,t.h+4);
    }
    ctx.restore();
    if((dmMode || t.showLabelToPlayers) && t.label){
      ctx.save();
      ctx.globalAlpha = 1;
      ctx.fillStyle = '#fff'; ctx.font = (12/zoom)+'px sans-serif'; ctx.textAlign='center';
      ctx.fillText(t.label, t.x+t.w/2, t.y+t.h+ (12/zoom));
      ctx.restore();
    }
  });

  // Fog of war (drawn last, on top)
  if(state.fogEnabled && state.gridSize){
    const {cols, rows} = gridDims(state);
    const revealed = new Set(state.revealedCells||[]);
    ctx.fillStyle = 'rgba(5,4,2,0.94)';
    for(let c=0;c<cols;c++){
      for(let r=0;r<rows;r++){
        if(!revealed.has(cellKey(c,r))){
          ctx.fillRect(state.gridOffsetX + c*state.gridSize, state.gridOffsetY + r*state.gridSize, state.gridSize, state.gridSize);
        }
      }
    }
  }

  ctx.restore();
}

/* Convert a canvas-relative mouse/touch point into map (image) coordinates, honoring pan/zoom. */
function canvasPointToMapCoords(px, py, pan, zoom){
  return { x: (px - pan.x)/zoom, y: (py - pan.y)/zoom };
}

/* ---- Canvas mount + interaction (called from render() when Battle Map is open) ---- */
function mountBattleMapCanvas(campId, encId){
  const canvas = document.getElementById('battlemap-canvas');
  if(!canvas) return;
  const enc = getEncounter(campId, encId);
  if(!enc || !enc.map) return;
  MAPCTRL.campId = campId; MAPCTRL.encId = encId;

  const rect = canvas.getBoundingClientRect();
  canvas.width = Math.max(1, Math.round(rect.width));
  canvas.height = Math.max(1, Math.round(rect.height));

  redrawMapCanvas();

  canvas.onwheel = (e)=>{
    e.preventDefault();
    const factor = e.deltaY<0 ? 1.1 : 0.9;
    MAPCTRL.zoom = clamp(MAPCTRL.zoom*factor, 0.2, 4);
    redrawMapCanvas();
  };
  canvas.onmousedown = (e)=> handleMapPointerDown(e, canvas);
  canvas.onmousemove = (e)=> handleMapPointerMove(e, canvas);
  window.onmouseup = (e)=> handleMapPointerUp(e);
  canvas.ontouchstart = (e)=>{ if(e.touches[0]) handleMapPointerDown(e.touches[0], canvas); };
  canvas.ontouchmove = (e)=>{ e.preventDefault(); if(e.touches[0]) handleMapPointerMove(e.touches[0], canvas); };
  canvas.ontouchend = (e)=> handleMapPointerUp(e);
}
function redrawMapCanvas(){
  const canvas = document.getElementById('battlemap-canvas');
  if(!canvas || !MAPCTRL.campId) return;
  const enc = getEncounter(MAPCTRL.campId, MAPCTRL.encId);
  if(!enc || !enc.map) return;
  const highlightId = MAPCTRL.selectedTokenId || currentTurnTokenId(enc);
  drawMapToCanvas(canvas, enc.map, { pan:MAPCTRL.pan, zoom:MAPCTRL.zoom, selectedTokenId:highlightId, dmMode:true });
  broadcastPlayerDisplayState(MAPCTRL.campId, MAPCTRL.encId);
}
function hitTestToken(map, mapPt){
  for(let i=map.tokens.length-1;i>=0;i--){
    const t = map.tokens[i];
    const dx = mapPt.x-(t.x+t.w/2), dy = mapPt.y-(t.y+t.h/2);
    if(t.shape==='circle'){ if(Math.sqrt(dx*dx+dy*dy) <= t.w/2) return t; }
    else { if(mapPt.x>=t.x && mapPt.x<=t.x+t.w && mapPt.y>=t.y && mapPt.y<=t.y+t.h) return t; }
  }
  return null;
}
function handleMapPointerDown(e, canvas){
  const rect = canvas.getBoundingClientRect();
  const px = e.clientX-rect.left, py = e.clientY-rect.top;
  const enc = getEncounter(MAPCTRL.campId, MAPCTRL.encId);
  if(!enc || !enc.map) return;
  const mapPt = canvasPointToMapCoords(px, py, MAPCTRL.pan, MAPCTRL.zoom);

  if(MAPCTRL.tool==='pan'){
    MAPCTRL.isPanning = true; MAPCTRL.panStart = {x:px,y:py}; MAPCTRL.panOrigin = {...MAPCTRL.pan};
    return;
  }
  if(MAPCTRL.tool==='fog-reveal' || MAPCTRL.tool==='fog-hide'){
    const col = Math.floor((mapPt.x-enc.map.gridOffsetX)/enc.map.gridSize);
    const row = Math.floor((mapPt.y-enc.map.gridOffsetY)/enc.map.gridSize);
    MAPCTRL.fogPainting = true; MAPCTRL.fogPaintValue = MAPCTRL.tool==='fog-reveal';
    toggleCell(enc.map, col, row, MAPCTRL.fogPaintValue);
    redrawMapCanvas();
    return;
  }
  // select tool
  const hit = hitTestToken(enc.map, mapPt);
  if(hit){
    MAPCTRL.dragTokenId = hit.id; MAPCTRL.selectedTokenId = hit.id;
    MAPCTRL.dragOffset = { x: mapPt.x-hit.x, y: mapPt.y-hit.y };
  } else {
    MAPCTRL.isPanning = true; MAPCTRL.panStart = {x:px,y:py}; MAPCTRL.panOrigin = {...MAPCTRL.pan};
    if(MAPCTRL.selectedTokenId){ MAPCTRL.selectedTokenId = null; render(); return; }
  }
  redrawMapCanvas();
}
function handleMapPointerMove(e, canvas){
  const rect = canvas.getBoundingClientRect();
  const px = e.clientX-rect.left, py = e.clientY-rect.top;
  const enc = getEncounter(MAPCTRL.campId, MAPCTRL.encId);
  if(!enc || !enc.map) return;

  if(MAPCTRL.isPanning && MAPCTRL.panStart){
    MAPCTRL.pan = { x: MAPCTRL.panOrigin.x + (px-MAPCTRL.panStart.x), y: MAPCTRL.panOrigin.y + (py-MAPCTRL.panStart.y) };
    redrawMapCanvas();
    return;
  }
  if(MAPCTRL.fogPainting){
    const mapPt = canvasPointToMapCoords(px, py, MAPCTRL.pan, MAPCTRL.zoom);
    const col = Math.floor((mapPt.x-enc.map.gridOffsetX)/enc.map.gridSize);
    const row = Math.floor((mapPt.y-enc.map.gridOffsetY)/enc.map.gridSize);
    toggleCell(enc.map, col, row, MAPCTRL.fogPaintValue);
    redrawMapCanvas();
    return;
  }
  if(MAPCTRL.dragTokenId){
    const mapPt = canvasPointToMapCoords(px, py, MAPCTRL.pan, MAPCTRL.zoom);
    const t = enc.map.tokens.find(t=>t.id===MAPCTRL.dragTokenId);
    if(t){
      let nx = mapPt.x-MAPCTRL.dragOffset.x, ny = mapPt.y-MAPCTRL.dragOffset.y;
      if(MAPCTRL.snapToGrid){
        nx = Math.round(nx/enc.map.gridSize)*enc.map.gridSize;
        ny = Math.round(ny/enc.map.gridSize)*enc.map.gridSize;
      }
      t.x = nx; t.y = ny;
      redrawMapCanvas();
    }
  }
}
function handleMapPointerUp(){
  const wasDragging = MAPCTRL.dragTokenId || MAPCTRL.fogPainting;
  MAPCTRL.isPanning = false; MAPCTRL.panStart = null;
  if(MAPCTRL.dragTokenId){
    const enc = getEncounter(MAPCTRL.campId, MAPCTRL.encId);
    if(enc && enc.map) stampSync(enc.map);
    persistEncounter(MAPCTRL.campId, MAPCTRL.encId);
  }
  if(MAPCTRL.fogPainting){
    const enc = getEncounter(MAPCTRL.campId, MAPCTRL.encId);
    if(enc && enc.map) stampSync(enc.map);
    persistEncounter(MAPCTRL.campId, MAPCTRL.encId);
  }
  MAPCTRL.dragTokenId = null; MAPCTRL.fogPainting = false;
  if(wasDragging) render(); // sync token panel / sync status without losing scroll excessively often
}

/* ===================================================================
   26. PLAYER DISPLAY — same-computer second window/projector mode.
   Uses BroadcastChannel: pure same-browser, same-origin messaging,
   zero network involved, works fully offline. This is Mode A only
   (same computer) — a genuinely separate second Windows computer
   would need a server/relay this static file can't provide; that is
   intentionally out of scope here (see chat).
=================================================================== */
let PLAYER_WINDOW_REF = null;
let PLAYER_CHANNEL = null;
UI.playerDisplay = { open:false, lastPong:null, campId:null, encId:null };

function playerChannelName(){ return 'warden-playerlink-'+getDeviceId(); }
function getPlayerChannel(){
  if(!PLAYER_CHANNEL && typeof BroadcastChannel!=='undefined'){
    PLAYER_CHANNEL = new BroadcastChannel(playerChannelName());
    PLAYER_CHANNEL.onmessage = (ev)=>{
      const msg = ev.data;
      if(msg && msg.type==='pong'){ UI.playerDisplay.lastPong = Date.now(); UI.playerDisplay.open = true; renderPlayerStatusInline(); }
      if(msg && msg.type==='closing'){ UI.playerDisplay.open = false; render(); }
    };
  }
  return PLAYER_CHANNEL;
}
function playerDisplayStatusForThisEncounter(campId, encId){
  const pd = UI.playerDisplay;
  const stale = pd.lastPong && (Date.now()-pd.lastPong > 6000);
  const open = pd.open && !stale && pd.campId===campId && pd.encId===encId;
  if(open) return {open:true, icon:'&#128994;', text:'Player Display: Connected'};
  return {open:false, icon:'&#9898;', text:'Player Display: Closed'};
}
function openPlayerDisplay(campId, encId){
  if(typeof BroadcastChannel==='undefined'){
    toast("This browser doesn't support the same-computer player display.", true);
    return;
  }
  UI.playerDisplay.campId = campId; UI.playerDisplay.encId = encId;
  getPlayerChannel();
  const url = location.pathname + '?playerdisplay=1&ch=' + encodeURIComponent(getDeviceId());
  PLAYER_WINDOW_REF = window.open(url, 'warden-player-display', 'width=1200,height=800');
  if(!PLAYER_WINDOW_REF){
    toast('Your browser blocked the popup — allow popups for this page and try again.', true);
    return;
  }
  toast('Player Display opening — drag it to your projector/second screen, then use its Fullscreen button.');
  broadcastPlayerDisplayState(campId, encId);
  startPlayerPingLoop();
  render();
}
window.openPlayerDisplay = openPlayerDisplay;
function closePlayerDisplay(){
  if(PLAYER_WINDOW_REF && !PLAYER_WINDOW_REF.closed) PLAYER_WINDOW_REF.close();
  UI.playerDisplay.open = false;
  render();
}
window.closePlayerDisplay = closePlayerDisplay;
/* Optional, explicit opt-in: sanitized initiative info for the player display.
   Only ever name + result (or just current-turn name) — never HP, AC, ability
   scores, conditions, or any other private data, regardless of participant kind. */
function sanitizedInitiativeForPlayers(enc){
  if(!enc.useInitiative) return null;
  if(!enc.showInitiativeToPlayers && !enc.showTurnToPlayers) return null;
  const sorted = [...enc.participants].sort((a,b)=> (b.initiative??-999)-(a.initiative??-999));
  const currentId = enc.participants[enc.turnIndex] ? enc.participants[enc.turnIndex].id : null;
  const out = { round: enc.round };
  if(enc.showInitiativeToPlayers){
    out.order = sorted.map(p=>({ name:p.name, result:p.initiative, isCurrent:p.id===currentId }));
  } else if(enc.showTurnToPlayers){
    const current = enc.participants[enc.turnIndex];
    out.currentTurnName = current ? current.name : null;
  }
  return out;
}
function broadcastPlayerDisplayState(campId, encId){
  const ch = getPlayerChannel();
  if(!ch) return;
  const enc = getEncounter(campId, encId);

}
let _playerPingTimer = null;

      </div>

  const initEl = document.getElementById('player-initiative');

  function resize(){
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    redraw();
  }
  function redraw(){
    if(!currentState){ drawMapToCanvas(canvas, null, {emptyMessage:'Waiting for the DM\u2019s map…'}); return; }
    // Fit the map to the window while preserving aspect ratio.
    const scale = Math.min(canvas.width/currentState.imageWidth, canvas.height/currentState.imageHeight) || 1;
    const pan = { x:(canvas.width-currentState.imageWidth*scale)/2, y:(canvas.height-currentState.imageHeight*scale)/2 };
    drawMapToCanvas(canvas, currentState, {pan, zoom:scale, dmMode:false});
    waitingEl.style.display = 'none';
  }
  function renderInitiative(info){
    if(!info){ initEl.style.display='none'; return; }
    initEl.style.display = 'block';

      initEl.innerHTML = `<b>Round ${info.round}</b><br>` + info.order.map(o=>
        `<span style="${o.isCurrent?'color:#c9a227;font-weight:600;':''}">${esc(o.name)}${o.result!==null&&o.result!==undefined?' — '+o.result:''}</span>`
      ).join('<br>');
    } else if(info.currentTurnName){
      initEl.innerHTML = `<b>Round ${info.round}</b><br>Current turn: <span style="color:#c9a227;font-weight:600;">${esc(info.currentTurnName)}</span>`;
    } else {
      initEl.style.display = 'none';
    }
  }
  window.addEventListener('resize', resize);
  fsBtn.onclick = ()=>{
    if(document.fullscreenElement) document.exitFullscreen();
    else document.body.requestFullscreen().catch(()=>toast && toast('Fullscreen was blocked by the browser.'));
  };

  const ch = new BroadcastChannel('warden-playerlink-'+channelDeviceId);
  ch.onmessage = (ev)=>{
    const msg = ev.data;
    if(msg.type==='map-state'){ currentState = msg.payload; statusEl.textContent = msg.encounterName || 'Connected'; redraw(); renderInitiative(msg.initiative); }
    else if(msg.type==='no-map'){ currentState = null; statusEl.textContent = 'No map selected'; redraw(); renderInitiative(null); }
    else if(msg.type==='ping'){ ch.postMessage({type:'pong'}); }
  };
  window.addEventListener('beforeunload', ()=>{ try{ ch.postMessage({type:'closing'}); }catch(e){} });
  ch.postMessage({type:'pong'}); // announce presence immediately on open
  resize();
}


/* ===================================================================
   27. CREATURE MODIFIER SYSTEM
   A reusable, "no-code" way to take any base Creature Template and
   layer one or more Modifiers on top of it (Undead, Elite, Weak,
   custom homebrew, etc.) to produce a MODIFIED creature — without
   ever touching the original template.

   Design, in plain terms:
   - A Modifier is a saved template of its own (DB.modifiers), made of
     a list of Effects (ability changes, AC/HP/speed/save/skill
     bonuses, attack & damage changes, resistances, added/removed
     traits...). Effects never store an absolute replacement value for
     ability/stat/save/skill/attack-roll math — only ADDITIVE
     adjustments, exactly as requested ("adjustments... not
     replacement values"). Attack damage formulas are the one place
     replace/multiply modes make sense, and those are explicit,
     separate, user-chosen options (never guessed).
   - Effects that scale use one shared, pure function (evalScaling)
     with 6 interchangeable methods, including a safe hand-written
     formula parser (safeEvalFormula) — no eval(), no Function(),
     no arbitrary JS execution of any kind. See that function for the
     full description of what it accepts and rejects.
   - computeModifiedCreature() is the single calculation pipeline: it
     takes a base template + an ordered list of modifier ids + a
     scaling "level" (explicitly NOT the same thing as Challenge
     Rating — CR is left completely alone) and returns a brand-new,
     fully independent creature object plus a breakdown of exactly
     how every changed stat was derived, plus any warnings.
   - That computed creature is what actually gets used — as a
     temporary combat instance (instanceFromTemplateWithModifiers,
     mirroring the existing instanceFromTemplate pattern exactly) or
     saved as a reusable "variant" creature template
     (saveCreatureVariant) that sits in the normal Creature Library
     next to everything else, completely independent of the base
     creature from that point on.
   - None of this touches how templates, campaigns, encounters, or
     the existing dice roller work; it only reads them and adds a new
     parallel system next to them, reusing rollExpression/rollD20 for
     actual dice rolls and the existing sync/merge engine's patterns
     (stampSync, soft-delete, field-level merge) for its own storage.
=================================================================== */

/* ---- Data model ---- */
function blankModifier(){
  return {
    id: uid('mod'),
    name: 'New Modifier',
    description: '',
    icon: '', // free-text short label/emoji, purely cosmetic
    category: '', // free-text grouping, e.g. "Undead", "Elite" — not a fixed enum
    tags: [],
    levelMin: null, levelMax: null, // optional scaling-level restriction
    allowedSizes: [], allowedTypes: [], // optional restriction on which creatures may receive this (empty = no restriction)
    stacking: 'unique', // 'unique' (default: can't add the same modifier twice to one creature) | 'stack' (duplicates allowed)
    enabled: true,
    effects: [], // see EFFECT_KINDS below
    createdAt: nowISO(), updatedAt: nowISO(),
    deviceId: getDeviceId(), version: 0, deletedAt: null,
  };
}

/* Every effect kind this engine understands, with beginner-friendly labels
   used directly in the modifier-builder UI. "group" is just for organizing
   the "+ Add Effect" menu into sections that match the spec's own grouping. */
const EFFECT_KINDS = [
  {kind:'ability_score', group:'Ability Scores', label:'Change an Ability Score', hint:'Adds to the raw score (e.g. STR 14 → 16). This can shift the derived modifier too.'},
  {kind:'ability_mod', group:'Ability Scores', label:'Change an Ability Modifier directly', hint:'Adds straight to the modifier (e.g. +2 to the DEX modifier) without touching the score itself.'},
  {kind:'stat', group:'Core Stats', label:'Change a Stat (AC, HP, Speed, etc.)', hint:'A flat additive adjustment to one core stat.'},
  {kind:'save', group:'Core Stats', label:'Change a Saving Throw', hint:'Adds a bonus/penalty to one saving throw, on top of whatever it already was.'},
  {kind:'skill', group:'Core Stats', label:'Change a Skill Bonus', hint:'Adds a bonus/penalty to one named skill (creates it if the creature doesn’t have it yet).'},

  {kind:'immunity', group:'Defensive', label:'Add Damage Immunity', hint:'Immune to the selected damage type(s).'},

  {kind:'damage', group:'Offensive', label:'Change an Attack’s Damage', hint:'Add dice, replace the dice entirely, multiply the dice, or add a flat damage bonus — you choose exactly which.'},
  {kind:'trait_add', group:'Traits & Abilities', label:'Add a Trait', hint:'Adds a new named trait/ability with its own description.'},
  {kind:'trait_remove', group:'Traits & Abilities', label:'Remove a Trait', hint:'Removes an existing trait by name.'},

const STAT_TARGETS = {

const SCALING_METHODS = [
  {id:'flat', label:'Flat (same at every level)'},

function blankScaling(base){ return {method:'flat', base: base||0, perLevel:0, formula:''}; }
function blankEffect(kind){

    case 'attack_add':

        attackBonusScaling: blankScaling(0), dice:{count:1,sides:4}, diceCountScaling: blankScaling(0),
        flatScaling: blankScaling(0), damageType:'bludgeoning', save:''};
    case 'attack_remove':
      return {...common, targetList:'actions', targetName:''};
    case 'attack_roll':

    case 'damage':

        dice:{count:1,sides:4}, diceCountScaling: blankScaling(0), flatScaling: blankScaling(0),
        multiplyBy: 2, damageType:''};
